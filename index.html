  if(calendarCheckedClientIds.has(client.id)){
    const cached = lastApptDisplay[client.id];
    if(cached){
      box.innerHTML = cached.html;
      if(cached.muted) box.classList.add('muted-note');
    }
    return;
  }
  const emails = clientInviteEmails(client);
  if(!emails.length) return;
  const events = await fetchUpcomingRangeEvents(180);
  const stillThere = document.getElementById('nextApptInfo');
  if(!stillThere) return; // user navigated away while loading
  calendarCheckedClientIds.add(client.id);

  // Always operate on the current, live client object — state may have been
  // replaced by a Firestore snapshot while the network requests above were in flight.
  const liveClient = state.clients.find(c => c.id === client.id) || client;

  if(events === null){
    const html = '📅 Takvim kontrol edilemedi (Google bağlantısı gerekebilir).';
    stillThere.textContent = html;
    stillThere.classList.add('muted-note');
    lastApptDisplay[client.id] = { html, muted: true };
    return;
  }

  const today = todayIso();
  const matches = events.filter(ev=>{
    const attendees = ev.attendees || [];
    // Match on either person: a session with only the second person invited belongs to this client too.
    const isMatch = attendees.some(a => emails.includes((a.email||'').trim().toLowerCase()));
    if(!isMatch) return false;
    const start = ev.start && (ev.start.dateTime || ev.start.date);
    if(!start) return false;
    return start.slice(0,10) >= today;
  });

  // Sync: create a session record for any calendar appointment that doesn't have one yet,
  // and keep the date of already-linked sessions up to date if it changed on Calendar.
  let changed = false;
  matches.forEach(ev=>{
    const start = ev.start.dateTime || ev.start.date;
    const dateOnly = start.slice(0,10);
    const startTime = ev.start && ev.start.dateTime ? ev.start.dateTime : null;
    const endTime = ev.end && ev.end.dateTime ? ev.end.dateTime : null;
    const calId = ev._calendarId || 'primary';
    const wasDetached = liveClient.sessions.some(s => s.detachedFromEventId === ev.id);
    if(wasDetached) return; // deliberately detached into manual mode — don't recreate
    let session = liveClient.sessions.find(s => s.calendarEventId === ev.id);
    if(session){
      if(session.date !== dateOnly){
        session.date = dateOnly;
        changed = true;
      }
      if(session.calendarStartTime !== startTime){
        session.calendarStartTime = startTime;
        changed = true;
      }
      if(session.calendarEndTime !== endTime){
        session.calendarEndTime = endTime;
        changed = true;
      }
      if(session.calendarId !== calId){
        session.calendarId = calId;
        changed = true;
      }
    }else{
      const attendeeEmails = (ev.attendees || []).map(a => (a.email||'').trim().toLowerCase());
      const sp = liveClient.profile && liveClient.profile.secondPerson;
      const spInvited = !!(sp && sp.email && sp.email.trim()) && attendeeEmails.includes(sp.email.trim().toLowerCase());
      const pEmail = ((liveClient.profile && liveClient.profile.email) || '').trim().toLowerCase();
      const primaryInvited = !!pEmail && attendeeEmails.includes(pEmail);
      const onlySecond = spInvited && !!pEmail && !primaryInvited;
      const invitedBoth = (sp && sp.email && sp.email.trim()) ? (spInvited && !onlySecond) : undefined;
      const attendee = invitedBoth === false ? (onlySecond ? 'second' : 'primary') : undefined;
      liveClient.sessions.push({
        id: uid(),
        date: dateOnly,
        paymentDone:false, invoiceDone:false, notesDone:false,
        nextNote:'', nextDone:false,
        adminNote:'',
        calendarEventId: ev.id,
        calendarStartTime: startTime,
        calendarEndTime: endTime,
        calendarId: calId,
        invitedBoth, attendee
      });
      changed = true;
    }
  });

  // Detect sessions linked to a calendar event that no longer exists (cancelled directly
  // in Google Calendar, outside the app) and remove them too — today-forward only.
  const matchedEventIds = new Set(matches.map(ev => ev.id));
  const cancelledElsewhere = liveClient.sessions.filter(s =>
    s.calendarEventId && s.date >= today && !matchedEventIds.has(s.calendarEventId)
  );
  if(cancelledElsewhere.length){
    liveClient.sessions = liveClient.sessions.filter(s => !cancelledElsewhere.includes(s));
    changed = true;
    const me = currentPersonId();
    if(me){
      cancelledElsewhere.forEach(s=>{
        pushInAppNotification(me, `${liveClient.name} adlı danışanın ${formatShortDate(s.date)} tarihli randevusu Takvim'den iptal edildi.`, 'calendarCancelled');
      });
    }
  }

  if(changed){
    liveClient.sessions.sort((a,b)=> (b.date||'').localeCompare(a.date||''));
    saveState();
  }

  const displayCandidates = matches.filter(ev=>{
    const end = ev.end && (ev.end.dateTime || ev.end.date);
    if(!end) return true;
    return new Date(end).getTime() > Date.now();
  });

  if(!displayCandidates.length){
    const html = '📅 Google Takviminde planlı bir randevu bulunamadı.';
    stillThere.textContent = html;
    stillThere.classList.add('muted-note');
    lastApptDisplay[client.id] = { html, muted: true };
  }else{
    displayCandidates.sort((a,b)=>{
      const sa = a.start.dateTime || a.start.date;
      const sb = b.start.dateTime || b.start.date;
      return sa.localeCompare(sb);
    });
    const soonest = displayCandidates[0];
    const start = soonest.start.dateTime || soonest.start.date;
    const dateOnly = start.slice(0,10);
    const label = soonest.start.dateTime
      ? `${turkishDayName(dateOnly)}, ${formatShortDate(dateOnly)} ${formatEventTime(start)}`
      : `${turkishDayName(dateOnly)}, ${formatShortDate(dateOnly)}`;
    const fullLabel = `${label}${soonest.summary ? ` — ${soonest.summary}` : ''}`;
    const html = `📅 Sonraki randevu (Takvimden otomatik): <strong>${escapeHtml(fullLabel)}</strong>`;
    stillThere.innerHTML = html;
    lastApptDisplay[client.id] = { html, muted: false };
  }

  if(changed){
    render();
  }
}

function syncSessionDateForCalendarEvent(client, eventId, newDate){
  const session = client.sessions.find(s => s.calendarEventId === eventId);
  if(session && session.date !== newDate){
    session.date = newDate;
    saveState();
    return true;
  }
  return false;
}

function removeSessionForCalendarEvent(client, eventId){
  const before = client.sessions.length;
  client.sessions = client.sessions.filter(s => s.calendarEventId !== eventId);
  if(client.sessions.length !== before){
    saveState();
    return true;
  }
  return false;
}

async function loadCalendarDayEvents(panel, client){
  const dtBtn = panel.querySelector('.cal-datetime-btn');
  const dateStr = dtBtn ? dtBtn.getAttribute('data-date') : '';
  const box = panel.querySelector('.cal-day-events');
  if(!dateStr){ box.textContent = 'Tarih seçince görünecek…'; return; }
  box.textContent = 'Yükleniyor…';
  const extraBox = (()=>{
    let el = panel.querySelector('.cal-extra-events');
    if(!el){ el = document.createElement('div'); el.className = 'cal-extra-events'; box.parentNode.insertBefore(el, box.nextSibling); }
    el.innerHTML = '';
    return el;
  })();
  if(getExtraCalendars().length){
    fetchExtraEventsForDay(dateStr).then(items => {
      const cur = panel.querySelector('.cal-datetime-btn');
      if(!cur || cur.getAttribute('data-date') !== dateStr) return;
      extraBox.innerHTML = items ? extraEventsHtml(items) : '';
    }).catch(()=>{});
  }
  const events = await fetchDayEvents(dateStr);
  if(events === null){
    box.textContent = 'Randevular yüklenemedi (Google bağlantısı gerekebilir).';
    return;
  }
  if(!events.length){
    box.innerHTML = `<div class="cal-day-empty">Bu günde mevcut randevu yok — boş.</div>`;
    return;
  }
  box.innerHTML = events.map(ev=>{
    const timeLabel = ev.start && ev.start.dateTime ? formatEventTime(ev.start.dateTime) : 'Tüm gün';
    return `<div class="cal-day-event-row" data-event-id="${ev.id}" data-calendar-id="${escapeAttr(ev._calendarId||'primary')}">
      <span class="cal-day-event-time">${timeLabel}</span>
      <span class="cal-day-event-title">${escapeHtml(ev.summary||'(başlıksız)')}</span>
      <button class="cal-event-edit-btn" type="button" title="Yeniden planla">✏️</button>
      <button class="cal-event-cancel-btn" type="button" title="İptal et">✕</button>
    </div>`;
  }).join('');

  box.querySelectorAll('.cal-event-cancel-btn').forEach(btn=>{
    btn.addEventListener('click', async (ev)=>{
      const row = ev.target.closest('.cal-day-event-row');
      const eventId = row.getAttribute('data-event-id');
      const calendarId = row.getAttribute('data-calendar-id') || 'primary';
      if(!confirm('Bu randevu iptal edilsin mi? Danışana bilgilendirme gider.')) return;
      btn.disabled = true;
      const linked = (client.sessions||[]).find(s => s.calendarEventId === eventId);
      const origStart = linked ? linked.calendarStartTime : null;
      const ok = await cancelCalendarEvent(eventId, calendarId);
      if(ok){
        const sessionRemoved = removeSessionForCalendarEvent(client, eventId);
        logAudit('randevu iptal edildi', `${client.name} - ${dateStr}`, client.id);
        if(sessionRemoved){ render(); }
        else{ loadCalendarDayEvents(panel, client); }
        maybeRecordLateChange(client, 'cancel', dateStr, origStart);
      }else{
        alert('Randevu iptal edilemedi.'); btn.disabled = false;
      }
    });
  });
  box.querySelectorAll('.cal-event-edit-btn').forEach(btn=>{
    btn.addEventListener('click', (ev)=>{
      const row = ev.target.closest('.cal-day-event-row');
      const eventId = row.getAttribute('data-event-id');
      const calendarId = row.getAttribute('data-calendar-id') || 'primary';
      const timeEl = row.querySelector('.cal-day-event-time');
      const currentTimeLabel = (timeEl && timeEl.textContent !== 'Tüm gün') ? timeEl.textContent : '10:00 AM';

      openReschedulePopover({
        conflictCheck: { durationMinutes: 50, skipEventId: eventId },
        initialDate: dateStr,
        initialTimeLabel: currentTimeLabel,
        onConfirm: async (newDate, newTimeLabel)=>{
          const newTime = parseAmPmTime(newTimeLabel);
          if(!newTime) return;
          btn.disabled = true;
          const linked = (client.sessions||[]).find(s => s.calendarEventId === eventId);
          const origStart = linked ? linked.calendarStartTime : null;
          const ok = await rescheduleCalendarEvent(eventId, newDate, newTime, calendarId);
          if(ok){
            const sessionUpdated = syncSessionDateForCalendarEvent(client, eventId, newDate);
            logAudit('randevu yeniden planlandı', `${client.name} - ${dateStr} → ${formatShortDate(newDate)}`, client.id);
            if(sessionUpdated){ render(); }
            else{ loadCalendarDayEvents(panel, client); }
            if(newDate !== dateStr || newTimeLabel !== currentTimeLabel) maybeRecordLateChange(client, 'reschedule', dateStr, origStart, linked);
          }else{
            alert('Randevu güncellenemedi.'); btn.disabled = false;
          }
        }
      });
    });
  });
}

function wireCalendarPanel(client){
  const panel = document.getElementById('calendarPanel');

  const dtBtn = panel.querySelector('.cal-datetime-btn');
  dtBtn.addEventListener('click', ()=>{
    openReschedulePopover({
      title: 'Randevu Tarih ve Saati Seç',
      initialDate: dtBtn.getAttribute('data-date'),
      initialTimeLabel: dtBtn.getAttribute('data-time') || '10:00 AM',
      onConfirm: (newDate, newTimeLabel)=>{
        dtBtn.setAttribute('data-date', newDate);
        dtBtn.setAttribute('data-time', newTimeLabel);
        dtBtn.textContent = calDateTimeButtonLabel(newDate, newTimeLabel);
        loadCalendarDayEvents(panel, client);
      }
    });
  });
  if(panel.classList.contains('open')) loadCalendarDayEvents(panel, client);

  panel.querySelector('.cal-repeat').addEventListener('change', (ev)=>{
    panel.querySelector('.cal-repeat-options').style.display = ev.target.checked ? 'block' : 'none';
  });

  const titleInput = panel.querySelector('.cal-title');
  let titleManuallyEdited = false;
  titleInput.addEventListener('input', ()=>{ titleManuallyEdited = true; });

  const withSel = panel.querySelector('.cal-with');
  function updateDefaultInviteTitle(){
    if(titleManuallyEdited) return;
    const names = [];
    if(withSel && withSel.value){
      const a = client.name, b = client.profile.secondPerson.name.trim();
      titleInput.value = `${withSel.value === 'both' ? a + ' & ' + b : (withSel.value === 'second' ? b : a)}-Psychotherapy Session`;
      return;
    }
    const singleCb = panel.querySelector('.cal-invite');
    const primaryCb = panel.querySelector('.cal-invite-primary');
    const secondCb = panel.querySelector('.cal-invite-second');
    if(singleCb && singleCb.checked) names.push(client.name);
    if(primaryCb && primaryCb.checked) names.push(client.name);
    if(secondCb && secondCb.checked && client.profile.secondPerson) names.push(client.profile.secondPerson.name || 'İkinci Kişi');
    const nameLabel = names.length ? names.join(' & ') : client.name;
    titleInput.value = `${nameLabel}-Psychotherapy Session`;
  }
  [panel.querySelector('.cal-invite'), panel.querySelector('.cal-invite-primary'), panel.querySelector('.cal-invite-second')]
    .filter(Boolean)
    .forEach(cb => cb.addEventListener('change', updateDefaultInviteTitle));
  if(withSel) withSel.addEventListener('change', ()=>{
    // Pre-tick the invites to match who the session is for (still editable).
    const v = withSel.value;
    const pCb = panel.querySelector('.cal-invite-primary'), sCb = panel.querySelector('.cal-invite-second'), oneCb = panel.querySelector('.cal-invite');
    if(v){
      if(pCb && !pCb.disabled) pCb.checked = (v === 'both' || v === 'primary');
      if(sCb) sCb.checked = (v === 'both' || v === 'second');
      if(oneCb && !oneCb.disabled) oneCb.checked = (v === 'both' || v === 'primary');
    }
    updateDefaultInviteTitle();
  });

  panel.querySelector('.cal-create-btn').addEventListener('click', async ()=>{
    const title = panel.querySelector('.cal-title').value.trim();
    const dateStr = dtBtn.getAttribute('data-date');
    const timeRaw = dtBtn.getAttribute('data-time');
    const timeStr = parseAmPmTime(timeRaw);
    const durationMinutes = Number(panel.querySelector('.cal-duration').value);
    const inviteEmails = [];
    const singleInviteCb = panel.querySelector('.cal-invite');
    const primaryInviteCb = panel.querySelector('.cal-invite-primary');
    const secondInviteCb = panel.querySelector('.cal-invite-second');
    if(singleInviteCb && singleInviteCb.checked && client.profile && client.profile.email){
      inviteEmails.push(client.profile.email.trim());
    }
    if(primaryInviteCb && primaryInviteCb.checked && client.profile && client.profile.email){
      inviteEmails.push(client.profile.email.trim());
    }
    if(secondInviteCb && secondInviteCb.checked && client.profile && client.profile.secondPerson && client.profile.secondPerson.email){
      inviteEmails.push(client.profile.secondPerson.email.trim());
    }
    if(withSel && !withSel.value){
      alert('Randevunun kim için olduğunu seç (birlikte ya da tek kişi).');
      withSel.focus();
      return;
    }
    const invitedBoth = withSel ? (withSel.value === 'both') : (secondInviteCb ? (!!(primaryInviteCb && primaryInviteCb.checked) && secondInviteCb.checked) : undefined);
    const attendee = withSel ? (withSel.value === 'both' ? undefined : withSel.value) : ((secondInviteCb && invitedBoth === false) ? (secondInviteCb.checked ? 'second' : ((primaryInviteCb && primaryInviteCb.checked) ? 'primary' : undefined)) : undefined);
    const repeatWeekly = panel.querySelector('.cal-repeat').checked;
    const repeatWeeks = Math.max(2, Math.min(52, Number(panel.querySelector('.cal-repeat-weeks').value) || 8));
    if(!title || !dateStr || !timeRaw){
      alert('Başlık, tarih ve saat gerekli.');
      return;
    }
    if(!timeStr){
      alert('Saat formatı geçersiz. Örnek: 2:30 PM ya da 10:00 AM şeklinde gir.');
      return;
    }
    const btn = panel.querySelector('.cal-create-btn');
    btn.disabled = true;

    const startsInPast = dateStr < todayIso() || new Date(`${dateStr}T${timeStr}:00`).getTime() < Date.now();
    if(startsInPast){
      // Past date/time: don't send a real Calendar invite — just create a manual session note.
      const newSession = {
        id: uid(), date: dateStr,
        paymentDone:false, invoiceDone:false, notesDone:false,
        nextNote:'', nextDone:false, adminNote:'',
        calendarEventId: null, calendarId: null, calendarEndTime: null,
        calendarStartTime: timeStr ? `${dateStr}T${timeStr}:00` : null,
        invitedBoth, attendee
      };
      const liveClientPast = state.clients.find(c => c.id === client.id) || client;
      if(!Array.isArray(liveClientPast.sessions)) liveClientPast.sessions = [];
      liveClientPast.sessions.push(newSession);
      liveClientPast.sessions.sort((a,b)=> (b.date||'').localeCompare(a.date||''));
      markPreviousSessionAsNext(client, dateStr, title);
      saveState();
      logAudit('seans elle oluşturuldu', `${client.name} - ${formatShortDate(dateStr)}`, client.id);
      calendarViewCache = {};
      btn.disabled = false; btn.textContent = 'Randevu Oluştur';
      alert('Geçmiş tarihli seans notu oluşturuldu (Takvim daveti gönderilmedi).');
      panel.classList.remove('open');
      render();
      return;
    }

    // Clashes with the main calendar or the extra calendars: warn (never block) before creating anything.
    const skipDates = new Set();
    btn.textContent = 'Kontrol ediliyor…';
    if(repeatWeekly){
      const base0 = new Date(dateStr + 'T00:00:00');
      const weekDates = Array.from({ length: repeatWeeks }, (_, i) => isoDate(addDaysLocal(base0, i*7)));
      const checked = await Promise.all(weekDates.map(async d => ({ dateStr: d, issues: await calendarConflictIssues(d, timeStr, durationMinutes).catch(()=>[]) })));
      const problems = checked.filter(c => c.issues.length);
      if(problems.length){
        const choice = await askConflictWarning(problems, problems.length < repeatWeeks);
        if(!choice){ btn.disabled = false; btn.textContent = 'Randevu Oluştur'; return; }
        if(choice === 'skip') problems.forEach(pr => skipDates.add(pr.dateStr));
      }
    }else if(!(await confirmNoConflict(dateStr, timeStr, durationMinutes))){
      btn.disabled = false; btn.textContent = 'Randevu Oluştur'; return;
    }

    if(repeatWeekly){
      const baseDate = new Date(dateStr + 'T00:00:00');
      let successCount = 0;
      for(let i = 0; i < repeatWeeks; i++){
        btn.textContent = `Oluşturuluyor… (${i+1}/${repeatWeeks})`;
        const d = addDaysLocal(baseDate, i*7);
        const dStr = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
        if(skipDates.has(dStr)) continue; // skipped in the clash warning
        const created = await createCalendarEvent(client, { title, dateStr: dStr, timeStr, durationMinutes, inviteEmails });
        if(created){
          successCount++;
          // Re-resolve every time: state may have been replaced by a snapshot during the awaits above.
          const liveClient = state.clients.find(c => c.id === client.id) || client;
          liveClient.sessions.push({
            id: uid(), date: dStr,
            paymentDone:false, invoiceDone:false, notesDone:false,
            nextNote:'', nextDone:false, adminNote:'',
            calendarEventId: created.id, calendarId: 'primary',
            calendarStartTime: created.startIso, calendarEndTime: created.endIso,
            invitedBoth, attendee
          });
        }
        await new Promise(r => setTimeout(r, 300));
      }
      const liveClientAfter = state.clients.find(c => c.id === client.id) || client;
      liveClientAfter.sessions.sort((a,b)=> (b.date||'').localeCompare(a.date||''));
      saveState();
      if(successCount) logAudit('randevu oluşturuldu (haftalık tekrar)', `${client.name} - ${successCount} hafta`, client.id);
      calendarViewCache = {};
      btn.disabled = false; btn.textContent = 'Randevu Oluştur';
      alert(`${successCount} / ${repeatWeeks - skipDates.size} randevu Google Takvimine eklendi.` + (skipDates.size ? ` ${skipDates.size} hafta çakışma nedeniyle atlandı.` : ''));
      calendarCheckedClientIds.delete(client.id);
      panel.classList.remove('open');
      if(successCount) markPreviousSessionAsNext(client, dateStr, title);
      render();
      loadNextAppointmentInfo(client);
      return;
    }

    btn.textContent = 'Oluşturuluyor…';
    const created = await createCalendarEvent(client, { title, dateStr, timeStr, durationMinutes, inviteEmails });
    btn.disabled = false; btn.textContent = 'Randevu Oluştur';
    if(created){
      alert('Randevu Google Takvimine eklendi.');
      const liveClient = state.clients.find(c => c.id === client.id) || client;
      liveClient.sessions.push({
        id: uid(), date: dateStr,
        paymentDone:false, invoiceDone:false, notesDone:false,
        nextNote:'', nextDone:false, adminNote:'',
        calendarEventId: created.id, calendarId: 'primary',
        calendarStartTime: created.startIso, calendarEndTime: created.endIso,
        invitedBoth, attendee
      });
      liveClient.sessions.sort((a,b)=> (b.date||'').localeCompare(a.date||''));
      markPreviousSessionAsNext(client, dateStr, title);
      saveState();
      logAudit('randevu oluşturuldu', `${client.name} - ${formatShortDate(dateStr)}`, client.id);
      calendarViewCache = {};
      calendarCheckedClientIds.delete(client.id);
      panel.classList.remove('open');
      render();
      loadNextAppointmentInfo(client);
    }else{
      loadCalendarDayEvents(panel, client);
    }
  });
}

function markPreviousSessionAsNext(client, newDateStr, title){
  const liveClient = state.clients.find(c => c.id === client.id) || client;
  const priorSessions = (liveClient.sessions||[]).filter(s => s.date && s.date < newDateStr);
  if(!priorSessions.length) return;
  priorSessions.sort((a,b)=> b.date.localeCompare(a.date));
  const prev = priorSessions[0];
  prev.nextDone = true;
  prev.nextNote = `${formatShortDate(newDateStr)} - ${title}`;
  saveState();
}

function askSyncLinkedSessionChange(){
  return new Promise((resolve)=>{
    const modal = document.createElement('div');
    modal.className = 'backups-modal';
    modal.style.display = 'flex';
    modal.innerHTML = `
      <div class="backups-box" style="max-width:380px;">
        <div class="backups-box-header">
          <h2>Bu seans Takvim ile bağlantılı</h2>
        </div>
        <div style="padding:0 20px 20px; display:flex; flex-direction:column; gap:8px;">
          <p style="font-size:12.5px; color:var(--muted); margin:0 0 4px;">Bu değişiklik Google Takvim davetiyesine de yansısın mı?</p>
          <button class="settings-btn del-choice-btn" data-choice="sync" style="width:100%;">Evet, Takvim'i de Güncelle</button>
          <button class="settings-btn del-choice-btn" data-choice="manual" style="width:100%;">Hayır, Sadece Burada Değiştir (Elle Moduna Geç)</button>
          <button class="reschedule-cancel-btn" data-choice="revert" style="width:100%; margin-top:4px;">Vazgeç, Takvimdeki Saate Dön</button>
        </div>
      </div>
    `;
    document.body.appendChild(modal);
    modal.querySelectorAll('[data-choice]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const choice = btn.getAttribute('data-choice');
        modal.remove();
        resolve(choice === 'revert' ? null : choice);
      });
    });
    modal.addEventListener('click', (ev)=>{
      if(ev.target === modal){ modal.remove(); resolve(null); }
    });
  });
}

  return new Promise((resolve)=>{
    const modal = document.createElement('div');
    modal.className = 'backups-modal';
    modal.style.display = 'flex';
    modal.innerHTML = `
      <div class="backups-box" style="max-width:380px;">
        <div class="backups-box-header">
          <h2>Bu seans Takvim ile bağlantılı</h2>

      panel.classList.add('open');

      document.getElementById('todoPanel').classList.add('open');

    row.querySelector('.todo-item-duedate-input').addEventListener('change', (ev)=>{

  });

/* ---------- Late changes: a session cancelled or moved within 24 hours of its start ---------- */
// Stored in two places: a rescheduled session keeps a `lateChange` mark on itself;
// a cancelled one no longer exists, so it goes into the client's `lateChanges` log.
const LATE_CHANGE_WINDOW_MS = 24*60*60*1000;

function sessionStartMs(dateStr, startIso){
  if(startIso){ const t = new Date(startIso).getTime(); if(!isNaN(t)) return t; }
  return dateStr ? new Date(dateStr + 'T09:00:00').getTime() : NaN; // no time known: assume morning
}

function isLateChangeWindow(dateStr, startIso){
  if(!dateStr) return false;
  // Anything from 24 hours before the start onwards counts, including sessions whose time has already passed.
  const ms = sessionStartMs(dateStr, startIso);
  return !isNaN(ms) && (ms - Date.now()) <= LATE_CHANGE_WINDOW_MS;
}

function askLateChange(kind, dateStr, startIso){
  const past = sessionStartMs(dateStr, startIso) < Date.now();
  return new Promise((resolve)=>{
    const modal = document.createElement('div');
    modal.className = 'backups-modal';
    modal.style.display = 'flex';
    const word = kind === 'cancel' ? 'iptal' : 'erteleme';
    modal.innerHTML = `
      <div class="backups-box" style="max-width:380px;">
        <div class="backups-box-header"><h2>Geç ${word} mi?</h2></div>
        <div style="padding:0 20px 20px; display:flex; flex-direction:column; gap:8px;">
          <p style="font-size:13px; color:var(--muted); margin:0 0 4px;">${formatShortDate(dateStr)} tarihli ${past ? 'seansın zamanı geçmişti' : 'seansa 24 saatten az kalmıştı'}. Bu ${word} danışandan kaynaklıysa "geç ${word}" olarak istatistiğe eklenir.</p>
          <button class="settings-btn" id="lateChangeYes" style="width:100%;">Evet, geç ${word} olarak say</button>
          <button class="reschedule-cancel-btn" id="lateChangeNo" style="width:100%;">Hayır, sayma</button>
        </div>
      </div>`;
    document.body.appendChild(modal);
    const done = v => { modal.remove(); resolve(v); };
    document.getElementById('lateChangeYes').addEventListener('click', ()=> done(true));
    document.getElementById('lateChangeNo').addEventListener('click', ()=> done(false));
  });
}

// Called after a cancel/reschedule has gone through. Asks only when the session was within 24 hours.
async function maybeRecordLateChange(client, kind, dateStr, startIso, session){
  if(!isLateChangeWindow(dateStr, startIso)) return;
  if(!(await askLateChange(kind, dateStr, startIso))) return;
  const live = state.clients.find(c => c.id === client.id) || client;
  const liveSession = session ? (live.sessions || []).find(s => s.id === session.id) : null;
  if(kind === 'reschedule' && liveSession){
    liveSession.lateChange = { kind: 'reschedule', originalDate: dateStr, at: Date.now() };
  }else{
    if(!live.lateChanges) live.lateChanges = [];
    live.lateChanges.push({ id: uid(), kind, sessionDate: dateStr, at: Date.now() });
  }
  saveState();
  logAudit(kind === 'cancel' ? 'geç iptal kaydedildi' : 'geç erteleme kaydedildi', `${client.name} - ${formatShortDate(dateStr)}`, client.id);
  render();
}

// Every late change of one client as { kind, date } (date = the session's original date).
function clientLateChanges(client){
  const out = (client.lateChanges || []).map(l => ({ kind: l.kind, date: l.sessionDate }));
  (client.sessions || []).forEach(s => { if(s.lateChange) out.push({ kind: s.lateChange.kind, date: s.lateChange.originalDate || s.date }); });
  return out;
}

function lateChangeSummaryText(client){
  const list = clientLateChanges(client);
  if(!list.length) return 'Yok';
  const cancels = list.filter(l => l.kind === 'cancel').length;
  const moves = list.length - cancels;
  const parts = [];
  if(cancels) parts.push(`${cancels} iptal`);
  if(moves) parts.push(`${moves} erteleme`);
  return `${list.length} geç değişiklik (${parts.join(', ')})`;
}

function computeMonthlyLateChanges(monthsBack){
  const now = new Date();
  const buckets = [];
  const monthNames = ['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara'];
  for(let i = monthsBack-1; i >= 0; i--){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    buckets.push({ key: `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`, label: monthNames[d.getMonth()], total: 0, cancel: 0, reschedule: 0 });
  }
  const bucketMap = {};
  buckets.forEach(b => bucketMap[b.key] = b);
  (state.clients || []).forEach(c => clientLateChanges(c).forEach(l => {
    const b = bucketMap[(l.date || '').slice(0, 7)];
    if(!b) return;
    b.total++;
    if(l.kind === 'cancel') b.cancel++; else b.reschedule++;
  }));
  return buckets;
}

function getFilteredMonthlyLateChanges(filter){
  const shared = (practiceState && practiceState.stats) || {};
  const me = currentPersonId();
  const myBuckets = computeMonthlyLateChanges(12);
  const empty = { total: 0, cancel: 0, reschedule: 0 };
  const kub = (me === 'kubilay') ? myBuckets : alignBucketsToWindow(shared.kubilay && shared.kubilay.monthlyLateChanges, myBuckets, empty);
  const duy = (me === 'duygu') ? myBuckets : alignBucketsToWindow(shared.duygu && shared.duygu.monthlyLateChanges, myBuckets, empty);
  if(filter === 'kubilay') return kub || null;
  if(filter === 'duygu') return duy || null;
  if(!kub && !duy) return null;
  return (kub || duy).map((b, i) => ({
    key: b.key, label: b.label,
    total: (kub ? kub[i].total : 0) + (duy ? duy[i].total : 0),
    cancel: (kub ? kub[i].cancel : 0) + (duy ? duy[i].cancel : 0),
    reschedule: (kub ? kub[i].reschedule : 0) + (duy ? duy[i].reschedule : 0)
  }));
}

function lateChangeChartSvg(filter){
  const buckets = getFilteredMonthlyLateChanges(filter);
  if(!buckets){
    return `<div class="todo-empty">${filter==='kubilay'?'Kubilay':'Duygu'} henüz veri paylaşmadı.</div>`;
  }
  const max = Math.max(...buckets.map(b => b.total), 4);
  const width = 600, height = 190, barGap = 6, chartHeight = 130, topPad = 24;
  const barWidth = (width - barGap*(buckets.length-1)) / buckets.length;
  const bars = buckets.map((b, i)=>{
    const barHeight = b.total > 0 ? Math.max(3, (b.total/max) * chartHeight) : 0;
    const x = i * (barWidth + barGap);
    const y = chartHeight - barHeight + topPad;
    const label = b.total > 0 ? `<text x="${(x+barWidth/2).toFixed(1)}" y="${(y-6).toFixed(1)}" font-size="10" font-weight="600" fill="#2b2d33" text-anchor="middle">${b.total}</text>` : '';
    return `
      <rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barWidth.toFixed(1)}" height="${barHeight.toFixed(1)}" rx="3" fill="#f1d7a8"><title>${b.label}: ${b.total} geç değişiklik (${b.cancel} iptal, ${b.reschedule} erteleme)</title></rect>
      ${label}
      <text x="${(x+barWidth/2).toFixed(1)}" y="${height-8}" font-size="10" fill="#6b6f78" text-anchor="middle">${b.label}</text>`;
  }).join('');
  return `<svg viewBox="0 0 ${width} ${height}" style="width:100%; height:auto; display:block;">${bars}</svg>`;
}

function noShowSummaryText(client){
  const sessions = (client.sessions||[]).filter(s=>isSessionDue(s));

  if(total === 0) return 'Henüz seans yok.';
  if(noShowCount === 0) return `0 gelmedi (${total} seans)`;
  const pct = Math.round((noShowCount/total)*100);
  return `${noShowCount} gelmedi / ${total} seans (%${pct})`;
}

let sessionCollapseOverrides = {};

function hasNamedSecondPerson(client){
  return !!(client.profile && client.profile.secondPerson && client.profile.secondPerson.name && client.profile.secondPerson.name.trim());
}

function sessionWithLabel(client, session){
  if(!hasNamedSecondPerson(client)) return '';
  const a = (client.name || '').trim() || 'Birinci kişi';
  const b = client.profile.secondPerson.name.trim();
  if(session.invitedBoth === false){
    if(session.attendee === 'second') return '👤 ' + b;
    if(session.attendee === 'primary') return '👤 ' + a;
    return '👤 Bireysel — kim?';
  }
  return '👥 ' + a + ' & ' + b;
}

function getSessionFullRate(client, session){
  const ifhp = !!(client.profile && client.profile.ifhp);
  if(ifhp){
    return (session && session.isAssessment) ? 820 : 205;
  }
  if(hasNamedSecondPerson(client) && session && session.invitedBoth === false){
    return (client.profile.individualRate != null) ? Number(client.profile.individualRate) : 0;
  }
  return (client.profile && client.profile.rate != null) ? Number(client.profile.rate) : 0;
}

function isSessionFullyDone(session, client){
  const disabled = session.disabledChecks || [];
  const noInvoice = !!(client.profile && client.profile.noInvoice);
  const paymentOk = disabled.includes('paymentDone') || session.paymentDone;
  const invoiceOk = noInvoice || disabled.includes('invoiceDone') || session.invoiceDone;
  const notesOk = disabled.includes('notesDone') || session.notesDone;
  const nextOk = disabled.includes('nextDone') || session.nextDone;
  return paymentOk && invoiceOk && notesOk && nextOk;
}

function getDefaultOpenSessionId(client){
  const sessions = client.sessions || [];
  if(!sessions.length) return null;
  const pastSessions = sessions.filter(s => isSessionDue(s)).sort((a,b)=> (b.date||'').localeCompare(a.date||''));
  const futureSessions = sessions.filter(s => !isSessionDue(s)).sort((a,b)=> (a.date||'').localeCompare(b.date||''));

  if(pastSessions.length){
    const lastCompleted = pastSessions[0];
    if(!isSessionFullyDone(lastCompleted, client)) return lastCompleted.id;
    return futureSessions.length ? futureSessions[0].id : lastCompleted.id;
  }
  return futureSessions.length ? futureSessions[0].id : sessions[0].id;
}

function isSessionCollapsed(session, index, defaultOpenId){
  if(sessionCollapseOverrides.hasOwnProperty(session.id)) return sessionCollapseOverrides[session.id];
  return session.id !== defaultOpenId;
}

function renderSessionCard(client, session, index, defaultOpenId){

  const ifhpClient = !!(client.profile && client.profile.ifhp);

  div.innerHTML = `

      <button class="session-collapse-toggle" type="button" title="Daralt/Genişlet">${collapsed ? '▸' : '▾'}</button>

      ${(!isCalendarLinked && session.detachedFromEventId) ? `<button type="button" class="session-resync-btn" title="Takvimdeki orijinal randevuyla yeniden eşitle">🔄 Senkronize Et</button>` : ''}
      <button class="session-noshow-btn ${session.noShow?'active':''}" type="button" title="Danışan gelmedi olarak işaretle">🚫 ${session.noShow?'Gelmedi':'Gelmedi mi?'}</button>
      <button class="session-late-btn ${session.lateChange?'active':''}" type="button" title="Bu seans son 24 saat içinde iptal edildi ya da ertelendi">⏱ ${session.lateChange ? (session.lateChange.originalDate && session.lateChange.originalDate !== session.date ? `Geç erteleme (${formatShortDate(session.lateChange.originalDate)})` : 'Geç değişiklik') : 'Geç değişiklik?'}</button>
      <button class="session-del">Sil</button>
    </div>
    ${isFuture ? `
    <div class="future-session-banner">
      <span>📅 Bu randevu henüz gerçekleşmedi${isCalendarLinked ? ' — Takvim ile bağlantılı' : ''}.</span>
    </div>` : ''}
    <div class="session-card-body ${collapsed ? 'collapsed' : ''}">
    ${itemRow('Ödeme', boolLabel(session.paymentDone), 'paymentDone', session)}
    ${noInvoice ? `
    <div class="item-row invoice-blackout">
      <input type="checkbox" disabled>
      <span class="item-label">Fatura</span>
      <span class="item-value empty">Bu danışana fatura hazırlanmayacak</span>
    </div>` : itemRow('Fatura', boolLabel(session.invoiceDone), 'invoiceDone', session)}
    ${itemRow('Seans notları', boolLabel(session.notesDone), 'notesDone', session)}
    ${itemRowWithInput('Sonraki seans', 'nextDone', 'nextNote', session)}
    <div class="admin-notes-block">
      <label class="item-label">Admin notları</label>
      <textarea class="admin-note-input" placeholder="Bu danışanla ilgili yapılacak idari işler…">${escapeHtml(session.adminNote||'')}</textarea>
    </div>
    ${noInvoice ? `
    <div class="invoice-actions-blackout">Bu danışan için fatura/makbuz oluşturulmuyor</div>` : `
    ${ifhpClient ? `<div class="tick-row" style="margin-bottom:10px;"><input type="checkbox" class="session-assessment-toggle" ${session.isAssessment?'checked':''}><span>🩺 Bu bir Değerlendirme Seansı (CA$820) — işaretli değilse normal Terapi Seansı (CA$205)</span></div>` : ''}
    ${hasNamedSecondPerson(client) ? (()=>{
      const cur = session.invitedBoth === false ? (session.attendee || '') : 'both';
      const a = (client.name || '').trim() || 'Birinci kişi';
      const b = client.profile.secondPerson.name.trim();
      return `<div class="tick-row" style="margin-bottom:10px; flex-wrap:wrap; gap:6px;"><span>Bu seans kiminle?</span>
        <select class="session-with-select" style="flex:1 1 180px; min-width:0;">
          <option value="both" ${cur==='both'?'selected':''}>👥 Çift — ${escapeHtml(a)} & ${escapeHtml(b)}</option>
          ${cur==='' ? '<option value="" selected>👤 Bireysel — kim? (seç)</option>' : ''}
          <option value="primary" ${cur==='primary'?'selected':''}>👤 Bireysel — ${escapeHtml(a)}</option>
          <option value="second" ${cur==='second'?'selected':''}>👤 Bireysel — ${escapeHtml(b)}</option>
        </select>
        ${ifhpClient ? '' : '<span style="flex-basis:100%; font-size:12px; opacity:.7;">Bireysel seçilirse bireysel seans ücreti uygulanır.</span>'}</div>`;
    })() : ''}
    <div class="invoice-actions-label">Fatura / Makbuz</div>
    <div class="invoice-actions">
      <button class="invoice-save-btn" type="button">💻 Bilgisayara İndir</button>
      <button class="invoice-drive-btn" type="button" data-session-id="${escapeAttr(session.id)}">☁️ Drive'a Kaydet</button>
      <button class="invoice-share-btn" type="button">📤 Gönder</button>
      <div class="invoice-email-group">
        <button class="invoice-gmail-btn" type="button" title="Gmail'de ekli taslak oluştur">📧 Gmail Taslağı</button>
      </div>

  const toggleCollapse = ()=>{
    const body = div.querySelector('.session-card-body');
    const nowCollapsed = !body.classList.contains('collapsed');
    body.classList.toggle('collapsed', nowCollapsed);
    div.querySelector('.session-collapse-toggle').textContent = nowCollapsed ? '▸' : '▾';
    sessionCollapseOverrides[session.id] = nowCollapsed;
  };
  div.querySelector('.session-collapse-toggle').addEventListener('click', (ev)=>{
    ev.stopPropagation();
    toggleCollapse();
  });
  div.querySelector('.session-card-top').addEventListener('click', (ev)=>{
    if(ev.target.closest('.session-datetime-btn') || ev.target.closest('.session-del')) return;
    toggleCollapse();
  });

  div.querySelector('.session-del').addEventListener('click', async ()=>{
    if(isCalendarLinked){
      const choice = await askDeleteLinkedSession();
      if(!choice) return;
      if(choice === 'calendar-notify' || choice === 'calendar-silent'){
        const sendUpdates = choice === 'calendar-notify' ? 'all' : 'none';
        const ok = await cancelCalendarEvent(session.calendarEventId, session.calendarId || 'primary', sendUpdates);
        if(!ok){
          alert('Takvimdeki randevu iptal edilemedi, ama uygulamadan siliniyor.');
        }
      }
      client.sessions = client.sessions.filter(s=>s.id!==session.id);
      saveState(); render();
      logAudit('seans silindi', `${client.name} - ${formatShortDate(session.date)}`, client.id);
      maybeRecordLateChange(client, 'cancel', session.date, session.calendarStartTime);
    }else{
      if(confirm('Bu kayıt silinsin mi?')){
        client.sessions = client.sessions.filter(s=>s.id!==session.id);
        saveState(); render();
        logAudit('seans silindi', `${client.name} - ${formatShortDate(session.date)}`, client.id);
        maybeRecordLateChange(client, 'cancel', session.date, session.calendarStartTime);
      }
    }
  });
  div.querySelectorAll('.item-row input[type="checkbox"]:not([disabled])').forEach(cb=>{
    cb.addEventListener('change', (ev)=>{
      const key = ev.target.getAttribute('data-key');
      session[key] = ev.target.checked;
      saveState();
      if(key === 'paymentDone') checkUnpaidThreshold(client);
      render();
    });
  });
  div.querySelectorAll('.item-disable-toggle').forEach(btn=>{
    btn.addEventListener('click', (ev)=>{
      const key = ev.target.getAttribute('data-key');
      if(!session.disabledChecks) session.disabledChecks = [];
      const idx = session.disabledChecks.indexOf(key);
      if(idx === -1){
        session.disabledChecks.push(key);
      }else{
        session.disabledChecks.splice(idx, 1);
      }
      saveState();
      render();
    });
  });
  div.querySelector('.inline-note-input').addEventListener('blur', (ev)=>{
    session.nextNote = ev.target.value;
    saveState();
  });
  const resyncBtn = div.querySelector('.session-resync-btn');
  if(resyncBtn){
    resyncBtn.addEventListener('click', ()=>{
      if(!confirm('Bu seans, Takvimdeki orijinal randevuyla yeniden eşitlensin mi? Elle yaptığın değişiklikler, Takvimdeki güncel bilgiyle değiştirilecek.')) return;
      session.calendarEventId = session.detachedFromEventId;
      session.calendarId = session.detachedFromCalendarId || 'primary';
      session.detachedFromEventId = null;
      session.detachedFromCalendarId = null;
      saveState();
      logAudit('seans Takvim ile yeniden senkronize edildi', `${client.name} - ${formatShortDate(session.date)}`, client.id);
      calendarCheckedClientIds.delete(client.id);
      loadNextAppointmentInfo(client);
    });
  }
  div.querySelector('.session-datetime-btn').addEventListener('click', ()=>{
    const originalDate = session.date;
    const originalStartTime = session.calendarStartTime;
    openReschedulePopover({
      conflictCheck: {
        durationMinutes: (session.calendarStartTime && session.calendarEndTime) ? Math.max(15, Math.round((new Date(session.calendarEndTime) - new Date(session.calendarStartTime)) / 60000)) : 50,
        skipEventId: session.calendarEventId || session.detachedFromEventId
      },
      title: 'Seans Tarih ve Saatini Değiştir',
      initialDate: session.date,
      initialTimeLabel: session.calendarStartTime ? formatEventTime(session.calendarStartTime) : '10:00 AM',
      onConfirm: async (newDate, newTimeLabel)=>{
        const newTime24 = parseAmPmTime(newTimeLabel);
        const newStartIso = newTime24 ? `${newDate}T${newTime24}:00` : null;

        const changed = newDate !== originalDate || (newStartIso && newStartIso !== originalStartTime);
        if(!isCalendarLinked){
          session.date = newDate;
          if(newStartIso) session.calendarStartTime = newStartIso;
          saveState();
          render();
          if(changed) maybeRecordLateChange(client, 'reschedule', originalDate, originalStartTime, session);
          return;
        }

        const choice = await askSyncLinkedSessionChange();
        if(choice === 'sync'){
          if(!newTime24) return;
          const ok = await rescheduleCalendarEvent(session.calendarEventId, newDate, newTime24, session.calendarId || 'primary');
          if(ok){
            session.date = newDate;
            session.calendarStartTime = newStartIso;
            saveState();
            logAudit('randevu yeniden planlandı', `${client.name} - ${formatShortDate(originalDate)} → ${formatShortDate(newDate)}`, client.id);
            render();
            if(changed) maybeRecordLateChange(client, 'reschedule', originalDate, originalStartTime, session);
          }else{
            alert('Takvimdeki randevu güncellenemedi.');
          }
        }else if(choice === 'manual'){
          session.date = newDate;
          if(newStartIso) session.calendarStartTime = newStartIso;
          session.detachedFromEventId = session.calendarEventId;
          session.detachedFromCalendarId = session.calendarId;
          session.calendarEventId = null;
          session.calendarId = null;
          session.calendarEndTime = null;
          saveState();
          logAudit('seans elle moduna alındı', `${client.name} - ${formatShortDate(newDate)}`, client.id);
          render();
          if(changed) maybeRecordLateChange(client, 'reschedule', originalDate, originalStartTime, session);
        }else{
          // Vazgeç: revert to the original calendar time, discard the edit
          session.date = originalDate;
          session.calendarStartTime = originalStartTime;
          render();
        }
      }
    });
  });
  div.querySelector('.session-noshow-btn').addEventListener('click', ()=>{
    session.noShow = !session.noShow;
    saveState();
    render();
  });
  div.querySelector('.session-late-btn').addEventListener('click', ()=>{
    session.lateChange = session.lateChange ? null : { kind: 'reschedule', originalDate: session.date, at: Date.now(), manual: true };
    saveState();
    render();
  });
  div.querySelector('.admin-note-input').addEventListener('blur', (ev)=>{
    session.adminNote = ev.target.value;
    saveState();
  });
  const assessmentToggle = div.querySelector('.session-assessment-toggle');
  if(assessmentToggle){
    assessmentToggle.addEventListener('change', (ev)=>{
      session.isAssessment = ev.target.checked;
      saveState();
    });
  }
  const withSelect = div.querySelector('.session-with-select');
  if(withSelect){
    withSelect.addEventListener('change', (ev)=>{
      const v = ev.target.value;
      if(v === 'both'){ session.invitedBoth = true; delete session.attendee; }
      else if(v === 'primary' || v === 'second'){ session.invitedBoth = false; session.attendee = v; }
      else return;
      const badge = div.querySelector('.session-with-badge');
      if(badge){ badge.textContent = sessionWithLabel(client, session); badge.classList.toggle('unknown', false); }
      saveState();
    });
  }
  if(!noInvoice){
    div.querySelector('.invoice-save-btn').addEventListener('click', ()=>{
      generateInvoiceForSession(client, session, 'save');
    });
    const driveBtn = div.querySelector('.invoice-drive-btn');
    applyDriveInvoiceBtnState(driveBtn, session.id); // keep "Kaydediliyor…/Kaydedildi" across re-renders
    driveBtn.addEventListener('click', async ()=>{
      const sid = session.id;
      if(driveInvoiceBtnState[sid]) return; // already running for this session
      setDriveInvoiceBtnState(sid, { text: '⏳ Hazırlanıyor…', disabled: true });
      let allOk = false;
      try{
        const detailsList = await resolveInvoiceDetails(client, session);
        if(!detailsList){ setDriveInvoiceBtnState(sid, null); return; } // cancelled
        setDriveInvoiceBtnState(sid, { text: '⏳ Kaydediliyor…', disabled: true });
        allOk = true;
        for(const details of detailsList){
          const ok = await uploadPdfToDriveFolder(details.doc, details.filename);
          allOk = allOk && ok;
          const amountLabel = `${details.billToName || client.name} - CA$${details.rate.toFixed(2)}${details.invoiceNumber ? ' - #'+details.invoiceNumber : ''}`;
          logAudit(ok ? "fatura Drive'a kaydedildi" : "fatura Drive'a kaydedilemedi", amountLabel, client.id);
        }
      }catch(e){
        console.error("Drive'a kaydetme hatası", e);
        allOk = false;
      }
      setDriveInvoiceBtnState(sid, { text: allOk ? '✅ Kaydedildi' : '❌ Başarısız, tekrar dene', disabled: true });
      setTimeout(()=> setDriveInvoiceBtnState(sid, null), allOk ? 3000 : 4000);
    });
    div.querySelector('.invoice-share-btn').addEventListener('click', ()=>{
      generateInvoiceForSession(client, session, 'share');
    });
    div.querySelector('.invoice-gmail-btn').addEventListener('click', ()=>{
      generateInvoiceForSession(client, session, 'gmail');
    });
  }
  return div;
}

// Saving an invoice number calls saveState(), whose snapshot re-renders the page and replaces
// the button element. The status therefore lives here (per session) and is applied to whichever
// button is currently on screen, instead of to the element that was clicked.
const driveInvoiceBtnState = {};
const DRIVE_INVOICE_BTN_DEFAULT = "☁️ Drive'a Kaydet";

function applyDriveInvoiceBtnState(btn, sessionId){
  if(!btn) return;
  const st = driveInvoiceBtnState[sessionId];
  btn.textContent = st ? st.text : DRIVE_INVOICE_BTN_DEFAULT;
  btn.disabled = !!(st && st.disabled);
}

function setDriveInvoiceBtnState(sessionId, st){
  if(st) driveInvoiceBtnState[sessionId] = st;
  else delete driveInvoiceBtnState[sessionId];
  document.querySelectorAll('.invoice-drive-btn').forEach(b=>{
    if(b.getAttribute('data-session-id') === sessionId) applyDriveInvoiceBtnState(b, sessionId);
  });
}

function boolLabel(v){ return v ? 'Evet' : 'Hayır'; }

function itemRow(label, value, key, session){
  const empty = (value === '—');
  const disabled = (session.disabledChecks||[]).includes(key);
  return `
    <div class="item-row ${disabled?'item-disabled':''}">
      <input type="checkbox" data-key="${key}" ${session[key] ? 'checked' : ''} ${disabled?'disabled':''}>
      <span class="item-label">${label}</span>
      <span class="item-value ${empty?'empty':''}">${escapeHtml(value)}</span>
      <button class="item-disable-toggle" data-key="${key}" type="button" title="${disabled?'Bu maddeyi etkinleştir':'Bu seans için geçerli değil'}">${disabled?'↺':'🚫'}</button>
    </div>`;
}

function itemRowWithInput(label, checkboxKey, textKey, session){
  const disabled = (session.disabledChecks||[]).includes(checkboxKey);
  return `
    <div class="item-row ${disabled?'item-disabled':''}">
      <input type="checkbox" data-key="${checkboxKey}" ${session[checkboxKey] ? 'checked' : ''} ${disabled?'disabled':''}>

async function exportCurrentDataJson(){

  const stamp = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;

  if('showSaveFilePicker' in window){
    try{
      const handle = await window.showSaveFilePicker({
        suggestedName: filename,
        types: [{ description:'JSON dosyası', accept:{'application/json':['.json']} }]
      });
      const writable = await handle.createWritable();
      await writable.write(jsonText);
      await writable.close();
      return;
    }catch(e){
      if(e && e.name === 'AbortError') return; // user cancelled the picker
      console.error('Kaydetme penceresi başarısız, otomatik indirmeye geçiliyor', e);
    }
  }

  const blob = new Blob([jsonText], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

/* ---------- Manual task reminder e-mail (sent from the signed-in user's Gmail) ---------- */
const APP_URL = 'https://admin.ikitherapy.ca';
const PERSON_WORK_EMAIL = { kubilay: 'malik@ikitherapy.ca', duygu: 'duygu@ikitherapy.ca' };
const practiceRemindersSending = new Set();

function personDative(id){
  return id === 'kubilay' ? "Kubilay'a" : id === 'duygu' ? "Duygu'ya" : personLabel(id);
}

// Who gets reminded: only tasks I assigned to someone else (or shared tasks I created), not done.
function taskReminderTarget(task, me){
  if(!task || task.done || !me || task.assignedBy !== me) return null;
  if(task.assignedTo === 'both') return me === 'kubilay' ? 'duygu' : 'kubilay';
  if(task.assignedTo && task.assignedTo !== me) return task.assignedTo;
  return null;
}

function daysBetweenIso(fromIso, toIso){
  return Math.round((new Date(toIso + 'T00:00:00') - new Date(fromIso + 'T00:00:00')) / (24*60*60*1000));
}

function buildTaskReminderEmail(task, me, target){
  const importanceLabel = { 1:'⭐ Düşük', 2:'⭐⭐ Orta', 3:'⭐⭐⭐ Yüksek' }[task.importance] || '⭐⭐ Orta';
  const today = todayIso();
  const createdIso = task.createdAt ? isoDate(new Date(task.createdAt)) : null;
  const lines = [];
  lines.push(`Merhaba ${personLabel(target)},`, '');
  lines.push(`Bu otomatik bir hatırlatma mesajıdır. ${personLabel(me)}, ${task.assignedTo === 'both' ? 'ortak iş olarak atadığı' : 'sana atadığı'} aşağıdaki işi hatırlatmak için Danışan Takip uygulaması üzerinden gönderdi.`, '');
  lines.push(`İş: ${task.title}`);
  lines.push(`Önem: ${importanceLabel}`);
  if(task.dueDate){
    const diff = daysBetweenIso(today, task.dueDate);
    const when = diff > 1 ? `${diff} gün kaldı` : diff === 1 ? 'yarın' : diff === 0 ? 'bugün' : `${-diff} gün geçti`;
    lines.push(`Son tarih: ${formatShortDate(task.dueDate)} (${when})`);
  }
  if(createdIso){
    const waiting = daysBetweenIso(createdIso, today);
    lines.push(`Atanma tarihi: ${formatShortDate(createdIso)}${!task.dueDate && waiting > 0 ? ` (${waiting} gündür bekliyor)` : ''}`);
  }
  const openSubtasks = (task.subtasks||[]).filter(st => !st.done && st.text);
  if(openSubtasks.length){
    lines.push('', 'Kalan alt görevler:');
    openSubtasks.forEach(st => lines.push(`  - ${st.text}`));
  }
  lines.push('', 'İşi tamamladığında uygulamada işaretlemen yeterli.');
  lines.push(`Danışan Takip'i aç: ${APP_URL}`, '', '— Danışan Takip');
  return { subject: `🔔 Hatırlatma: ${task.title}`, body: lines.join('\n') };
}

async function sendTaskReminder(taskId){
  if(practiceRemindersSending.has(taskId)) return;
  const me = currentPersonId();
  const task = (practiceState && practiceState.tasks || []).find(t=>t.id===taskId);
  const target = taskReminderTarget(task, me);
  if(!target) return;
  const toEmail = PERSON_WORK_EMAIL[target];
  const sinceMin = task.lastReminderAt ? Math.round((Date.now() - task.lastReminderAt) / 60000) : null;
  const question = (sinceMin !== null && sinceMin < 60)
    ? `Bu iş için ${Math.max(1, sinceMin)} dakika önce zaten hatırlatma gönderdin. Yine de ${personDative(target)} tekrar gönderilsin mi?`
    : `"${task.title}" için ${personDative(target)} (${toEmail}) hatırlatma maili gönderilsin mi?`;
  if(!confirm(question)) return;

  const { subject, body } = buildTaskReminderEmail(task, me, target);
  practiceRemindersSending.add(taskId);
  if(mainView === 'practice') renderPracticeContent();

  let ok = false, errText = '';
  try{
    const token = await ensureGoogleAccessToken();
    if(!token){
      errText = 'Google bağlantısı kurulamadı.';
    }else{
      const mime =
        `To: ${toEmail}\r\n` +
        `Subject: ${encodeMimeSubject(subject)}\r\n` +
        `MIME-Version: 1.0\r\n` +
        `Content-Type: text/plain; charset="UTF-8"\r\n` +
        `Content-Transfer-Encoding: base64\r\n\r\n` +
        utf8ToBase64(body);
      const res = await fetch('https://gmail.googleapis.com/gmail/v1/users/me/messages/send', {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({ raw: base64UrlEncode(mime) })
      });
      if(res.ok){
        ok = true;
      }else{
        const err = await res.json().catch(()=>({}));
        errText = err.error && err.error.message ? err.error.message : `HTTP ${res.status}`;
      }
    }
  }catch(e){
    errText = e && e.message ? e.message : 'bilinmeyen hata';
  }
  practiceRemindersSending.delete(taskId);

  if(ok){
    // practiceState may have been refreshed while sending — update the live copy of the task.
    const live = (practiceState.tasks||[]).find(t=>t.id===taskId);
    if(live){
      live.lastReminderAt = Date.now();
      live.lastReminderBy = me;
      live.reminderCount = (live.reminderCount || 0) + 1;
    }
    logPracticeActivity(`${personLabel(me)}, "${task.title}" işi için ${personDative(target)} hatırlatma gönderdi.`);
    pushInAppNotification(target, `🔔 ${personLabel(me)}, "${task.title}" işini hatırlattı.`, 'taskReminder');
    await savePracticeShared();
    showToast(`🔔 Hatırlatma gönderildi → ${toEmail}`);
  }else{
    alert('Hatırlatma gönderilemedi: ' + errText);
  }
  if(mainView === 'practice') renderPracticeContent();
}

/* ---------- Extra Google calendars: read-only, never shown as appointments ---------- */
// Other calendars (another Gmail shared with this account, a holiday calendar…). Their events are only
// listed under the chosen day and checked for clashes when an appointment is created or moved.
const CANADA_HOLIDAY_CAL_ID = 'en.canadian#holiday@group.v.calendar.google.com';

function getExtraCalendars(){ return Array.isArray(state && state.extraCalendars) ? state.extraCalendars : []; }
function setExtraCalendars(list){ state.extraCalendars = list; saveState(); extraDayCache = {}; }

async function fetchCalendarEventsForDay(token, calId, dateStr){
  const start = new Date(`${dateStr}T00:00:00`);
  const end = addDaysLocal(start, 1);
  const url = `https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(calId)}/events?timeMin=${encodeURIComponent(start.toISOString())}&timeMax=${encodeURIComponent(end.toISOString())}&singleEvents=true&orderBy=startTime&maxResults=100`;
  const res = await fetch(url, { headers: { 'Authorization': `Bearer ${token}` } });
  if(!res.ok) throw new Error('HTTP ' + res.status);
  return ((await res.json()).items || []).filter(ev => ev.status !== 'cancelled');
}

function eventIsBusy(ev){
  if(!ev || ev.status === 'cancelled' || ev.transparency === 'transparent') return false;
  const me = (ev.attendees || []).find(x => x.self);
  return !(me && me.responseStatus === 'declined');
}
function eventIntervalMs(ev){
  if(ev.start && ev.start.dateTime) return [new Date(ev.start.dateTime).getTime(), new Date(ev.end.dateTime).getTime()];
  if(ev.start && ev.start.date) return [new Date(ev.start.date + 'T00:00:00').getTime(), new Date(ev.end.date + 'T00:00:00').getTime()];
  return null;
}
function eventTimeRangeLabel(ev){
  return ev.start && ev.start.dateTime ? `${formatEventTime(ev.start.dateTime)}–${formatEventTime(ev.end.dateTime)}` : 'Tüm gün';
}

// Events of the extra calendars on one day: [{ ev, cal }]. Cached for a few minutes.
let extraDayCache = {};
async function fetchExtraEventsForDay(dateStr){
  const cals = getExtraCalendars();
  if(!cals.length || !dateStr) return [];
  const hit = extraDayCache[dateStr];
  if(hit && Date.now() - hit.at < 5 * 60000) return hit.items;
  const token = await ensureGoogleAccessToken();
  if(!token) return null;
  const lists = await Promise.all(cals.map(async c => {
    try{ return (await fetchCalendarEventsForDay(token, c.id, dateStr)).map(ev => ({ ev, cal: c })); }
    catch(e){ console.warn('Ek takvim okunamadı', c.id, e); return []; }
  }));
  const items = lists.flat().sort((a,b)=> ((a.ev.start.dateTime || a.ev.start.date || '')).localeCompare(b.ev.start.dateTime || b.ev.start.date || ''));
  extraDayCache[dateStr] = { at: Date.now(), items };
  return items;
}

function extraEventsHtml(items, heading){
  if(!items || !items.length) return '';
  return `<div class="extra-cal-block"><div class="extra-cal-head">${heading || 'Diğer takvimlerde bu gün'}</div>${items.map(({ ev, cal }) => `
    <div class="extra-cal-row"><span class="extra-cal-time">${eventTimeRangeLabel(ev)}</span><span class="extra-cal-title">${escapeHtml(ev.summary || 'Meşgul')}</span><span class="extra-cal-name">${escapeHtml(cal.name || cal.id)}</span></div>`).join('')}</div>`;
}

// What clashes with dateStr timeStr (+duration): busy events in the main calendar and the extra calendars,
// plus any all-day event of an extra calendar (e.g. a statutory holiday).
async function calendarConflictIssues(dateStr, timeStr, durationMinutes, skipEventId){
  if(!dateStr || !timeStr) return [];
  const token = await ensureGoogleAccessToken();
  if(!token) return [];
  const cals = [{ id: 'primary', name: '' }, ...getExtraCalendars()];
  const lists = await Promise.all(cals.map(async c => {
    try{ return (await fetchCalendarEventsForDay(token, c.id, dateStr)).map(ev => ({ ev, cal: c })); }
    catch(e){ return []; }
  }));
  const start = new Date(`${dateStr}T${timeStr}:00`).getTime();
  const end = start + (durationMinutes || 50) * 60000;
  const seen = new Set(), issues = [];
  lists.flat().forEach(({ ev, cal }) => {
    if(skipEventId && ev.id === skipEventId) return;
    const iv = eventIntervalMs(ev);
    if(!iv) return;
    const allDay = !(ev.start && ev.start.dateTime);
    const flagged = (allDay && cal.id !== 'primary') || (eventIsBusy(ev) && iv[0] < end && iv[1] > start);
    if(!flagged) return;
    const key = (ev.iCalUID || ev.id) + '|' + iv[0];
    if(seen.has(key)) return; // the same event can sit in two calendars
    seen.add(key);
    issues.push(`${allDay ? 'Bu gün' : 'Çakışma'}: ${eventTimeRangeLabel(ev)} — ${ev.summary || 'Meşgul'}${cal.name ? ` (${cal.name})` : ''}`);
  });
  return issues;
}

// groups: [{ dateStr, issues }]. Returns 'continue', 'skip' (weekly repeats only) or null (cancel).
function askConflictWarning(groups, allowSkip){
  return new Promise((resolve)=>{
    const modal = document.createElement('div');
    modal.className = 'backups-modal';
    modal.style.display = 'flex';
    modal.style.zIndex = '400';
    modal.innerHTML = `
      <div class="backups-box" style="max-width:440px; max-height:86vh; overflow:auto;">
        <div class="backups-box-header"><h2>⚠️ Takvimde başka bir şey var</h2></div>
        <div style="padding:0 20px 20px;">
          ${groups.map(g => `<div class="conflict-group"><strong>${turkishDayName(g.dateStr)}, ${formatShortDate(g.dateStr)}</strong>
            <ul>${g.issues.map(i => `<li>${escapeHtml(i)}</li>`).join('')}</ul></div>`).join('')}
          <div style="display:flex; flex-direction:column; gap:8px; margin-top:12px;">
            <button class="reschedule-confirm-btn" id="cfCancel" type="button" style="width:100%;">Vazgeç, başka zaman seçeyim</button>
            ${allowSkip ? `<button class="settings-btn" id="cfSkip" type="button" style="width:100%;">Bu ${groups.length} haftayı atla, diğerlerini oluştur</button>` : ''}
            <button class="reschedule-cancel-btn" id="cfGo" type="button" style="width:100%;">${allowSkip || groups.length > 1 ? 'Yine de hepsini oluştur' : 'Yine de devam et'}</button>
          </div>
        </div>
      </div>`;
    document.body.appendChild(modal);
    const done = v => { modal.remove(); resolve(v); };
    modal.querySelector('#cfCancel').addEventListener('click', ()=> done(null));
    modal.querySelector('#cfGo').addEventListener('click', ()=> done('continue'));
    const skip = modal.querySelector('#cfSkip');
    if(skip) skip.addEventListener('click', ()=> done('skip'));
  });
}

async function confirmNoConflict(dateStr, timeStr, durationMinutes, skipEventId){
  let issues = [];
  try{ issues = await calendarConflictIssues(dateStr, timeStr, durationMinutes, skipEventId); }catch(e){ return true; }
  if(!issues.length) return true;
  return (await askConflictWarning([{ dateStr, issues }], false)) === 'continue';
}

const CONSENT_ACK = 'I have read and understood this form, I have had the chance to ask questions, and I agree to its terms.';

const CONSENT_ALLOWED_TAGS = new Set(['P','H1','H2','H3','H4','STRONG','B','EM','I','U','UL','OL','LI','BR','TABLE','THEAD','TBODY','TR','TD','TH']);
function sanitizeConsentHtml(html){
  const src = new DOMParser().parseFromString('<div>' + String(html || '') + '</div>', 'text/html').body.firstChild;
  const walk = (node, out) => {
    node.childNodes.forEach(ch => {
      if(ch.nodeType === 3){ out.appendChild(document.createTextNode(ch.nodeValue)); return; }
      if(ch.nodeType !== 1) return;
      const tag = ch.tagName;
      if(['SCRIPT','STYLE','IFRAME','OBJECT','IMG','SVG','LINK','META'].includes(tag)) return;
      if(tag === 'SPAN' || tag === 'FONT'){
        // Text size: only four fixed sizes are kept (the editor's size buttons produce <font size>).
        let size = ch.getAttribute('data-size');
        if(tag === 'FONT'){ const n = parseInt(ch.getAttribute('size'), 10); size = n <= 2 ? 's' : n === 3 ? 'n' : n === 4 ? 'l' : n >= 5 ? 'xl' : null; }
        if(['s','n','l','xl'].includes(size)){ const el = document.createElement('span'); el.setAttribute('data-size', size); walk(ch, el); out.appendChild(el); }
        else walk(ch, out);
        return;
      }
      if(CONSENT_ALLOWED_TAGS.has(tag)){ const el = document.createElement(tag); walk(ch, el); out.appendChild(el); }
      else if(tag === 'DIV'){ const el = document.createElement('p'); walk(ch, el); out.appendChild(el); }
      else walk(ch, out);
    });
  };
  const out = document.createElement('div');
  walk(src, out);
  return out.innerHTML;
}

function plainTextToConsentHtml(text){
  return String(text || '').replace(/\r/g, '').split(/\n\s*\n/).map(p => p.trim()).filter(Boolean)
    .map(p => `<p>${escapeHtml(p).replace(/\n/g, '<br>')}</p>`).join('');
}

// Flattens the consent HTML into simple blocks for the PDF: headings, paragraphs, list items.
function consentHtmlToBlocks(html){
  const root = new DOMParser().parseFromString('<div>' + sanitizeConsentHtml(html) + '</div>', 'text/html').body.firstChild;
  const blocks = [];
  // Inline text of one block as styled runs: { text, b, i, u, size }
  const runsOf = (el, st, out) => {
    el.childNodes.forEach(ch => {
      if(ch.nodeType === 3){ if(ch.nodeValue) out.push({ ...st, text: ch.nodeValue.replace(/\s+/g, ' ') }); return; }
      if(ch.nodeType !== 1) return;
      const tag = ch.tagName;
      if(tag === 'BR'){ out.push({ ...st, text: '\n' }); return; }
      if(tag === 'UL' || tag === 'OL') return; // nested lists are handled as their own blocks
      const next = { ...st };
      if(tag === 'STRONG' || tag === 'B') next.b = true;
      if(tag === 'EM' || tag === 'I') next.i = true;
      if(tag === 'U') next.u = true;
      if(tag === 'SPAN' && ch.getAttribute('data-size')) next.size = ch.getAttribute('data-size');
      runsOf(ch, next, out);
    });
    return out;
  };
  const push = (type, el, prefix) => {
    const runs = runsOf(el, {}, []);
    const text = runs.map(r => r.text).join('').trim();
    if(!text) return;
    if(prefix) runs.unshift({ text: prefix });
    blocks.push({ type, text: (prefix || '') + text, runs });
  };
  const visit = (el) => {
    el.childNodes.forEach(ch => {
      if(ch.nodeType === 3){ const t = ch.nodeValue.trim(); if(t) blocks.push({ type:'p', text:t, runs:[{ text:t }] }); return; }
      if(ch.nodeType !== 1) return;
      const tag = ch.tagName;
      if(/^H[1-4]$/.test(tag)) push('h', ch);
      else if(tag === 'UL' || tag === 'OL'){
        let n = 0;
        ch.querySelectorAll(':scope > li').forEach(li => {
          n++;
          push('li', li, tag === 'OL' ? `${n}. ` : '• ');
          li.querySelectorAll(':scope > ul, :scope > ol').forEach(sub => visit({ childNodes: [sub] }));
        });
      }
      else if(tag === 'TABLE'){
        ch.querySelectorAll('tr').forEach(tr => {
          const t = Array.from(tr.querySelectorAll('td,th')).map(c => c.textContent.trim()).filter(Boolean).join(' — ');
          if(t) blocks.push({ type:'p', text:t, runs:[{ text:t }] });
        });
      }
      else{
        // A paragraph that is entirely bold is treated as a heading.
        const onlyBold = ch.children.length === 1 && /^(STRONG|B)$/.test(ch.children[0].tagName) && ch.children[0].textContent.trim() === ch.textContent.trim();
        push(onlyBold ? 'h' : 'p', ch);
      }
    });
  };
  visit(root);
  return blocks;
}

function hashString(str){
  let h = 5381;
  for(let i = 0; i < str.length; i++) h = ((h << 5) + h + str.charCodeAt(i)) >>> 0;
  return h.toString(16).padStart(8, '0');
}
