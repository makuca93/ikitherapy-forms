function loadScriptOnce(src){
  return new Promise((resolve, reject)=>{
    if(document.querySelector(`script[data-src="${src}"]`)){ resolve(); return; }
    const sc = document.createElement('script');
    sc.src = src; sc.setAttribute('data-src', src);
    sc.onload = resolve; sc.onerror = ()=>{ sc.remove(); reject(new Error('load failed')); };
    document.head.appendChild(sc);
  });
}

async function readConsentFile(file){
  const name = (file.name || '').toLowerCase();
  if(name.endsWith('.txt')) return plainTextToConsentHtml(await file.text());
  if(name.endsWith('.pdf') || file.type === 'application/pdf') return sanitizeConsentHtml(await pdfToConsentHtml(await file.arrayBuffer()));
  if(!name.endsWith('.docx')) throw new Error('unsupported');
  const buffer = await file.arrayBuffer();
  // 1) Preferred: the mammoth library (best formatting). It is fetched from a CDN, which can be
  //    blocked by a network or content blocker — so try two sources, then fall back to (2).
  const sources = ['https://cdn.jsdelivr.net/npm/mammoth@1.13.0/mammoth.browser.min.js', 'https://unpkg.com/mammoth@1.13.0/mammoth.browser.min.js'];
  let lastError = null;
  for(const src of sources){
    if(window.mammoth) break;
    const savedDefine = window.define; // the bundle registers elsewhere if an AMD loader is present
    try{ window.define = undefined; await loadScriptOnce(src); }
    catch(e){ lastError = e; }
    finally{ window.define = savedDefine; }
  }
  if(window.mammoth){
    try{
      const res = await window.mammoth.convertToHtml({ arrayBuffer: buffer });
      const html = sanitizeConsentHtml(res.value);
      if(consentHtmlToBlocks(html).length) return html;
    }catch(e){ lastError = e; console.warn('mammoth dosyayı okuyamadı, yerleşik okuyucu deneniyor', e); }
  }
  // 2) Built-in reader: no external code needed. Keeps headings, bold, lists and tables.
  try{
    return sanitizeConsentHtml(await docxToHtmlBuiltIn(buffer));
  }catch(e){
    console.error('Yerleşik .docx okuyucu da başarısız', e, lastError);
    throw new Error((e && e.message) || 'docx');
  }
}

// PDF → editable consent text. Reads the text layer with pdf.js and rebuilds headings, bold runs,
// paragraphs and bullet lists from font sizes, font names and line spacing. A scanned PDF (only images)
// has no text layer, so it cannot be read this way.
async function loadPdfJs(){
  if(window.pdfjsLib) return window.pdfjsLib;
  const sources = [
    ['https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js', 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'],
    ['https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js', 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js']
  ];
  for(const [lib, worker] of sources){
    const savedDefine = window.define;
    try{ window.define = undefined; await loadScriptOnce(lib); }catch(e){ continue; }
    finally{ window.define = savedDefine; }
    if(window.pdfjsLib){ window.pdfjsLib.GlobalWorkerOptions.workerSrc = worker; return window.pdfjsLib; }
  }
  throw new Error('PDF okuyucu yüklenemedi (internet bağlantısını kontrol et)');
}

async function pdfToConsentHtml(buffer){
  const pdfjs = await loadPdfJs();
  const pdf = await pdfjs.getDocument({ data: new Uint8Array(buffer) }).promise;
  const lines = [];
  for(let p = 1; p <= pdf.numPages; p++){
    const page = await pdf.getPage(p);
    const pageH = (page.view && page.view[3]) || 792;
    const tc = await page.getTextContent();
    let fontNames = {};
    try{
      await page.getOperatorList(); // makes the real font names (e.g. "Arial-BoldMT") available
      Object.keys(tc.styles || {}).forEach(k => { try{ const f = page.commonObjs.get(k); fontNames[k] = (f && (f.name || f.loadedName)) || ''; }catch(e){} });
    }catch(e){}
    const isBold = it => /bold|black|heavy|semibold|demi/i.test(fontNames[it.fontName] || '') || /bold/i.test(((tc.styles || {})[it.fontName] || {}).fontFamily || '');
    let cur = null;
    tc.items.forEach(it => {
      if(typeof it.str !== 'string') return;
      const size = Math.round(Math.hypot(it.transform[2], it.transform[3]) * 10) / 10 || Math.abs(it.transform[3]);
      const x = it.transform[4], yPos = it.transform[5];
      if(!cur || Math.abs(cur.y - yPos) > Math.max(2, size * 0.4)){
        if(cur) lines.push(cur);
        cur = { page: p, y: yPos, rel: yPos / pageH, x, size, runs: [], endX: x };
      }else if(it.str && x - cur.endX > size * 0.18 && !/\s$/.test(cur.runs.length ? cur.runs[cur.runs.length-1].text : '')){
        cur.runs.push({ text: ' ', b: false });
      }
      if(it.str) cur.runs.push({ text: it.str, b: isBold(it) });
      cur.size = Math.max(cur.size, size);
      cur.endX = x + (it.width || 0);
      if(it.hasEOL){ lines.push(cur); cur = null; }
    });
    if(cur) lines.push(cur);
  }
  const text = l => l.runs.map(r => r.text).join('').replace(/\s+/g, ' ').trim();
  const real = lines.filter(l => text(l));
  if(!real.length) throw new Error('Bu PDF\'te seçilebilir metin yok (taranmış bir belge olabilir). Word ya da metin olarak yükle veya metni kutuya yapıştır.');
  // Body font size = the most common size; clearly larger lines are headings.
  const sizeCount = {};
  real.forEach(l => { const k = Math.round(l.size); sizeCount[k] = (sizeCount[k] || 0) + text(l).length; });
  const body = Number(Object.keys(sizeCount).sort((a,b)=> sizeCount[b] - sizeCount[a])[0]) || 11;
  const minX = Math.min(...real.map(l => l.x));
  // Page headers/footers (text in the top or bottom margin repeated on most pages) and page numbers are dropped.
  const pages = new Set(real.map(l => l.page)).size;
  const inMargin = l => l.rel > 0.92 || l.rel < 0.08;
  const repeats = {};
  real.filter(inMargin).forEach(l => { const k = text(l).replace(/\d+/g, '#'); repeats[k] = (repeats[k] || new Set()).add(l.page); });
  const kept = real.filter(l => {
    const t = text(l);
    if(inMargin(l) && /^(page\s*)?\d+(\s*(of|\/)\s*\d+)?$/i.test(t)) return false;
    if(inMargin(l) && pages >= 2 && repeats[t.replace(/\d+/g, '#')].size >= Math.max(2, Math.ceil(pages * 0.6))) return false;
    return true;
  });

  const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const runsHtml = runs => {
    let out = '', open = false;
    runs.forEach(r => {
      if(r.b && !open && r.text.trim()){ out += '<strong>'; open = true; }
      else if(!r.b && open && r.text.trim()){ out += '</strong>'; open = false; }
      out += esc(r.text);
    });
    return (open ? out + '</strong>' : out).replace(/\s+/g, ' ').trim();
  };
  // Bullets include Word's Symbol-font bullet, which arrives as a private-use character.
  const BULLET = /^\s*([•●▪◦‣∙·\-–*■□○►➢✓❖§\uF000-\uF8FF]|\d{1,2}[.)]|[a-z][.)])\s+/i;
  const blocks = [];
  let para = null, prev = null;
  const endPara = ()=>{ if(para){ blocks.push(para); para = null; } };
  kept.forEach(l => {
    const t = text(l);
    const allBold = l.runs.filter(r => r.text.trim()).every(r => r.b);
    const gap = prev && prev.page === l.page ? (prev.y - l.y) : null;
    // Across a page break, a sentence that did not end continues the same paragraph.
    const pageCarry = prev && prev.page !== l.page && Math.abs(prev.size - l.size) < 0.5 && !/[.:!?]["”')]?$/.test(text(prev));
    const bigGap = pageCarry ? false : (gap === null || gap > Math.max(prev.size, l.size) * 1.6);
    const isHeading = l.size >= body * 1.15 || (allBold && t.length < 90 && !/[.,;:]$/.test(t) && bigGap);
    const bullet = BULLET.exec(t);
    if(isHeading){
      endPara();
      const lvl = l.size >= body * 1.45 ? 'h2' : 'h3';
      const lastB = blocks[blocks.length - 1];
      if(lastB && lastB.tag === lvl && !bigGap) lastB.html += ' ' + esc(t); // heading wrapped onto two lines
      else blocks.push({ tag: lvl, html: esc(t) });
    }else if(bullet){
      endPara();
      const runs = l.runs.slice();
      // drop the bullet character itself
      let cut = bullet[0].length;
      while(cut > 0 && runs.length){
        const r = runs[0];
        if(r.text.length <= cut){ cut -= r.text.length; runs.shift(); }
        else { runs[0] = { ...r, text: r.text.slice(cut) }; cut = 0; }
      }
      para = { tag: 'li', ordered: /^(\d{1,2}|[a-z])[.)]$/i.test(bullet[1]), html: runsHtml(runs), x: l.x };
    }else if(para && !bigGap && (para.tag !== 'li' || l.x > minX + 2)){
      para.html += ' ' + runsHtml(l.runs); // continuation of the same paragraph / list item
    }else{
      endPara();
      para = { tag: 'p', html: runsHtml(l.runs) };
    }
    prev = l;
  });
  endPara();
  let html = '', list = null;
  blocks.forEach(b => {
    if(b.tag === 'li'){
      const lt = b.ordered ? 'ol' : 'ul';
      if(list !== lt){ if(list) html += `</${list}>`; html += `<${lt}>`; list = lt; }
      html += `<li>${b.html}</li>`;
    }else{
      if(list){ html += `</${list}>`; list = null; }
      html += `<${b.tag}>${b.html}</${b.tag}>`;
    }
  });
  if(list) html += `</${list}>`;
  return html;
}

// Minimal .docx reader: a .docx is a zip file whose main text is word/document.xml.
async function docxToHtmlBuiltIn(buffer){
  const bytes = new Uint8Array(buffer);
  const view = new DataView(buffer);
  if(bytes.length < 22 || view.getUint32(0, true) !== 0x04034b50) throw new Error('Bu dosya geçerli bir .docx değil (eski .doc dosyasıysa Word\'de "Farklı Kaydet > .docx" yap).');
  let eocd = -1;
  for(let i = bytes.length - 22; i >= Math.max(0, bytes.length - 66000); i--){ if(view.getUint32(i, true) === 0x06054b50){ eocd = i; break; } }
  if(eocd < 0) throw new Error('Dosya bozuk görünüyor.');
  const count = view.getUint16(eocd + 10, true);
  let p = view.getUint32(eocd + 16, true);
  let entry = null;
  for(let n = 0; n < count && p + 46 <= bytes.length; n++){
    if(view.getUint32(p, true) !== 0x02014b50) break;
    const method = view.getUint16(p + 10, true), compSize = view.getUint32(p + 20, true);
    const nameLen = view.getUint16(p + 28, true), extraLen = view.getUint16(p + 30, true), commentLen = view.getUint16(p + 32, true);
    const localOffset = view.getUint32(p + 42, true);
    const fname = new TextDecoder().decode(bytes.subarray(p + 46, p + 46 + nameLen));
    if(fname === 'word/document.xml'){ entry = { method, compSize, localOffset }; break; }
    p += 46 + nameLen + extraLen + commentLen;
  }
  if(!entry) throw new Error('Dosyada Word metni bulunamadı.');
  const lh = entry.localOffset;
  const dataStart = lh + 30 + view.getUint16(lh + 26, true) + view.getUint16(lh + 28, true);
  const raw = bytes.subarray(dataStart, dataStart + entry.compSize);
  let xmlBytes;
  if(entry.method === 0) xmlBytes = raw;
  else if(entry.method === 8){
    if(typeof DecompressionStream === 'undefined') throw new Error('Bu tarayıcı dosyayı açamıyor; metni kopyalayıp kutuya yapıştır.');
    xmlBytes = new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());
  }else throw new Error('Desteklenmeyen sıkıştırma türü.');
  const xml = new DOMParser().parseFromString(new TextDecoder('utf-8').decode(xmlBytes), 'application/xml');
  const W = 'http://schemas.openxmlformats.org/wordprocessingml/2006/main';
  const body = xml.getElementsByTagNameNS(W, 'body')[0];
  if(!body) throw new Error('Dosyada Word metni bulunamadı.');
  const kids = (el, tag) => Array.from(el.children).filter(c => c.namespaceURI === W && c.localName === tag);
  const kid = (el, tag) => kids(el, tag)[0] || null;
  const on = el => !!el && !['0', 'false', 'off'].includes(el.getAttributeNS(W, 'val') || '');
  const runsHtml = (para) => {
    let out = '';
    Array.from(para.getElementsByTagNameNS(W, 'r')).forEach(r => {
      const rPr = kid(r, 'rPr');
      let t = '';
      Array.from(r.children).forEach(c => {
        if(c.namespaceURI !== W) return;
        if(c.localName === 't') t += escapeHtml(c.textContent);
        else if(c.localName === 'tab') t += ' ';
        else if(c.localName === 'br' || c.localName === 'cr') t += '<br>';
      });
      if(!t) return;
      if(rPr && on(kid(rPr, 'b'))) t = `<strong>${t}</strong>`;
      if(rPr && on(kid(rPr, 'i'))) t = `<em>${t}</em>`;
      out += t;
    });
    return out;
  };
  let html = '', listOpen = false;
  const closeList = () => { if(listOpen){ html += '</ul>'; listOpen = false; } };
  const paragraph = (para) => {
    const inner = runsHtml(para);
    const pPr = kid(para, 'pPr');
    const style = pPr && kid(pPr, 'pStyle') ? (kid(pPr, 'pStyle').getAttributeNS(W, 'val') || '') : '';
    const isList = !!(pPr && kid(pPr, 'numPr')) || /^List/i.test(style);
    if(!inner.replace(/<br>/g, '').trim()){ closeList(); return; }
    if(isList){ if(!listOpen){ html += '<ul>'; listOpen = true; } html += `<li>${inner}</li>`; return; }
    closeList();
    // Heading styles: "Heading1" (English Word), "Balk1" (Turkish Word), "Title"/"KonuBal"
    if(/^(Heading|Balk|Title|KonuBa|Subtitle)/i.test(style)) html += `<h3>${inner.replace(/<\/?strong>/g, '')}</h3>`;
    else html += `<p>${inner}</p>`;
  };
  Array.from(body.children).forEach(el => {
    if(el.namespaceURI !== W) return;
    if(el.localName === 'p') paragraph(el);
    else if(el.localName === 'tbl'){
      closeList();
      html += '<table>' + Array.from(el.getElementsByTagNameNS(W, 'tr')).map(tr =>
        '<tr>' + kids(tr, 'tc').map(tc => `<td>${kids(tc, 'p').map(runsHtml).filter(Boolean).join('<br>')}</td>`).join('') + '</tr>').join('') + '</table>';
    }
  });
  closeList();
  if(!html) throw new Error('Dosyada metin bulunamadı.');
  return html;
}

/* ----- Signature pad (therapist's own signature, stored once) ----- */
function openSignaturePadModal(){
  return new Promise((resolve)=>{
    const modal = document.createElement('div');
    modal.className = 'backups-modal';
    modal.style.display = 'flex';
    modal.innerHTML = `
      <div class="backups-box" style="max-width:420px;">
        <div class="backups-box-header"><h2>İmzanı çiz</h2></div>
        <div style="padding:0 20px 20px;">
          <canvas id="sigPadCanvas" style="width:100%; height:170px; border:1px dashed #b9bcc8; border-radius:8px; background:#fff; touch-action:none; display:block;"></canvas>
          <div style="display:flex; gap:8px; justify-content:flex-end; margin-top:12px;">
            <button class="reschedule-cancel-btn" id="sigPadClear" type="button">Temizle</button>
            <button class="reschedule-cancel-btn" id="sigPadCancel" type="button">Vazgeç</button>
            <button class="reschedule-confirm-btn" id="sigPadSave" type="button">Kaydet</button>
          </div>
        </div>
      </div>`;
    document.body.appendChild(modal);
    const canvas = document.getElementById('sigPadCanvas');
    const ctx = canvas.getContext('2d');
    const ratio = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(canvas.clientWidth * ratio); canvas.height = Math.round(canvas.clientHeight * ratio);
    ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
    ctx.lineWidth = 2.2; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#1d2330';
    let drawing = false, ink = false, last = null;
    const pos = ev => { const r = canvas.getBoundingClientRect(); return { x: ev.clientX - r.left, y: ev.clientY - r.top }; };
    canvas.addEventListener('pointerdown', ev=>{ ev.preventDefault(); canvas.setPointerCapture(ev.pointerId); drawing = true; last = pos(ev); });
    canvas.addEventListener('pointermove', ev=>{
      if(!drawing) return;
      const p = pos(ev);
      ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke();
      last = p; ink = true;
    });
    ['pointerup','pointercancel'].forEach(t => canvas.addEventListener(t, ()=>{ drawing = false; }));
    const close = v => { modal.remove(); resolve(v); };
    document.getElementById('sigPadClear').addEventListener('click', ()=>{ ctx.clearRect(0, 0, canvas.width, canvas.height); ink = false; });
    document.getElementById('sigPadCancel').addEventListener('click', ()=> close(null));
    document.getElementById('sigPadSave').addEventListener('click', ()=>{
      if(!ink){ alert('Önce kutuya imzanı çiz.'); return; }
      const out = document.createElement('canvas');
      out.width = 600; out.height = Math.round(600 * canvas.height / canvas.width);
      const o = out.getContext('2d');
      o.fillStyle = '#fff'; o.fillRect(0, 0, out.width, out.height);
      o.drawImage(canvas, 0, 0, out.width, out.height);
      close(out.toDataURL('image/png'));
    });
  });
}

async function wireFormsSettings(){
  const typeSel = document.getElementById('consentTypeSelect');
  if(!typeSel) return;
  const titleInput = document.getElementById('consentTitleInput');
  const editor = document.getElementById('consentEditor');
  const status = document.getElementById('consentStatus');

  const fill = ()=>{
    const type = consentSettingsType;
    const draft = consentSettingsDrafts[type];
    const saved = state.consentTemplates && state.consentTemplates[type];
    titleInput.value = draft ? draft.title : ((saved && saved.title) || CONSENT_DEFAULT_TITLES[type]);
    editor.innerHTML = draft ? draft.html : ((saved && saved.html) || '');
    if(draft) status.textContent = '✏️ Kaydedilmemiş değişiklikler var.';
    else if(saved && saved.html) status.textContent = `✅ Kayıtlı — son güncelleme: ${formatBackupTime(saved.updatedAt)}${saved.sourceName ? ' · ' + saved.sourceName : ''}`;
    else status.textContent = '⚠️ Bu tür için henüz metin yok — metin eklenmeden bu onam gönderilemez.';
  };
  const keepDraft = (sourceName)=>{
    const prev = consentSettingsDrafts[consentSettingsType] || {};
    consentSettingsDrafts[consentSettingsType] = { title: titleInput.value, html: editor.innerHTML, sourceName: sourceName || prev.sourceName || '' };
    status.textContent = '✏️ Kaydedilmemiş değişiklikler var.';
  };

  fill();

  typeSel.addEventListener('change', ()=>{ consentSettingsType = typeSel.value; fill(); });
  titleInput.addEventListener('input', ()=> keepDraft());
  editor.addEventListener('input', ()=> keepDraft());
  // Formatting buttons act on the selected text. mousedown + preventDefault keeps the selection in the editor.
  document.getElementById('consentToolbar').addEventListener('mousedown', (ev)=>{
    const b = ev.target.closest('button');
    if(!b) return;
    ev.preventDefault();
    editor.focus();
    try{ document.execCommand('styleWithCSS', false, false); }catch(e){}
    if(b.dataset.cmd) document.execCommand(b.dataset.cmd, false, null);
    else if(b.dataset.block) document.execCommand('formatBlock', false, b.dataset.block);
    else if(b.dataset.size) document.execCommand('fontSize', false, b.dataset.size);
    keepDraft();
  });
  document.getElementById('consentUploadBtn').addEventListener('click', ()=> document.getElementById('consentFileInput').click());
  document.getElementById('consentFileInput').addEventListener('change', async (ev)=>{
    const file = ev.target.files[0];
    ev.target.value = '';
    if(!file) return;
    status.textContent = 'Dosya okunuyor…';
    try{
      const html = await readConsentFile(file);
      if(!consentHtmlToBlocks(html).length){ alert('Bu dosyada metin bulunamadı.'); fill(); return; }
      editor.innerHTML = html;
      keepDraft(file.name);
      status.textContent = `📄 "${file.name}" yüklendi — kontrol edip Kaydet'e bas.`;
    }catch(e){
      console.error('Onam dosyası okunamadı', e);
      alert(e && e.message === 'unsupported'
        ? 'Sadece Word (.docx), PDF ve düz metin (.txt) dosyaları yüklenebilir. Eski .doc dosyasını Word\'de "Farklı Kaydet > .docx" ile çevirebilirsin.'
        : 'Dosya okunamadı: ' + (e && e.message ? e.message : 'bilinmeyen hata') + '\n\nMetni Word\'den kopyalayıp kutuya yapıştırarak da ekleyebilirsin.');
      fill();
    }
  });
  const collect = ()=>({ title: titleInput.value.trim() || CONSENT_DEFAULT_TITLES[consentSettingsType], html: sanitizeConsentHtml(editor.innerHTML) });
  document.getElementById('consentSaveBtn').addEventListener('click', async ()=>{
    const type = consentSettingsType;
    const { title, html } = collect();
    if(!consentHtmlToBlocks(html).length){ alert('Metin boş. Bir dosya yükle ya da metni kutuya yapıştır.'); return; }
    if(!state.consentTemplates) state.consentTemplates = {};
    const draft = consentSettingsDrafts[type] || {};
    const prev = state.consentTemplates[type] || {};
    state.consentTemplates[type] = { title, html, updatedAt: Date.now(), sourceName: draft.sourceName || prev.sourceName || '' };
    delete consentSettingsDrafts[type];
    await saveState();
    showToast(`✅ ${CONSENT_TYPES[type]} onam formu kaydedildi.`);
    if(document.body.contains(typeSel)) fill();
  });
  document.getElementById('consentPreviewBtn').addEventListener('click', ()=>{
    const { title, html } = collect();
    const type = consentSettingsType;
    const modal = document.createElement('div');
    modal.className = 'backups-modal';
    modal.style.display = 'flex';
    const sigBox = label => `<div style="border:1px solid var(--card-line); border-radius:8px; padding:10px; margin-top:8px; background:var(--paper);"><strong style="font-size:13px;">${label}</strong><div style="height:60px; border:1px dashed #b9bcc8; border-radius:6px; margin-top:6px; background:#fff;"></div></div>`;
    modal.innerHTML = `
      <div class="backups-box" style="max-width:560px; max-height:86vh; overflow:auto;">
        <div class="backups-box-header"><h2>${escapeHtml(title)}</h2><button type="button" id="consentPreviewClose">✕</button></div>
        <div style="padding:0 20px 20px;">
          <div class="consent-editor" style="border:none; padding:0; min-height:0; max-height:none;">${html}</div>
          <div style="border-top:2px solid var(--card-line); margin-top:14px; padding-top:12px; font-size:13.5px;">☐ ${escapeHtml(CONSENT_ACK)}</div>
          ${type === 'couple' ? sigBox('Signature 1 of 2') + sigBox('Signature 2 of 2') : type === 'minor' ? sigBox('Parent / guardian signature') : sigBox('Your signature')}
        </div>
      </div>`;
    document.body.appendChild(modal);
    document.getElementById('consentPreviewClose').addEventListener('click', ()=> modal.remove());
    modal.addEventListener('click', ev=>{ if(ev.target === modal) modal.remove(); });
  });

  document.getElementById('providerSigBtn').addEventListener('click', async ()=>{
    const data = await openSignaturePadModal();
    if(!data) return;
    state.providerSignature = data;
    saveState();
    renderSettingsPage();
  });
  const sigClear = document.getElementById('providerSigClearBtn');
  if(sigClear) sigClear.addEventListener('click', ()=>{
    if(!confirm('Kayıtlı imzan kaldırılsın mı?')) return;
    state.providerSignature = null;
    saveState();
    renderSettingsPage();
  });
  document.getElementById('settingsPickFormsFolderBtn').addEventListener('click', ()=> openDriveFolderPicker('forms'));
}

/* ----- Requests ----- */
function newFormToken(){
  const b = new Uint8Array(24);
  crypto.getRandomValues(b);
  // The leading letter tells the form page whose record this is, so the link needs no name in it.
  return FORM_OWNER_CODES[currentPersonId()] + '.' + btoa(String.fromCharCode.apply(null, b)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
const FORM_OWNER_CODES = { kubilay: 'a', duygu: 'b' };
function formLinkForToken(token){
  // Links made before the owner code existed still need the old "p" parameter.
  return token.indexOf('.') === 1 ? `${FORM_PAGE_URL}#t=${token}` : `${FORM_PAGE_URL}#p=${currentPersonId()}&t=${token}`;
}
// Couple requests have one part (own link, own device) per person; everything else is a single link.
function formTokens(entry){ return entry.parts ? entry.parts.map(p => p.token) : [entry.token]; }
function formRequestRef(token){ return window.FB.doc(window.FB.db, 'users', currentPersonId(), 'formRequests', token); }
function formContentRef(token, key){ return window.FB.doc(window.FB.db, 'users', currentPersonId(), 'formRequests', token, 'content', key); }
function formResponseRef(token){ return window.FB.doc(window.FB.db, 'users', currentPersonId(), 'formRequests', token, 'responses', 'main'); }

function scoreFormScale(s){
  const sc = FORM_SCALES[s.id];
  const total = (s.answers || []).reduce((a,b)=> a + (b || 0), 0);
  const band = (sc.bands.find(b => total <= b[0]) || sc.bands[sc.bands.length-1])[1];
  return { total, band };
}

function intakeValue(intake, id){
  for(const sec of (intake && intake.sections) || []){
    const f = (sec.fields || []).find(x => x.id === id);
    if(f) return f.value || '';
  }
  return '';
}
function intakeFullName(intake){ return [intakeValue(intake, 'name'), intakeValue(intake, 'surname')].filter(Boolean).join(' '); }

function summarizeFormPayload(payload){
  const scales = (payload.scales || []).filter(s => FORM_SCALES[s.id]).map(s=>{
    const r = scoreFormScale(s);
    return { id: s.id, name: s.respondentName || '', total: r.total, band: r.band, item9: s.id === 'phq9' ? (s.answers[8] || 0) : null };
  });
  const signers = payload.consent ? (payload.consent.signers || []).map(s => s.name) : [];
  const intakeNames = payload.intake ? [intakeFullName(payload.intake)].filter(Boolean) : [];
  return { scales, signers, intake: intakeNames, flag: scales.some(s => s.item9 > 0) };
}

async function createFormRequest(client, opts){
  const me = currentPersonId();
  const p = getProvider();
  const sp = client.profile && client.profile.secondPerson;
  let consent = null;
  if(opts.consentType){
    const t = getConsentTemplate(opts.consentType);
    consent = { type: opts.consentType, title: t.title || CONSENT_DEFAULT_TITLES[opts.consentType], html: t.html, checks: [CONSENT_ACK], version: hashString((t.title||'') + t.html + CONSENT_ACK) };
  }
  const now = Date.now();
  const expiresAt = now + opts.days * 24*60*60*1000;
  // Two records per link: a small public "cover" (who it is from, expiry, whether a date of birth is asked)
  // and the forms themselves, stored under a key. With the birth-date check on, the key IS the date of
  // birth, so the forms can only be opened — and answers only submitted — by someone who knows it.
  const cover = {
    v: 2, owner: me, createdAt: window.FB.serverTimestamp(), expiresAt: new Date(expiresAt),
    practice: 'İki Therapy',
    therapist: { name: p.name || '', credential: p.credential || '', regNumber: p.regNumber || '' }
  };
  const write = async (content, dob)=>{
    const token = newFormToken();
    const key = dob || 'open';
    await window.FB.setDoc(formContentRef(token, key), { consent, scales: opts.scales, ...(opts.intake ? { intake: INTAKE_FORM } : {}), ...content });
    await window.FB.setDoc(formRequestRef(token), { ...cover, needsDob: !!dob, dobOf: opts.consentType === 'minor' ? 'client' : 'self' });
    return { token, key };
  };
  const dobs = opts.dobs || [];
  const entry = { createdAt: now, expiresAt, dobCheck: !!(opts.dobs && opts.dobs.length), consentType: opts.consentType || null, consentVersion: consent ? consent.version : null, scales: opts.scales, intake: !!opts.intake, status: 'open', sentTo: [] };
  if(opts.consentType === 'couple'){
    // Each person gets their own link and signs on their own device.
    const names = [client.name, sp.name.trim()];
    entry.parts = [];
    for(let i = 0; i < 2; i++){
      // No names are stored in the form itself: each person types their own name when signing.
      const w = await write({ part: i + 1, twoSigners: true, signers: [{ role: 'client' }], respondents: [{}] }, dobs[i]);
      entry.parts.push({ token: w.token, key: w.key, name: names[i], status: 'open' });
    }
    entry.token = entry.parts[0].token; // identifies the entry in lists
  }else{
    const signers = consent ? [{ role: opts.consentType === 'minor' ? 'guardian' : 'client' }] : [];
    const w = await write({ signers, respondents: [{}] }, dobs[0]);
    entry.token = w.token;
    entry.key = w.key;
  }
  const live = state.clients.find(c => c.id === client.id) || client;
  if(!live.formRequests) live.formRequests = [];
  live.formRequests.push(entry);
  saveState();
  logAudit('form bağlantısı oluşturuldu', `${client.name} - ${formEntryContents(entry)}`, client.id);
  return entry;
}

function formEntryContents(e){
  const parts = [];
  if(e.intake) parts.push('Intake formu');
  if(e.consentType) parts.push(`Onam (${CONSENT_TYPES[e.consentType] || e.consentType})`);
  (e.scales || []).forEach(id => parts.push(FORM_SCALES[id] ? FORM_SCALES[id].title : id));
  return parts.join(' · ');
}

async function createGmailTextDraft(to, subject, bodyText){
  const token = await ensureGoogleAccessToken();
  if(!token) return { ok:false, error:'Google bağlantısı kurulamadı.' };
  const mime =
    (to ? `To: ${to}\r\n` : '') +
    `Subject: ${encodeMimeSubject(subject)}\r\n` +
    `MIME-Version: 1.0\r\n` +
    `Content-Type: text/plain; charset="UTF-8"\r\n` +
    `Content-Transfer-Encoding: base64\r\n\r\n` +
    utf8ToBase64(bodyText);
  try{
    const res = await fetch('https://www.googleapis.com/gmail/v1/users/me/drafts', {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: { raw: base64UrlEncode(mime) } })
    });
    if(!res.ok){
      const err = await res.json().catch(()=>({}));
      return { ok:false, error: err.error && err.error.message ? err.error.message : `HTTP ${res.status}` };
    }
    return { ok:true };
  }catch(e){ return { ok:false, error: e.message }; }
}

// The e-mail deliberately says nothing about which forms are inside.
async function createFormLinkDraft(client, entry){
  const sp = client.profile && client.profile.secondPerson;
  const primaryEmail = (client.profile && client.profile.email || '').trim();
  const until = new Date(entry.expiresAt).toLocaleDateString('en-CA', { year:'numeric', month:'long', day:'numeric' });
  const body = (name, token) => `Hello${name ? ' ' + name : ''},\n\nPlease complete your forms before our next session using the secure link below. It takes about 3 to 5 minutes and works on a phone.\n\n${formLinkForToken(token)}\n\nThis link is personal: it can be used once and is valid until ${until}.\n\nBest regards,\n${getProvider().name || ''}`;
  // Couples: one separate draft per person, each to that person's own address with their own link.
  const targets = entry.parts
    ? entry.parts.map((pt, i) => ({ name: pt.name, token: pt.token, email: i === 0 ? primaryEmail : ((sp && sp.email) || '').trim(), skip: pt.status !== 'open' }))
    : [{ name: entry.consentType === 'minor' ? '' : client.name, label: client.name, token: entry.token, email: primaryEmail }];
  const lines = [];
  const sent = [];
  for(const t of targets){
    const label = t.label || t.name;
    if(t.skip) continue;
    if(!t.email){ lines.push(`❌ ${label}: profilde e-posta yok — bağlantısını kopyalayıp gönder`); continue; }
    const r = await createGmailTextDraft(t.email, 'Forms to complete before your session', body(t.name, t.token));
    if(r.ok){ sent.push(t.email); lines.push(`✅ ${label}: taslak hazır → ${t.email}`); }
    else lines.push(`❌ ${label}: ${r.error}`);
  }
  if(sent.length){
    const live = state.clients.find(c => c.id === client.id);
    const liveEntry = live && (live.formRequests || []).find(e => e.token === entry.token);
    if(liveEntry){
      liveEntry.sentTo = Array.from(new Set([...(liveEntry.sentTo || []), ...sent]));
      saveState();
    }
  }
  return { ok: sent.length > 0 && lines.every(l => l.startsWith('✅')), anyOk: sent.length > 0, summary: lines.join('\n') || 'Gönderilecek açık bağlantı yok.' };
}

/* ----- Checking for submitted forms ----- */
let formCheckRunning = false;
async function checkOpenFormRequests(){
  if(formCheckRunning || !currentUser || !state || !hasLoadedOnce) return;
  formCheckRunning = true;
  let changed = false;
  const newlyDone = [];
  try{
    const open = [];
    (state.clients || []).forEach(c => (c.formRequests || []).forEach(e => {
      if(e.status !== 'open') return;
      if(e.parts) e.parts.forEach((pt, i) => { if(pt.status === 'open') open.push({ clientId: c.id, entryToken: e.token, token: pt.token, part: i }); });
      else open.push({ clientId: c.id, entryToken: e.token, token: e.token, part: null });
    }));
    for(const o of open){
      let snap;
      try{ snap = await window.FB.getDoc(formResponseRef(o.token)); }
      catch(e){ console.error('Form yanıtı kontrol edilemedi', e); continue; }
      // state may have been replaced while waiting — always work on the live objects.
      const client = state.clients.find(c => c.id === o.clientId);
      const entry = client && (client.formRequests || []).find(e => e.token === o.entryToken);
      if(!entry || entry.status !== 'open') continue;
      const target = o.part === null ? entry : (entry.parts || [])[o.part]; // the entry itself, or one person's part
      if(!target || target.status !== 'open') continue;
      if(snap.exists()){
        const d = snap.data();
        let payload;
        try{ payload = JSON.parse(d.payload); }catch(e){ console.error('Form yanıtı okunamadı', e); continue; }
        target.status = 'done';
        target.submittedAt = d.submittedAt && d.submittedAt.toMillis ? d.submittedAt.toMillis() : Date.now();
        (payload.scales || []).forEach(sc => { sc.respondentName = o.part === null ? client.name : target.name; });
        target.result = summarizeFormPayload(payload);
        if(o.part === null){
          entry.reviewed = !entry.result.flag;
        }else{
          const doneParts = entry.parts.filter(pt => pt.status === 'done');
          entry.result = { scales: doneParts.flatMap(pt => pt.result.scales), signers: doneParts.flatMap(pt => pt.result.signers), intake: doneParts.flatMap(pt => pt.result.intake || []), flag: doneParts.some(pt => pt.result.flag) };
          entry.submittedAt = Math.max(...doneParts.map(pt => pt.submittedAt));
          if(doneParts.length === entry.parts.length) entry.status = 'done';
          if(target.result.flag) entry.reviewed = false;
          else if(entry.reviewed === undefined) entry.reviewed = true;
        }
        changed = true;
        newlyDone.push({ client, entry, who: o.part === null ? '' : target.name, flag: target.result.flag });
      }else if(Date.now() > entry.expiresAt){
        target.status = 'expired';
        if(o.part !== null && entry.parts.every(pt => pt.status !== 'open')) entry.status = 'expired';
        changed = true;
      }
    }
  }finally{ formCheckRunning = false; }
  if(changed){
    saveState();
    newlyDone.forEach(({ client, entry, who, flag })=>{
      const label = who || client.name;
      showToast(flag ? `⚠️ ${label}: formda bugün bakılması gereken bir yanıt var.` : `📋 ${label} formlarını doldurdu.`);
      logAudit('form dolduruldu', `${label} - ${formEntryContents(entry)}`, client.id);
    });
    render();
  }
}

function formEntryHtml(e){
  const sent = formatShortDate(isoDate(new Date(e.createdAt)));
  let statusHtml;
  if(e.status === 'done') statusHtml = `<span class="form-pill done">Dolduruldu · ${formatBackupTime(e.submittedAt)}</span>`;
  else if(e.status === 'expired' || Date.now() > e.expiresAt) statusHtml = `<span class="form-pill expired">Süresi doldu</span>`;
  else statusHtml = `<span class="form-pill open">Bekliyor · son gün ${formatShortDate(isoDate(new Date(e.expiresAt)))}</span>`;
  const r = e.result;
  const multi = r && new Set(r.scales.map(s => s.name)).size > 1;
  const resultHtml = r ? `
    <div class="form-result">
      ${r.signers.length ? `<div>✍️ İmzalayan: ${escapeHtml(r.signers.join(', '))}</div>` : ''}
      ${(r.intake && r.intake.length) ? `<div>📋 Intake: ${escapeHtml(r.intake.join(', '))}</div>` : ''}
      ${r.scales.map(s => `<div><strong>${FORM_SCALES[s.id].title}${multi ? ' — ' + escapeHtml(s.name) : ''}:</strong> ${s.total} (${s.band})${s.item9 > 0 ? ` <span class="form-flag">⚠️ Madde 9: ${escapeHtml(FORM_FREQ[s.item9])}</span>` : ''}</div>`).join('')}
    </div>` : '';
  const isOpen = e.status === 'open' && Date.now() <= e.expiresAt;
  const btn = (act, label) => `<button type="button" class="form-act" data-act="${act}">${label}</button>`;
  return `
  <div class="form-entry ${r && r.flag && !e.reviewed ? 'flagged' : ''}" data-token="${escapeAttr(e.token)}">
    <div class="form-entry-top"><strong>${escapeHtml(formEntryContents(e))}</strong>${statusHtml}</div>
    <div class="form-entry-meta">Gönderim: ${sent}${(e.sentTo && e.sentTo.length) ? ' → ' + escapeHtml(e.sentTo.join(', ')) : ''}</div>
    ${e.parts ? `<div class="form-entry-meta">${e.parts.map(pt => `${escapeHtml(pt.name)}: ${pt.status === 'done' ? '✓ doldurdu' : (pt.status === 'expired' || Date.now() > e.expiresAt) ? 'doldurmadı (süre doldu)' : 'bekliyor'}`).join(' · ')}</div>` : ''}
    ${resultHtml}
    <div class="form-entry-actions">
      ${r && r.flag && !e.reviewed ? btn('reviewed', '✓ Gördüm, değerlendirdim') : ''}
      ${isOpen ? (e.parts
          ? e.parts.map((pt,i)=> pt.status === 'open' ? btn('copy:' + i, `🔗 ${escapeHtml(pt.name)} bağlantısı`) : '').join('')
          : btn('copy:0', '🔗 Bağlantıyı kopyala')) + btn('draft', '📧 Gmail taslağı') : ''}
      ${r ? btn('view', '👁 Yanıtları gör') : ''}
      ${r && e.consentType ? btn('pdf-consent', '📄 İmzalı onam PDF') + btn('drive-consent', "☁️ Onamı Drive'a kaydet") : ''}
      ${r && e.intake ? btn('pdf-intake', '📄 Intake PDF') + btn('drive-intake', "☁️ Intake'i Drive'a kaydet") : ''}
      ${r && (e.scales || []).length ? btn('pdf-scales', '📄 Ölçek PDF') + btn('drive-scales', "☁️ Ölçeği Drive'a kaydet") : ''}
      ${btn('delete', (e.status === 'open' && !r) ? 'İptal et' : 'Sil')}
    </div>
  </div>`;
}

function wireFormsPanel(client){
  const panel = document.getElementById('formsPanel');
  if(!panel) return;
  const refresh = ()=>{ formsPanelOpenNext = true; renderMain(); };
  document.getElementById('sendFormsBtn').addEventListener('click', ()=> openSendFormsModal(client));
  panel.querySelectorAll('.form-act').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const token = btn.closest('[data-token]').getAttribute('data-token');
      const live = ()=> (state.clients.find(c => c.id === client.id) || client);
      const entry = (live().formRequests || []).find(e => e.token === token);
      if(!entry) return;
      const act = btn.getAttribute('data-act');
      const original = btn.textContent;
      const busy = t => { btn.disabled = true; btn.textContent = t; };
      const done = (t, ms) => { btn.textContent = t; setTimeout(()=>{ if(document.body.contains(btn)){ btn.textContent = original; btn.disabled = false; } }, ms || 2500); };
      if(act.startsWith('copy:')){ copyFormLink(formTokens(entry)[Number(act.slice(5))]); return; }
      if(act === 'reviewed'){ entry.reviewed = true; saveState(); logAudit('form yanıtı değerlendirildi olarak işaretlendi', client.name, client.id); refresh(); return; }
      if(act === 'draft'){
        if(!clientEmailList(client)){ alert('Bu danışanın profilinde e-posta yok. Bağlantıyı kopyalayıp başka yolla gönderebilirsin.'); return; }
        busy('⏳ Hazırlanıyor…');
        const r = await createFormLinkDraft(client, entry);
        if(r.ok){ showToast(r.summary); refresh(); }
        else{ alert(r.summary); if(r.anyOk) refresh(); else done(original, 10); }
        return;
      }
      if(act === 'delete'){
        const msg = entry.result
          ? 'Bu form kaydı, danışanın yanıtları ve imzasıyla birlikte kalıcı olarak silinsin mi? PDF olarak kaydetmediysen geri getirilemez.'
          : 'Bu bağlantı iptal edilsin mi? Danışan artık bu bağlantıyla form dolduramaz.';
        if(!confirm(msg)) return;
        busy('Siliniyor…');
        try{
          const targets = entry.parts ? entry.parts.map(pt => ({ token: pt.token, key: pt.key })) : [{ token: entry.token, key: entry.key }];
          for(const t of targets){
            try{ await window.FB.deleteDoc(formResponseRef(t.token)); }catch(e){ /* no response yet */ }
            try{ await window.FB.deleteDoc(window.FB.doc(window.FB.db, 'users', currentPersonId(), 'formRequests', t.token, 'status', 'done')); }catch(e){ /* no marker */ }
            if(t.key) await window.FB.deleteDoc(formContentRef(t.token, t.key));
            await window.FB.deleteDoc(formRequestRef(t.token));
          }
        }catch(e){
          console.error('Form silinemedi', e);
          alert('Silinemedi, tekrar dener misin?');
          done(original, 10);
          return;
        }
        const c = live();
        c.formRequests = (c.formRequests || []).filter(e => e.token !== token);
        formRecordCache.delete(token);
        saveState();
        logAudit(entry.result ? 'form kaydı silindi' : 'form bağlantısı iptal edildi', client.name, client.id);
        refresh();
        return;
      }
      // Everything below needs the stored answers.
      busy('⏳ Yükleniyor…');
      let rec;
      try{ rec = await loadFormRecord(entry, live()); }
      catch(e){ console.error('Form kaydı yüklenemedi', e); alert('Form kaydı yüklenemedi, bağlantını kontrol et.'); done(original, 10); return; }
      if(act === 'view'){ done(original, 10); openFormResponseModal(client, entry, rec); return; }
      try{
        const isConsent = act.endsWith('consent'), isIntake = act.endsWith('intake');
        const doc = isConsent ? await buildConsentPdf(client, entry, rec) : isIntake ? await buildIntakePdf(client, entry, rec) : await buildScalesPdf(client, entry, rec);
        const filename = formPdfFilename(isConsent ? 'Consent' : isIntake ? 'Intake' : 'Scales', client, entry);
        if(act.startsWith('pdf')){
          await savePdfWithPicker(doc, filename);
          logAudit(isConsent ? 'imzalı onam PDF indirildi' : isIntake ? 'intake PDF indirildi' : 'ölçek PDF indirildi', client.name, client.id);
          done(original, 10);
        }else{
          if(!state.driveFormsFolderId){ alert('Önce Ayarlar > Form Kayıt Klasörü bölümünden bir klasör seçmelisin.'); done(original, 10); return; }
          busy('⏳ Kaydediliyor…');
          const ok = await uploadPdfToDriveFolder(doc, filename, state.driveFormsFolderId);
          logAudit(ok ? (isConsent ? "imzalı onam Drive'a kaydedildi" : isIntake ? "intake PDF Drive'a kaydedildi" : "ölçek PDF Drive'a kaydedildi") : "form PDF Drive'a kaydedilemedi", client.name, client.id);
          done(ok ? '✅ Kaydedildi' : '❌ Başarısız, tekrar dene', 3000);
        }
      }catch(e){
        console.error('PDF oluşturulamadı', e);
        alert('PDF oluşturulamadı: ' + (e && e.message ? e.message : 'bilinmeyen hata'));
        done(original, 10);
      }
    });
  });
}

const formRecordCache = new Map();
async function loadFormRecord(entry, client){
  if(entry.status === 'done' && formRecordCache.has(entry.token)) return formRecordCache.get(entry.token);
  // The stored forms carry no names; they are added here from the therapist's own client record.
  const label = (rec)=>{
    rec.request = { ...rec.request, clientLabel: entry.parts ? entry.parts.map(pt => pt.name).join(' & ') : client.name };
    return rec;
  };
  const loadOne = async (token, key)=>{
    const [reqSnap, resSnap, contentSnap] = await Promise.all([
      window.FB.getDoc(formRequestRef(token)), window.FB.getDoc(formResponseRef(token)),
      key ? window.FB.getDoc(formContentRef(token, key)) : Promise.resolve(null)
    ]);
    if(!reqSnap.exists() || (key && !contentSnap.exists())) throw new Error('Kayıt bulunamadı');
    const res = resSnap.exists() ? resSnap.data() : null;
    return { request: { ...reqSnap.data(), ...(contentSnap ? contentSnap.data() : {}) }, payload: res ? JSON.parse(res.payload) : null, submittedAt: res && res.submittedAt && res.submittedAt.toMillis ? res.submittedAt.toMillis() : null };
  };
  let rec;
  if(entry.parts){
    // Couple: one stored record per person; combine them into one document (signatures in profile order).
    const parts = await Promise.all(entry.parts.map(pt => loadOne(pt.token, pt.key)));
    parts.forEach((pt, i) => { if(pt.payload) (pt.payload.scales || []).forEach(sc => { sc.respondentName = entry.parts[i].name; }); });
    const done = parts.filter(pt => pt.payload);
    if(!done.length) throw new Error('Kayıt bulunamadı');
    const consentDef = parts[0].request.consent;
    rec = {
      request: parts[0].request,
      payload: {
        timezone: Array.from(new Set(done.map(d => d.payload.timezone).filter(Boolean))).join(', '),
        consent: consentDef ? {
          checks: (consentDef.checks || []).map((_, i) => done.every(d => d.payload.consent && d.payload.consent.checks && d.payload.consent.checks[i])),
          signers: parts.map((pt, i) => (pt.payload && pt.payload.consent) ? pt.payload.consent.signers[0] : { role: 'client', name: entry.parts[i].name, missing: true })
        } : null,
        scales: done.flatMap(d => d.payload.scales || []),
        intakes: parts.map((pt, i) => pt.payload && pt.payload.intake ? { ...pt.payload.intake, respondentName: entry.parts[i].name } : null).filter(Boolean)
      },
      submittedAt: Math.max(...done.map(d => d.submittedAt || 0)) || entry.submittedAt,
      tokens: entry.parts.map(pt => pt.token)
    };
  }else{
    const one = await loadOne(entry.token, entry.key);
    if(!one.payload) throw new Error('Kayıt bulunamadı');
    (one.payload.scales || []).forEach(sc => { sc.respondentName = client.name; });
    one.payload.intakes = one.payload.intake ? [{ ...one.payload.intake, respondentName: client.name }] : [];
    rec = { request: one.request, payload: one.payload, submittedAt: one.submittedAt || entry.submittedAt, tokens: [entry.token] };
  }
  label(rec);
  if(entry.status === 'done') formRecordCache.set(entry.token, rec);
  return rec;
}

function formDateTimeEn(ms){
  return new Date(ms).toLocaleString('en-CA', { year:'numeric', month:'long', day:'numeric', hour:'numeric', minute:'2-digit', timeZoneName:'short' });
}

function openFormResponseModal(client, entry, rec){

  const consentHtml = p.consent ? `

    ${(p.consent.signers || []).map(s => s.missing ? `
      <div class="form-view-signer"><div><strong>${escapeHtml(s.name)}</strong><br><span>Henüz imzalamadı</span></div></div>` : `
      <div class="form-view-signer">
        <img src="${escapeAttr(/^data:image\/png;base64,/.test(s.signature || '') ? s.signature : '')}" alt="İmza">
        <div><strong>${escapeHtml(s.name)}</strong>${s.relationship ? ` (${escapeHtml(s.relationship)})` : ''}${s.role === 'guardian' ? ' — veli' : ''}${s.clientName ? `<br><span>Danışan adı (velinin yazdığı): ${escapeHtml(s.clientName)}</span>` : ''}<br><span>${escapeHtml(formDateTimeEn(new Date(s.signedAt).getTime()))}</span></div>
      </div>`).join('')}` : '';
  const scalesHtml = (p.scales || []).filter(s => FORM_SCALES[s.id]).map(s=>{

    const r = scoreFormScale(s);
    return `
      <h3 class="form-view-h">${sc.title}${multi ? ' — ' + escapeHtml(s.respondentName) : ''}: ${r.total} (${r.band})</h3>
      <table class="form-view-table">
        ${sc.items.map((t,i)=>`<tr class="${s.id==='phq9' && i===8 && s.answers[i] > 0 ? 'flag' : ''}"><td>${i+1}. ${escapeHtml(t)}</td><td>${s.answers[i]} — ${escapeHtml(FORM_FREQ[s.answers[i]] || '')}</td></tr>`).join('')}
        ${s.id === 'phq9' ? `<tr><td>Functional difficulty</td><td>${s.difficulty == null ? 'Not answered' : escapeHtml(FORM_DIFFICULTY[s.difficulty])}</td></tr>` : ''}
      </table>`;
  }).join('');
  const intakes = p.intakes || [];
  const intakeHtml = intakes.map(it => `
      <h3 class="form-view-h">${escapeHtml(it.title || 'Intake form')}${intakes.length > 1 ? ' — ' + escapeHtml(it.respondentName || '') : ''}</h3>
      ${(it.sections || []).map(sec => `
        <div class="form-view-sub">${escapeHtml(sec.title)}</div>
        <table class="form-view-table">
          ${(sec.fields || []).map(f => `<tr><td>${escapeHtml(f.label)}</td><td style="white-space:pre-wrap;">${f.value ? escapeHtml(f.type === 'date' ? formatShortDate(f.value) : f.value) : '<span style="color:var(--muted)">—</span>'}</td></tr>`).join('')}
        </table>`).join('')}`).join('');
  const modal = document.createElement('div');
  modal.className = 'backups-modal';
  modal.style.display = 'flex';
  modal.innerHTML = `
    <div class="backups-box" style="max-width:560px; max-height:86vh; overflow:auto;">
      <div class="backups-box-header"><h2>${escapeHtml(client.name)} — form yanıtları</h2><button type="button" id="formViewClose">✕</button></div>
      <div style="padding:0 20px 20px;">
        <div class="form-entry-meta">Gönderildi: ${formatBackupTime(rec.submittedAt)}</div>
        ${intakeHtml}${consentHtml}${scalesHtml}
      </div>
    </div>`;
  document.body.appendChild(modal);
  document.getElementById('formViewClose').addEventListener('click', ()=> modal.remove());
  modal.addEventListener('click', ev=>{ if(ev.target === modal) modal.remove(); });
}

/* ----- PDFs ----- */
let pdfUnicodeFont = null; // null = not tried, false = unavailable
async function loadPdfUnicodeFont(){
  if(pdfUnicodeFont !== null) return pdfUnicodeFont;
  try{
    const base = 'https://cdn.jsdelivr.net/npm/dejavu-fonts-ttf@2.37.3/ttf/';
    const [regular, bold] = await Promise.all(['DejaVuSans.ttf', 'DejaVuSans-Bold.ttf'].map(async f=>{
      const res = await fetch(base + f);
      if(!res.ok) throw new Error('font');
      return btoa(arrayBufferToBinaryString(await res.arrayBuffer()));
    }));
    pdfUnicodeFont = { regular, bold };
  }catch(e){
    console.warn('PDF yazı tipi yüklenemedi, sade karakterlerle devam ediliyor', e);
    pdfUnicodeFont = false;
  }
  return pdfUnicodeFont;
}

let pdfItalicFonts = null;
async function loadPdfItalicFonts(){
  if(pdfItalicFonts !== null) return pdfItalicFonts;
  try{
    const base = 'https://cdn.jsdelivr.net/npm/dejavu-fonts-ttf@2.37.3/ttf/';
    const [italic, bolditalic] = await Promise.all(['DejaVuSans-Oblique.ttf', 'DejaVuSans-BoldOblique.ttf'].map(async f=>{
      const res = await fetch(base + f);
      if(!res.ok) throw new Error('font');
      return btoa(arrayBufferToBinaryString(await res.arrayBuffer()));
    }));
    pdfItalicFonts = { italic, bolditalic };
  }catch(e){ console.warn('İtalik yazı tipi yüklenemedi', e); pdfItalicFonts = false; }
  return pdfItalicFonts;
}

// Fallback when the Unicode font cannot be loaded: keep the PDF readable with the built-in font.
function pdfSafeText(str){
  return toAscii(String(str == null ? '' : str))
    .replace(/[–—]/g, '-').replace(/[‘’]/g, "'").replace(/[“”]/g, '"')
    .replace(/•/g, '-').replace(/…/g, '...').replace(/ /g, ' ')
    .replace(/[^\x09\x0A\x20-\x7E¡-ÿ]/g, '?');
}

async function makePdfWriter(opts){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit:'mm', format:'letter' });
  const font = await loadPdfUnicodeFont();
  let family = 'helvetica';
  let T = pdfSafeText;
  let hasItalic = true; // the built-in font has italics; the Unicode font loads them only when needed
  if(font){
    hasItalic = false;
    if(opts && opts.italic){
      const it = await loadPdfItalicFonts();
      if(it){
        doc.addFileToVFS('DejaVuSans-Oblique.ttf', it.italic); doc.addFont('DejaVuSans-Oblique.ttf', 'DejaVu', 'italic');
        doc.addFileToVFS('DejaVuSans-BoldOblique.ttf', it.bolditalic); doc.addFont('DejaVuSans-BoldOblique.ttf', 'DejaVu', 'bolditalic');
        hasItalic = true;
      }
    }
    doc.addFileToVFS('DejaVuSans.ttf', font.regular); doc.addFont('DejaVuSans.ttf', 'DejaVu', 'normal');
    doc.addFileToVFS('DejaVuSans-Bold.ttf', font.bold); doc.addFont('DejaVuSans-Bold.ttf', 'DejaVu', 'bold');
    family = 'DejaVu';
    T = s => String(s == null ? '' : s);
  }
  const M = 18, W = 215.9 - 2*M, BOTTOM = 262;
  let y = M + 2;
  const w = {
    doc,
    ensure(h){ if(y + h > BOTTOM){ doc.addPage(); y = M + 2; } },
    text(str, o){
      o = o || {};
      const size = o.size || 10.5, indent = o.indent || 0;
      doc.setFont(family, o.bold ? 'bold' : 'normal'); doc.setFontSize(size); doc.setTextColor(o.color == null ? 30 : o.color);
      const lh = size * 0.3528 * 1.38;
      T(str).split('\n').forEach(part=>{
        doc.splitTextToSize(part || ' ', W - indent).forEach(line=>{ w.ensure(lh); doc.text(line, M + indent, y + lh*0.78); y += lh; });
      });
      y += (o.gap == null ? 2.2 : o.gap);
    },
    // Styled text: runs of { text, b, i, u, size } wrapped word by word.
    rich(runs, o){
      o = o || {};
      const base = o.size || 10.5, indent = o.indent || 0, maxW = W - indent;
      const ptOf = r => r.size === 's' ? base * 0.82 : r.size === 'l' ? base * 1.18 : r.size === 'xl' ? base * 1.45 : base;
      const styleOf = r => { const b = o.bold || r.b, i = hasItalic && r.i; return b && i ? 'bolditalic' : b ? 'bold' : i ? 'italic' : 'normal'; };
      const tokens = [];
      runs.forEach(r => {
        const pt = ptOf(r), style = styleOf(r);
        T(r.text).split(/(\n|\s+)/).forEach(part => {
          if(!part) return;
          if(part === '\n'){ tokens.push({ nl: true }); return; }
          const s = /^\s+$/.test(part) ? ' ' : part;
          doc.setFont(family, style); doc.setFontSize(pt);
          tokens.push({ s, pt, style, u: !!r.u, space: s === ' ', w: doc.getTextWidth(s) });
        });
      });
      let line = [], lineW = 0;
      const flush = ()=>{
        while(line.length && line[line.length-1].space) line.pop();
        const pt = line.length ? Math.max(...line.map(t => t.pt)) : base;
        const lh = pt * 0.3528 * 1.38;
        w.ensure(lh);
        let x = M + indent;
        const by = y + lh * 0.78;
        line.forEach(t => {
          doc.setFont(family, t.style); doc.setFontSize(t.pt); doc.setTextColor(30);
          doc.text(t.s, x, by);
          if(t.u){ doc.setDrawColor(30); doc.setLineWidth(0.2); doc.line(x, by + 0.7, x + t.w, by + 0.7); }
          x += t.w;
        });
        y += lh; line = []; lineW = 0;
      };
      tokens.forEach(t => {
        if(t.nl){ flush(); return; }
        if(t.space && !line.length) return;
        if(!t.space && line.length && lineW + t.w > maxW) flush();
        line.push(t); lineW += t.w;
      });
      if(line.length) flush();
      y += (o.gap == null ? 2.2 : o.gap);
    },
    space(h){ y += h; },
    rule(){ w.ensure(5); doc.setDrawColor(205); doc.line(M, y, M + W, y); y += 4; },
    image(dataUrl, widthMm){
      try{
        const props = doc.getImageProperties(dataUrl);
        const h = widthMm * props.height / props.width;
        w.ensure(h + 2);
        doc.addImage(dataUrl, 'PNG', M, y, widthMm, h);
        y += h + 1.5;
      }catch(e){ console.error('İmza görseli eklenemedi', e); w.text('[signature image unavailable]', { size:9, color:120 }); }
    },
    footers(label){
      const n = doc.getNumberOfPages();
      for(let i = 1; i <= n; i++){
        doc.setPage(i); doc.setFont(family, 'normal'); doc.setFontSize(8); doc.setTextColor(125);
        doc.text(T(`${label} — Page ${i} of ${n}`), M, 271);
      }
    }
  };
  return w;
}

function formPdfHeader(w, title, rec){
  const t = rec.request.therapist || {};
  w.text(rec.request.practice || 'İki Therapy', { size:9, color:110, gap:1 });
  w.text(title, { size:16, bold:true, gap:3 });
  w.text(`Therapist: ${t.name || ''}${t.credential ? ', ' + t.credential : ''}${t.regNumber ? ' — Registration No. ' + t.regNumber : ''}`, { size:9.5, color:90, gap:0.8 });
  w.text(`Client: ${rec.request.clientLabel || ''}`, { size:9.5, color:90, gap:2 });
  w.rule();
}

function formPdfRecord(w, entry, rec, extra){
  w.rule();
  w.text('Electronic record', { size:9.5, bold:true, gap:1.2 });
  const lines = [
    `Request ID: ${(rec.tokens || [entry.token]).map(t => t.slice(0, 10)).join(', ')}`,
    `Link created: ${formDateTimeEn(entry.createdAt)}`,
    (entry.sentTo && entry.sentTo.length) ? `${entry.parts ? 'Personal links e-mailed separately to' : 'Link e-mailed to'}: ${entry.sentTo.join(', ')}` : 'Link delivered by the therapist directly (no e-mail draft recorded)',
    `Submitted (server time): ${formDateTimeEn(rec.submittedAt)}`,
    rec.payload.timezone ? `Time zone of the device used: ${rec.payload.timezone}` : '',
    entry.dobCheck ? 'Identity check: date of birth confirmed before the form opened' : ''
  ].concat(extra || []).filter(Boolean);
  lines.forEach(l => w.text(l, { size:8.5, color:95, gap:0.6 }));
}

async function buildConsentPdf(client, entry, rec){
  const c = rec.request.consent, pc = rec.payload.consent;
  if(!c || !pc) throw new Error('Bu kayıtta onam formu yok');
  const blocks = consentHtmlToBlocks(c.html);
  const w = await makePdfWriter({ italic: blocks.some(b => b.runs.some(r => r.i)) });
  // No generated header here: the consent text starts with its own title and therapist details.
  blocks.forEach(b=>{
    if(b.type === 'h'){ w.space(1.5); w.ensure(12); w.rich(b.runs, { size:11.5, bold:true, gap:1.6 }); }
    else if(b.type === 'li') w.rich(b.runs, { indent:4, gap:1.2 });
    else w.rich(b.runs, { gap:2.6 });
  });
  w.rule();
  w.ensure(60);
  w.text('Agreement and signature', { size:12, bold:true, gap:2 });
  (c.checks || []).forEach((t,i)=> w.text(`${pc.checks && pc.checks[i] ? '[x]' : '[ ]'} ${t}`, { gap:2.4 }));
  (pc.signers || []).forEach((s,i)=>{
    w.ensure(48);
    w.space(2);
    w.text(s.role === 'guardian' ? 'Parent / guardian' : ((pc.signers.length > 1) ? `Client ${i+1}` : 'Client'), { size:10, bold:true, gap:1 });
    if(s.missing){
      w.text(`Name: ${s.name}`, { size:10, gap:0.8 });
      w.text('Not signed.', { size:9.5, color:80, gap:2 });
      return;
    }
    if(/^data:image\/png;base64,/.test(s.signature || '')) w.image(s.signature, 62);
    w.text(`Name: ${s.name}${s.relationship ? ` (${s.relationship} of the client)` : ''}`, { size:10, gap:0.8 });
    if(s.clientName) w.text(`Client's name as entered by the signer: ${s.clientName}`, { size:10, gap:0.8 });
    w.text(`Signed electronically${s.signatureMethod === 'typed' ? ' (signature adopted by typing the name)' : ''}: ${formDateTimeEn(new Date(s.signedAt).getTime())}`, { size:9.5, color:80, gap:2 });
  });
  if(state.providerSignature){
    const t = rec.request.therapist || {};
    w.ensure(48);
    w.space(2);
    w.text('Therapist', { size:10, bold:true, gap:1 });
    w.image(state.providerSignature, 62);
    w.text(`Name: ${t.name || ''}${t.credential ? ', ' + t.credential : ''}`, { size:10, gap:0.8 });
    w.text(`Date: ${formDateTimeEn(entry.createdAt)}`, { size:9.5, color:80, gap:2 });
  }
  formPdfRecord(w, entry, rec, [`Form text version: ${c.version || ''}`]);
  w.footers(`${c.title || 'Consent form'} — ${rec.request.clientLabel || ''}`);
  return w.doc;
}

async function buildScalesPdf(client, entry, rec){
  const scales = (rec.payload.scales || []).filter(s => FORM_SCALES[s.id]);
  if(!scales.length) throw new Error('Bu kayıtta ölçek yok');
  const multi = new Set(scales.map(s => s.respondentName)).size > 1;
  const w = await makePdfWriter();
  formPdfHeader(w, 'Questionnaire results', rec);
  scales.forEach(s=>{
    const sc = FORM_SCALES[s.id];
    const r = scoreFormScale(s);
    w.ensure(40);
    w.text(`${sc.title}${multi ? ' — ' + s.respondentName : ''}`, { size:13, bold:true, gap:1 });
    w.text(`Total score: ${r.total} of ${sc.bands[sc.bands.length-1][0]} — ${r.band}`, { size:11, bold:true, gap:2 });
    w.text(sc.stem, { size:9.5, color:90, gap:2 });
    sc.items.forEach((t,i)=>{
      w.ensure(12);
      w.text(`${i+1}. ${t}`, { size:10, gap:0.4 });
      w.text(`${s.answers[i]} — ${FORM_FREQ[s.answers[i]] || ''}`, { size:10, bold:true, indent:5, gap:1.8 });
    });
    if(s.id === 'phq9'){
      w.text(`Functional difficulty: ${s.difficulty == null ? 'Not answered' : FORM_DIFFICULTY[s.difficulty]}`, { size:10, gap:1.6 });
      if(s.answers[8] > 0) w.text(`Note: item 9 (thoughts of being better off dead or of self-harm) was answered "${FORM_FREQ[s.answers[8]]}".`, { size:10, bold:true, gap:2 });
    }
    w.space(3);
  });
  formPdfRecord(w, entry, rec);
  w.footers(`Questionnaire results — ${rec.request.clientLabel || ''}`);
  return w.doc;
}

async function buildIntakePdf(client, entry, rec){
  const intakes = rec.payload.intakes || [];
  if(!intakes.length) throw new Error('Bu kayıtta intake formu yok');
  const w = await makePdfWriter();
  formPdfHeader(w, intakes[0].title || 'Intake form', rec);
  intakes.forEach((it, idx) => {
    if(idx > 0){ w.doc.addPage(); }
    if(intakes.length > 1) w.text(`Completed by: ${it.respondentName || ''}`, { size:11, bold:true, gap:2.5 });
    (it.sections || []).forEach(sec => {
      w.ensure(22);
      w.text(sec.title, { size:12, bold:true, gap:1.2 });
      if(sec.note) w.text(sec.note, { size:9.5, color:90, gap:1.8 });
      (sec.fields || []).forEach(f => {
        w.ensure(12);
        w.text(f.label, { size:9.5, color:90, gap:0.3 });
        const v = f.value ? (f.type === 'date' ? new Date(f.value + 'T00:00:00').toLocaleDateString('en-CA', { year:'numeric', month:'long', day:'numeric' }) : f.value) : '—';
        w.text(v, { size:10.5, bold:!!f.value, indent:4, gap:1.8 });
      });
      w.space(2.5);
    });
  });
  formPdfRecord(w, entry, rec);
  w.footers(`${intakes[0].title || 'Intake form'} — ${rec.request.clientLabel || ''}`);
  return w.doc;
}

}

/* The shared doc is edited by two people. Instead of overwriting it with our local copy,
   every save re-reads the server copy inside a transaction and applies only OUR changes
   (local vs. the server version our copy was based on) on top of it. */
let practiceBase = null;            // server version the current practiceState was derived from
let practicePendingSaves = 0;
let practiceSaveChain = Promise.resolve();
const PRACTICE_ARRAY_FIELDS = { tasks:'append', notes:'append', activity:'prepend', notifications:'prepend' };
const PRACTICE_OBJECT_FIELDS = ['stats', 'notificationPrefs', 'emailNotificationPrefs'];
const PRACTICE_ARRAY_CAPS = { activity: 50, notifications: 100 };

function jsonClone(v){ return v === undefined ? undefined : JSON.parse(JSON.stringify(v)); }

function setPracticeFromServer(data){
  practiceState = normalizePracticeData(data);
  practiceBase = jsonClone(practiceState);
}

function practiceItemKey(item){ return (item && item.id != null) ? 'id:' + item.id : 'json:' + JSON.stringify(item); }

function mergePracticeArray(baseArr, localArr, serverArr, mode){
  const baseMap = new Map((baseArr||[]).map(i=>[practiceItemKey(i), i]));
  const localMap = new Map((localArr||[]).map(i=>[practiceItemKey(i), i]));
  const serverKeys = new Set((serverArr||[]).map(practiceItemKey));
  const result = [];
  (serverArr||[]).forEach(item=>{
    const k = practiceItemKey(item);
    if(baseMap.has(k) && !localMap.has(k)) return;                         // deleted by us
    if(baseMap.has(k) && localMap.has(k) && JSON.stringify(localMap.get(k)) !== JSON.stringify(baseMap.get(k))){
      result.push(localMap.get(k));                                        // edited by us
    }else{
      result.push(item);                                                   // untouched by us (may contain their edits)
    }
  });
  const added = (localArr||[]).filter(i=>{ const k = practiceItemKey(i); return !baseMap.has(k) && !serverKeys.has(k); });
  return mode === 'prepend' ? [...added, ...result] : [...result, ...added];
}

function mergePracticeObject(baseObj, localObj, serverObj){
  const result = { ...(serverObj||{}) };
  const keys = new Set([...Object.keys(baseObj||{}), ...Object.keys(localObj||{})]);
  keys.forEach(k=>{
    const b = (baseObj||{})[k], l = (localObj||{})[k];
    if(JSON.stringify(b) === JSON.stringify(l)) return;                    // unchanged by us
    if(localObj && Object.prototype.hasOwnProperty.call(localObj, k)) result[k] = l;
    else delete result[k];
  });
  return result;
}

function mergePracticeData(base, local, server){
  base = normalizePracticeData(base); local = normalizePracticeData(local); server = normalizePracticeData(server);
  const out = {};
  Object.keys(PRACTICE_ARRAY_FIELDS).forEach(f=>{
    let arr = mergePracticeArray(base[f], local[f], server[f], PRACTICE_ARRAY_FIELDS[f]);
    if(PRACTICE_ARRAY_CAPS[f] && arr.length > PRACTICE_ARRAY_CAPS[f]) arr = arr.slice(0, PRACTICE_ARRAY_CAPS[f]);
    out[f] = arr;
  });
  PRACTICE_OBJECT_FIELDS.forEach(f=>{ out[f] = mergePracticeObject(base[f], local[f], server[f]); });
  return jsonClone(out);
}

function savePracticeShared(){
  if(!currentUser || !practiceState) return Promise.resolve();
  // Capture our copy and the version it was based on right now (synchronously).
  const local = jsonClone(practiceState);
  const base = practiceBase ? jsonClone(practiceBase) : normalizePracticeData(null);
  practicePendingSaves++;
  practiceSaveChain = practiceSaveChain.then(async ()=>{
    try{
      const ref = window.FB.doc(window.FB.db, 'practiceShared', 'main');
      const merged = await window.FB.runTransaction(window.FB.db, async (tx)=>{
        const snap = await tx.get(ref);
        const server = snap.exists() ? snap.data() : null;
        const result = mergePracticeData(base, local, server);
        tx.set(ref, result);
        return result;
      });
      practicePendingSaves--;
      if(practicePendingSaves === 0){
        // Nothing newer queued: adopt the merged server state (includes the other person's changes).
        setPracticeFromServer(merged);
        updateNotificationBell();
      }
    }catch(e){
      practicePendingSaves--;
      console.error('Ortaklık verisi kaydedilemedi', e);
      alert('Ortak veriler kaydedilemedi (' + (e && e.code ? e.code : 'hata') + '). İnternet bağlantısını ve Firestore "practiceShared" iznini kontrol et.');
    }
  });
  return practiceSaveChain;
}

function computePersonalStats(){
  const now = new Date();
  const thisMonthStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  const thisYearStr = String(now.getFullYear());
  let activeClients = 0, terminatedClients = 0;
  let sessionsThisMonth = 0, sessionsThisYear = 0, revenueThisMonth = 0, lateChangesThisMonth = 0;
  (state.clients||[]).forEach(c=>{
    if(c.profile && c.profile.terminated) terminatedClients++; else activeClients++;
    lateChangesThisMonth += clientLateChanges(c).filter(l => (l.date || '').startsWith(thisMonthStr)).length;
    (c.sessions||[]).forEach(s=>{
      if(!s.date || !isSessionDue(s)) return;
      if(s.date.startsWith(thisMonthStr)){
        sessionsThisMonth++;
        if(s.paymentDone){
          const rate = (c.profile && c.profile.ifhp) ? (getSessionFullRate(c, s) * 0.70) : getSessionFullRate(c, s);
          revenueThisMonth += rate;
        }
      }
      if(s.date.startsWith(thisYearStr)) sessionsThisYear++;
    });
  });
  return { activeClients, terminatedClients, sessionsThisMonth, sessionsThisYear, revenueThisMonth, lateChangesThisMonth, monthKey: thisMonthStr, yearKey: thisYearStr, monthlyRevenue: computeMonthlyRevenue(12), monthlyNoShowRate: computeMonthlyNoShowRate(12), monthlyLateChanges: computeMonthlyLateChanges(12) };
}

// Publishes my stats to the shared doc. Previously this only happened when opening Yönetim,
// so the other person kept seeing last month's "this month" numbers until then.
function publishMyStatsIfNeeded(force){
  const me = currentPersonId();
  if(!me || !practiceState || !state) return false;
  const fresh = computePersonalStats();
  const prev = (practiceState.stats || {})[me];
  const comparable = o => { if(!o) return null; const { updatedAt, ...rest } = o; return JSON.stringify(rest); };
  const old = !prev || !prev.updatedAt || (Date.now() - prev.updatedAt > 6*60*60*1000);
  if(!force && !old && comparable(prev) === comparable(fresh)) return false;
  if(!practiceState.stats) practiceState.stats = {};
  practiceState.stats[me] = { ...fresh, updatedAt: Date.now() };
  savePracticeShared();
  return true;
}

function computeMonthlyRevenue(monthsBack){
  const now = new Date();
  const buckets = [];
  const monthNames = ['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara'];
  for(let i = monthsBack-1; i >= 0; i--){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    buckets.push({ key: `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`, label: monthNames[d.getMonth()], total: 0 });
  }
  const bucketMap = {};
  buckets.forEach(b=>bucketMap[b.key]=b);
  (state.clients||[]).forEach(c=>{
    (c.sessions||[]).forEach(s=>{
      if(!s.date || !isSessionDue(s) || !s.paymentDone) return;
      const key = s.date.slice(0,7);
      if(bucketMap[key]){
        const rate = (c.profile && c.profile.ifhp) ? (getSessionFullRate(c, s) * 0.70) : getSessionFullRate(c, s);
        bucketMap[key].total += rate;
      }
    });
  });
  return buckets;
}

// Re-maps someone's published buckets onto the current 12-month window by month key,
// so data they shared in an earlier month doesn't shift by one or more months.
function alignBucketsToWindow(buckets, windowBuckets, emptyFields){
  if(!buckets) return null;
  const byKey = {};
  buckets.forEach(b=>{ if(b && b.key) byKey[b.key] = b; });
  return windowBuckets.map(w => byKey[w.key] ? { ...byKey[w.key], label: w.label } : { key: w.key, label: w.label, ...emptyFields });
}

function getFilteredMonthlyRevenue(filter){
  const shared = (practiceState && practiceState.stats) || {};
  const me = currentPersonId();
  // Whichever bucket represents "my own" data is always computed live from local state (freshest);
  // the other person's data comes from what they last published to the shared doc.
  const myBuckets = computeMonthlyRevenue(12);
  const kubilayBuckets = (me === 'kubilay') ? myBuckets : alignBucketsToWindow(shared.kubilay && shared.kubilay.monthlyRevenue, myBuckets, { total: 0 });
  const duyguBuckets = (me === 'duygu') ? myBuckets : alignBucketsToWindow(shared.duygu && shared.duygu.monthlyRevenue, myBuckets, { total: 0 });

  if(filter === 'kubilay') return kubilayBuckets || null;
  if(filter === 'duygu') return duyguBuckets || null;
  // toplam
  if(!kubilayBuckets && !duyguBuckets) return null;
  const base = kubilayBuckets || duyguBuckets;
  return base.map((b,i)=>({
    key: b.key, label: b.label,
    total: (kubilayBuckets ? kubilayBuckets[i].total : 0) + (duyguBuckets ? duyguBuckets[i].total : 0)
  }));
}

function computeMonthlyNoShowRate(monthsBack){
  const now = new Date();
  const buckets = [];
  const monthNames = ['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara'];
  for(let i = monthsBack-1; i >= 0; i--){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    buckets.push({ key: `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`, label: monthNames[d.getMonth()], total: 0, noShow: 0 });
  }
  const bucketMap = {};
  buckets.forEach(b=>bucketMap[b.key]=b);
  (state.clients||[]).forEach(c=>{
    (c.sessions||[]).forEach(s=>{
      if(!s.date || !isSessionDue(s)) return;
      const key = s.date.slice(0,7);
      if(bucketMap[key]){
        bucketMap[key].total++;
        if(s.noShow) bucketMap[key].noShow++;
      }
    });
  });
  return buckets.map(b => ({ key: b.key, label: b.label, total: (b.total > 0) ? Math.round((b.noShow / b.total) * 100) : 0, sessionCount: b.total, noShow: b.noShow }));
}

function getFilteredMonthlyNoShowRate(filter){
  const shared = (practiceState && practiceState.stats) || {};
  const me = currentPersonId();
  const myBuckets = computeMonthlyNoShowRate(12);
  const empty = { total: 0, sessionCount: 0, noShow: 0 };
  const kubilayBuckets = (me === 'kubilay') ? myBuckets : alignBucketsToWindow(shared.kubilay && shared.kubilay.monthlyNoShowRate, myBuckets, empty);
  const duyguBuckets = (me === 'duygu') ? myBuckets : alignBucketsToWindow(shared.duygu && shared.duygu.monthlyNoShowRate, myBuckets, empty);

  if(filter === 'kubilay') return kubilayBuckets || null;
  if(filter === 'duygu') return duyguBuckets || null;
  if(!kubilayBuckets && !duyguBuckets) return null;
  const base = kubilayBuckets || duyguBuckets;
  return base.map((b,i)=>{
    const kCount = kubilayBuckets ? (kubilayBuckets[i].sessionCount||0) : 0;
    const dCount = duyguBuckets ? (duyguBuckets[i].sessionCount||0) : 0;
    const noShowOf = (bk, count) => (bk.noShow != null) ? bk.noShow : Math.round(bk.total/100 * count); // older shared data has no raw count
    const kNoShow = kubilayBuckets ? noShowOf(kubilayBuckets[i], kCount) : 0;
    const dNoShow = duyguBuckets ? noShowOf(duyguBuckets[i], dCount) : 0;
    const totalCount = kCount + dCount;
    return { key: b.key, label: b.label, total: totalCount > 0 ? Math.round((kNoShow+dNoShow)/totalCount*100) : 0, sessionCount: totalCount };
  });
}

function noShowChartSvg(filter){
  const buckets = getFilteredMonthlyNoShowRate(filter);
  if(!buckets){
    return `<div class="todo-empty">${filter==='kubilay'?'Kubilay':'Duygu'} henüz veri paylaşmadı.</div>`;
  }
  const max = Math.max(...buckets.map(b=>b.total), 10);
  const width = 600, height = 190, barGap = 6;
  const chartHeight = 130;
  const topPad = 24;
  const barWidth = (width - barGap*(buckets.length-1)) / buckets.length;
  const bars = buckets.map((b,i)=>{
    const barHeight = b.total > 0 ? Math.max(3, (b.total/max) * chartHeight) : 0;
    const x = i * (barWidth + barGap);
    const y = chartHeight - barHeight + topPad;
    const label = b.total > 0 ? `<text x="${(x+barWidth/2).toFixed(1)}" y="${(y-6).toFixed(1)}" font-size="10" font-weight="600" fill="#2b2d33" text-anchor="middle">%${b.total}</text>` : '';
    return `
      <rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barWidth.toFixed(1)}" height="${barHeight.toFixed(1)}" rx="3" fill="#f0c8c8"><title>${b.label}: %${b.total} (${b.sessionCount} seans)</title></rect>
      ${label}
      <text x="${(x+barWidth/2).toFixed(1)}" y="${height-8}" font-size="10" fill="#6b6f78" text-anchor="middle">${b.label}</text>`;
  }).join('');
  return `<svg viewBox="0 0 ${width} ${height}" style="width:100%; height:auto; display:block;">${bars}</svg>`;
}
