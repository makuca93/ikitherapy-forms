<style>
  :root{
    --ink:#2b2d33;
    --muted:#6b6f78;
    --card:#ffffff;
    --card-line:#e2e2ea;
    --paper:#fbfafc;
    --highlight:#d9e3f0;
    --highlight-line:#c3d3e6;
    --grad-start:#dfe7f4;
    --grad-end:#f6e3ea;
    --red:#c15a6b;
    --red-bg:#f8e2e6;
    --green:#4f8f7c;
    --green-bg:#e2f0ea;
    --neutral:#b7bcc2;
    --neutral-bg:#eef0f2;
    --pink:#f0c7d4;
  }
  *{box-sizing:border-box;}
  html, body{
    height:100%;
    margin:0;
    overflow:hidden;
    background:var(--paper);
  }
  body{
    font-family:'IBM Plex Sans', sans-serif;
    color:var(--ink);
    background:var(--paper);
  }
  h1,h2,h3,.brand{font-family:'Fraunces', serif;}

  .file-setup{
    position:fixed; inset:0;
    display:flex; align-items:center; justify-content:center;
    background:linear-gradient(160deg, var(--grad-start) 0%, var(--grad-end) 100%);
    z-index:50;
    padding:20px;
  }
  .setup-box{
    background:var(--card);
    border:1px solid var(--card-line);
    border-radius:14px;
    padding:32px 36px;
    max-width:420px;
    text-align:center;
  }
  .setup-box h2{margin:0 0 10px; font-size:21px;}
  .setup-box p{color:var(--muted); font-size:14px; margin:0 0 20px; line-height:1.55;}
  .setup-box .filename{font-weight:600; color:var(--ink);}
  .setup-actions{display:flex; gap:10px; justify-content:center; flex-wrap:wrap;}
  .setup-actions button{
    padding:10px 18px; border-radius:8px; border:none; cursor:pointer;
    font-family:inherit; font-weight:600; font-size:13.5px;
    background:var(--highlight); color:var(--ink);
  }
  .setup-actions button.secondary{
    background:none; border:1px solid var(--card-line); color:var(--muted);
  }
  .setup-actions button:hover{filter:brightness(0.97);}

  #appShell{
    display:none;
    position:fixed;
    inset:0;
  }
  #appShell.visible{display:flex;}

  #sidebar{
    width:280px;
    flex-shrink:0;
    background:linear-gradient(165deg, var(--grad-start) 0%, var(--grad-end) 100%);
    color:var(--ink);
    border-right:1px solid var(--card-line);
    padding:18px 16px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    color:var(--ink);
  }
  .brand-logo{
    display:block;
    width:auto;
    max-width:100px;
    height:auto;
    flex-shrink:0;
  }
  .brand small{
    display:block;
    font-family:'IBM Plex Sans',sans-serif;
    font-size:9.5px;
    font-weight:500;
    color:var(--muted);
    letter-spacing:0.8px;
    text-transform:uppercase;
    line-height:1.4;
  }
  #clientSearchRow, #prospectSearchRow{
    display:flex;
    align-items:center;
    gap:6px;
  }
  .sidebar-list-toggle{display:flex; gap:6px;}
  .sidebar-list-toggle-btn{
    flex:1;
    background:none;
    border:1px solid var(--card-line);
    color:var(--muted);
    font-family:inherit;
    font-size:11.5px;
    font-weight:600;
    padding:6px 4px;
    border-radius:7px;
    cursor:pointer;
  }
  .sidebar-list-toggle-btn.active{background:var(--highlight); border-color:var(--highlight-line); color:var(--ink);}
  .prospect-row{
    background:var(--card);
    border:1px solid var(--card-line);
    border-radius:9px;
    padding:10px 12px;
    margin-bottom:8px;
  }
  .prospect-row-top{display:flex; align-items:center; justify-content:space-between; gap:8px; cursor:pointer;}
  .prospect-name{font-size:13.5px; font-weight:600; color:var(--ink);}
  .prospect-row-actions{display:flex; gap:4px; flex-shrink:0;}
  .prospect-row-actions button{background:none; border:none; color:var(--muted); cursor:pointer; font-size:12px; padding:2px 4px;}
  .prospect-row-actions button:hover{color:var(--ink);}
  .prospect-details{margin-top:10px; padding-top:10px; border-top:1px dashed var(--card-line); display:flex; flex-direction:column; gap:8px;}
  .prospect-details.collapsed{display:none;}
  .prospect-details input, .prospect-details textarea{
    width:100%;
    font-family:inherit;
    font-size:12.5px;
    padding:6px 8px;
    border:1px solid var(--card-line);
    border-radius:6px;
    background:#fdfcfd;
    color:var(--ink);
  }
  .prospect-details textarea{min-height:50px; resize:vertical;}
  .prospect-contact-actions{display:flex; gap:6px; flex-wrap:wrap;}
  .prospect-convert-btn{
    background:var(--green);
    border:1px solid var(--green);
    color:#fff;
    font-family:inherit;
    font-size:12px;
    font-weight:600;
    padding:7px 10px;
    border-radius:6px;
    cursor:pointer;
  }
  .search-input-wrap{
    position:relative;
    flex:1;
    display:flex;
  }
  #newClientName, #newProspectSearch{
    flex:1;
    padding:8px 28px 8px 10px;
    border-radius:6px;
    border:1px solid var(--card-line);
    background:rgba(255,255,255,0.75);
    color:var(--ink);
    font-family:inherit;
    font-size:13px;
  }
  #newClientName::placeholder, #newProspectSearch::placeholder{color:var(--muted);}
  #clearClientSearchBtn, #clearProspectSearchBtn{
    position:absolute;
    right:4px;
    top:50%;
    transform:translateY(-50%);
    background:none;
    border:none;
    color:var(--muted);
    font-size:12px;
    cursor:pointer;
    padding:4px 6px;
    display:none;
    line-height:1;
  }
  #clearClientSearchBtn:hover, #clearProspectSearchBtn:hover{color:var(--ink);}
  #clearClientSearchBtn.visible, #clearProspectSearchBtn.visible{display:block;}
  .search-empty{
    color:var(--muted);
    font-size:12.5px;
    font-style:italic;
    padding:10px 4px;
    line-height:1.5;
  }
  .sidebar-empty{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    color:var(--muted);
    opacity:0.75;
    flex:1;
    padding:30px 16px;
    gap:12px;
  }
  .sidebar-empty svg{width:52px; height:52px; flex-shrink:0;}
  .sidebar-empty span{font-size:12.5px; line-height:1.5;}
  #clientSearchRow button, #prospectSearchRow button{
    background:var(--highlight);
    border:1px solid var(--highlight-line);
    color:var(--ink);
    font-weight:600;
    border-radius:6px;
    padding:8px 12px;
    cursor:pointer;
    font-size:13px;
    white-space:nowrap;
    flex-shrink:0;
  }
  #clientSearchRow button:hover, #prospectSearchRow button:hover{filter:brightness(0.97);}
  .sort-row{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:12px;
    color:var(--muted);
  }
  .sort-row select{
    flex:1;
    background:rgba(255,255,255,0.75);
    color:var(--ink);
    border:1px solid var(--card-line);
    border-radius:6px;
    padding:5px 6px;
    font-family:inherit;
    font-size:12.5px;
  }
  #clientList, #prospectList{
    list-style:none;
    margin:0;
    padding:0;
    overflow-y:auto;
    flex:1;
    min-height:0;
    display:flex;
    flex-direction:column;
    gap:2px;
  }
  .client-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 10px;
    border-radius:8px;
    cursor:pointer;
    border:1px solid transparent;
  }
  .client-row:hover{background:rgba(255,255,255,0.55);}
  #prospectList .client-row{align-items:flex-start; text-align:left;}
  #prospectList .client-name{text-align:left;}
  .client-row.active{background:var(--highlight); border-color:var(--highlight-line);}
  .seal{
    width:12px;height:12px;border-radius:50%;
    flex-shrink:0;
    box-shadow:0 0 0 3px rgba(43,45,51,0.05);
  }
  .seal.red{background:var(--red);}
  .seal.green{background:var(--green);}
  .seal.neutral{background:var(--neutral);}
  .seal.terminated{background:#4a4a52; box-shadow:0 0 0 3px rgba(74,74,82,0.18);}
  .client-name{
    flex:1;
    font-size:14px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .todo-badge{
    flex-shrink:0;
    min-width:16px;
    height:16px;
    padding:0 4px;
    border-radius:8px;
    background:var(--accent, #c98a4b);
    background:#e8a94b;
    color:#3a2a0a;
    font-size:10px;
    font-weight:700;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .todo-badge.overdue{
    background:var(--red);
    color:#fff;
  }
  .client-del{
    opacity:0;
    color:var(--muted);
    background:none;
    border:none;
    cursor:pointer;
    font-size:13px;
    padding:2px 4px;
  }
  .client-edit{
    opacity:0;
    color:var(--muted);
    background:none;
    border:none;
    cursor:pointer;
    font-size:13px;
    padding:2px 4px;
  }
  .client-row:hover .client-del,
  .client-row:hover .client-edit{opacity:0.7;}
  .client-del:hover{opacity:1 !important; color:var(--red);}
  .client-edit:hover{opacity:1 !important; color:var(--ink);}
  .client-name-input{
    flex:1;
    font-family:inherit;
    font-size:14px;
    padding:4px 6px;
    border-radius:5px;
    border:1px solid var(--highlight-line);
    background:#ffffff;
    color:var(--ink);
  }
  #sidebarFooter{
    margin-top:auto;
    padding-top:12px;
    border-top:1px solid var(--card-line);
    display:flex;
    flex-direction:column;
    gap:8px;
    position:relative;
  }
  #fileStatus{
    font-size:11px;
    color:var(--muted);
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  #fileStatus .dot{
    display:inline-block; width:7px;height:7px;border-radius:50%;
    background:var(--green); margin-right:6px;
  }
  #manualSaveBtn{
    background:var(--highlight);
    border:1px solid var(--highlight-line);
    color:var(--ink);
    font-size:12px;
    font-weight:600;
    padding:8px 10px;
    border-radius:6px;
    cursor:pointer;
    width:100%;
    font-family:inherit;
  }
  #manualSaveBtn:hover{filter:brightness(0.97);}

  .extra-cal-name{flex:0 0 auto; font-size:11px; padding:1px 7px; border-radius:999px; background:var(--neutral-bg); max-width:40%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .conflict-group{background:#fdf0dc; border:1px solid #e6bf86; border-radius:8px; padding:10px 12px; margin-top:8px; font-size:13px; color:#5c4126;}
  .conflict-group ul{margin:6px 0 0; padding-left:18px;}
  .extra-cal-list{display:flex; flex-direction:column; gap:6px; margin:8px 0;}
  .extra-cal-setting-row{display:flex; justify-content:space-between; align-items:center; gap:8px; padding:8px 10px; border:1px solid var(--card-line); border-radius:7px; font-size:13px;}
  .extra-cal-setting-row em{display:block; font-style:normal; font-size:11.5px; color:var(--muted); overflow-wrap:anywhere;}
  .extra-cal-setting-row button{background:none; border:none; color:var(--muted); cursor:pointer; font-size:12px; padding:4px 6px;}
  .extra-cal-bad{color:#b0602a; font-weight:600;}
  .extra-cal-add{display:flex; flex-wrap:wrap; gap:8px; margin-top:8px;}
  .extra-cal-add input{flex:1 1 180px; min-width:0;}
  .extra-cal-pick{display:flex; align-items:center; gap:8px; font-size:13px; padding:6px 0;}
  .extra-cal-help{margin-top:10px; font-size:13px; color:var(--muted);}
  .extra-cal-help summary{cursor:pointer;}
  .extra-cal-help ol{padding-left:18px;}
  @media (max-width: 520px){ .extra-cal-row{flex-wrap:wrap;} .extra-cal-time{min-width:0;} }
  .home-new-appt-btn{display:flex; align-items:center; gap:10px; width:100%; margin:0 0 12px; padding:9px 12px; border:1px solid var(--highlight-line); border-radius:10px; background:linear-gradient(135deg, var(--grad-start), var(--grad-end)); color:var(--ink); font-family:inherit; font-size:13.5px; font-weight:500; letter-spacing:.1px; cursor:pointer; text-align:left; transition:box-shadow .15s, transform .15s;}
  .home-new-appt-btn:hover{box-shadow:0 2px 10px rgba(43,45,51,.08); transform:translateY(-1px);}
  .home-new-appt-btn .plus{flex:0 0 auto; width:24px; height:24px; border-radius:50%; background:var(--card); border:1px solid var(--highlight-line); display:flex; align-items:center; justify-content:center; font-size:16px; line-height:1; color:var(--ink);}
  .home-new-appt-btn .txt{display:flex; flex-direction:column; line-height:1.25;}
  .home-new-appt-btn .sub{font-size:11.5px; color:var(--muted); font-weight:400;}
  .home-appt-overlay{position:fixed; inset:0; background:rgba(43,45,51,0.35); display:flex; align-items:flex-start; justify-content:center; z-index:150; padding:24px 16px; overflow-y:auto;}
  .home-appt-box{background:var(--card); border-radius:14px; width:100%; max-width:560px; padding:16px 18px; box-shadow:0 10px 40px rgba(0,0,0,.18);}
  .home-appt-head{display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:12px;}
  .home-appt-close{background:none; border:none; font-size:16px; cursor:pointer; color:var(--muted); padding:4px 8px;}
  .home-appt-search{width:100%; box-sizing:border-box; padding:10px 12px; border:1px solid var(--card-line); border-radius:8px; font:inherit; margin-bottom:10px;}
  .home-appt-list{display:flex; flex-direction:column; gap:6px; max-height:55vh; overflow-y:auto;}
  .home-appt-client, .home-appt-who button{text-align:left; padding:11px 12px; border:1px solid var(--card-line); border-radius:8px; background:var(--paper); font:inherit; cursor:pointer; color:inherit;}
  .home-appt-client:hover, .home-appt-who button:hover{border-color:var(--muted);}
  .home-appt-who{display:flex; flex-direction:column; gap:8px;}
  .home-appt-back{margin-top:12px; background:none; border:none; color:var(--muted); cursor:pointer; font:inherit; padding:4px 0;}
  .home-appt-box #calendarPanel{border:none; padding:0; margin-bottom:0;}
  .reschedule-overlay{
    position:fixed; inset:0;
    background:rgba(43,45,51,0.35);
    display:flex; align-items:center; justify-content:center;
    z-index:200;
    padding:20px;
  }
  .reschedule-popover{
    background:var(--card);
    border:1px solid var(--card-line);
    border-radius:14px;
    padding:20px 22px;
    width:100%;
    max-width:300px;
    box-shadow:0 10px 30px rgba(0,0,0,0.18);
  }
  .reschedule-popover h3{
    margin:0 0 14px;
    font-size:16px;
    font-family:'Fraunces', serif;
    color:var(--ink);
  }
  .mini-cal-header{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:8px;
  }
  .mini-cal-title{
    font-weight:600; font-size:13.5px; color:var(--ink);
  }
  .mini-cal-nav{
    background:var(--neutral-bg);
    border:1px solid var(--card-line);
    color:var(--ink);
    width:26px; height:26px;
    border-radius:7px;
    cursor:pointer;
    font-size:14px;
    line-height:1;
    display:flex; align-items:center; justify-content:center;
    padding:0;
  }
  .mini-cal-nav:hover{background:var(--highlight);}
  .mini-cal-weekdays{
    display:grid;
    grid-template-columns:repeat(7, 1fr);
    margin-bottom:2px;
  }
  .mini-cal-weekdays span{
    text-align:center;
    font-size:11px;
    color:var(--muted);
    padding:4px 0;
  }
  .mini-cal-grid{
    display:grid;
    grid-template-columns:repeat(7, 1fr);
    gap:2px;
  }
  .mini-cal-cell{
    aspect-ratio:1/1;
    display:flex; align-items:center; justify-content:center;
    border:none;
    background:none;
    border-radius:7px;
    font-family:inherit;
    font-size:12.5px;
    color:var(--ink);
    cursor:pointer;
  }
  .mini-cal-cell.empty{cursor:default;}
  .mini-cal-cell:not(.empty):hover{background:var(--neutral-bg);}
  .mini-cal-cell.today{font-weight:700; color:var(--red);}
  .mini-cal-cell.selected{background:var(--highlight); border:1px solid var(--highlight-line); font-weight:600;}
  .reschedule-time-select{
    width:100%;
    padding:8px 10px;
    border-radius:8px;
    border:1px solid var(--card-line);
    font-family:inherit;
    font-size:13.5px;
    color:var(--ink);
    background:var(--card);
  }
  .reschedule-popover .form-actions{
    display:flex; justify-content:flex-end; gap:8px;
    margin-top:16px;
  }
  .reschedule-confirm-btn{
    background:var(--highlight);
    border:1px solid var(--highlight-line);
    color:var(--ink);
    padding:8px 16px;
    border-radius:8px;
    font-family:inherit;
    font-weight:600;
    font-size:13px;
    cursor:pointer;
  }
  .reschedule-confirm-btn:hover{filter:brightness(0.97);}
  .reschedule-cancel-btn{
    background:none;
    border:1px solid var(--card-line);
    color:var(--muted);
    padding:8px 16px;
    border-radius:8px;
    font-family:inherit;
    font-weight:600;
    font-size:13px;
    cursor:pointer;
  }
  .reschedule-cancel-btn:hover{background:var(--neutral-bg);}
  .ifhp-recent-list{background:var(--neutral-bg); border-radius:8px; padding:10px 12px;}
  .ifhp-recent-title{font-size:11px; font-weight:600; color:var(--muted); text-transform:uppercase; margin:0 0 6px;}
  .ifhp-recent-row{display:flex; justify-content:space-between; gap:10px; font-size:12.5px; color:var(--ink); padding:3px 0;}
  .cal-datetime-btn{
    width:100%;
    text-align:left;
    padding:8px 12px;
    border-radius:8px;
    border:1px solid var(--card-line);
    font-family:inherit;
    font-size:13.5px;
    color:var(--ink);
    background:var(--card);
    cursor:pointer;
  }
  .cal-datetime-btn:hover{background:var(--neutral-bg);}

<script>
/* ---------- IndexedDB: remember the picked file handle + rolling backups ---------- */
const IDB_NAME = 'danisan-takip-db';
const IDB_STORE = 'handles';
const IDB_BACKUP_STORE = 'backups';
const MAX_BACKUPS = 30;

function idbOpen(){
  return new Promise((resolve,reject)=>{
    const req = indexedDB.open(IDB_NAME, 2);
    req.onupgradeneeded = ()=>{
      const db = req.result;
      if(!db.objectStoreNames.contains(IDB_STORE)){ db.createObjectStore(IDB_STORE); }
      if(!db.objectStoreNames.contains(IDB_BACKUP_STORE)){
        db.createObjectStore(IDB_BACKUP_STORE, { keyPath:'timestamp' });
      }
    };
    req.onsuccess = ()=>resolve(req.result);
    req.onerror = ()=>reject(req.error);
  });
}
async function idbGet(key){
  const db = await idbOpen();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction(IDB_STORE,'readonly');
    const req = tx.objectStore(IDB_STORE).get(key);
    req.onsuccess = ()=>resolve(req.result || null);
    req.onerror = ()=>reject(req.error);
  });
}
async function idbSet(key,val){
  const db = await idbOpen();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction(IDB_STORE,'readwrite');
    tx.objectStore(IDB_STORE).put(val,key);
    tx.oncomplete = ()=>resolve();
    tx.onerror = ()=>reject(tx.error);
  });
}

async function saveBackupSnapshot(stateObj){
  try{
    const db = await idbOpen();
    const snapshot = { timestamp: Date.now(), data: JSON.stringify(stateObj) };
    await new Promise((resolve,reject)=>{
      const tx = db.transaction(IDB_BACKUP_STORE,'readwrite');
      tx.objectStore(IDB_BACKUP_STORE).put(snapshot);
      tx.oncomplete = resolve;
      tx.onerror = ()=>reject(tx.error);
    });
    await pruneBackups(db);
  }catch(e){ console.error('Yedek kaydedilemedi', e); }
}

async function pruneBackups(db){
  return new Promise((resolve)=>{
    const tx = db.transaction(IDB_BACKUP_STORE,'readwrite');
    const store = tx.objectStore(IDB_BACKUP_STORE);
    const req = store.getAllKeys();
    req.onsuccess = ()=>{
      const keys = req.result.sort((a,b)=>a-b);
      const excess = keys.length - MAX_BACKUPS;
      if(excess > 0){
        for(let i=0;i<excess;i++){ store.delete(keys[i]); }
      }
      resolve();
    };
  });
}

async function listBackups(){
  const db = await idbOpen();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction(IDB_BACKUP_STORE,'readonly');
    const req = tx.objectStore(IDB_BACKUP_STORE).getAll();
    req.onsuccess = ()=>resolve((req.result||[]).sort((a,b)=>b.timestamp-a.timestamp));
    req.onerror = ()=>reject(req.error);
  });
}

/* ---------- Auth + live data sync (Firebase) ---------- */
let currentUser = null;
let unsubscribeSnapshot = null;
let hasLoadedOnce = false;
let state = null;
let activeClientId = null;
let openProfileOnNextRender = false;
let editingClientId = null;
let sortMode = 'lastSession';

  return (state && state.calendarPrefs) ? state.calendarPrefs : { weekStartsMonday: true, use24HourTime: false };
}

  }catch(e){ /* sessionStorage unavailable, ignore */ }

let homeMobileTab = 'tasks';

function init(){
  window.addEventListener('fb-ready', startAuthListener);
  if(window.FB) startAuthListener();
}

const GIS_CLIENT_ID = '171012588947-kglaeca49vu35660rcd2lm66mhtnt3t3.apps.googleusercontent.com';
const GOOGLE_API_SCOPES = 'https://www.googleapis.com/auth/calendar.events https://www.googleapis.com/auth/gmail.compose https://www.googleapis.com/auth/contacts https://www.googleapis.com/auth/drive.file';
let gisTokenClient = null;

function initGisTokenClient(){
  if(!window.google || !window.google.accounts || !window.google.accounts.oauth2){
    setTimeout(initGisTokenClient, 300);
    return;
  }
  gisTokenClient = window.google.accounts.oauth2.initTokenClient({
    client_id: GIS_CLIENT_ID,
    scope: GOOGLE_API_SCOPES,
    callback: ()=>{}, // overridden per-call in trySilentGisRefresh
    // Popup blocked / closed: without this the pending request waited forever.
    error_callback: (err)=>{
      lastGisError = err && err.type ? err.type : 'unknown';
      const h = gisErrorHandler;
      gisErrorHandler = null;
      if(h) h(err);
    }
  });
}
let gisErrorHandler = null;
let lastGisError = null;
initGisTokenClient();

function storeGoogleAccessToken(token){
  googleAccessToken = token;
  googleAccessTokenObtainedAt = Date.now();
  try{
    sessionStorage.setItem('googleAccessToken', googleAccessToken);
    sessionStorage.setItem('googleAccessTokenObtainedAt', String(googleAccessTokenObtainedAt));
  }catch(e){ /* sessionStorage unavailable, ignore */ }
}

function captureAccessTokenFromResult(result){
  try{
    const cred = window.FB.credentialFromResult(result);
    if(cred && cred.accessToken){
      storeGoogleAccessToken(cred.accessToken);
    }
  }catch(e){ console.error('Token yakalama hatası', e); }
}

function trySilentGisRefresh(){
  return new Promise((resolve)=>{
    if(!gisTokenClient){ resolve(null); return; }
    lastGisError = null;
    const timeout = setTimeout(()=>resolve(null), 4000);
    gisErrorHandler = ()=>{ clearTimeout(timeout); resolve(null); };
    gisTokenClient.callback = (tokenResponse)=>{
      clearTimeout(timeout);
      gisErrorHandler = null;
      if(tokenResponse && tokenResponse.access_token){
        storeGoogleAccessToken(tokenResponse.access_token);
        resolve(googleAccessToken);
      }else{
        resolve(null);
      }
    };
    try{
      const hint = currentUser && currentUser.email ? currentUser.email : undefined;
      gisTokenClient.requestAccessToken({ prompt: '', login_hint: hint });
    }catch(e){ resolve(null); }
  });
}

let showingDenied = false;
let googleAccessToken = null;
let googleAccessTokenObtainedAt = 0;

// Restore a still-fresh token from this tab's session storage, if any (survives page reloads).
try{
  const storedToken = sessionStorage.getItem('googleAccessToken');
  const storedAt = Number(sessionStorage.getItem('googleAccessTokenObtainedAt') || 0);
  if(storedToken && storedAt && (Date.now() - storedAt < 50*60*1000)){
    googleAccessToken = storedToken;
    googleAccessTokenObtainedAt = storedAt;
  }
}catch(e){ /* sessionStorage unavailable, ignore */ }

async function ensureGoogleAccessToken(){
  if(googleAccessToken && (Date.now() - googleAccessTokenObtainedAt < 50*60*1000)){
    return googleAccessToken;
  }
  const silent = await trySilentGisRefresh();
  if(silent) return silent;
  const interactive = await tryInteractiveGisRequest();
  if(interactive) return interactive;
  if(lastGisError === 'popup_failed_to_open'){
    // The browser blocked the popup (the original tap "expired" behind a modal). Ask for one fresh tap.
    const viaTap = await askGoogleReconnectTap();
    if(viaTap) return viaTap;
    return null;
  }
  if(lastGisError === 'popup_closed') return null; // user closed the Google window themselves
  alert('Google izinleri alınamadı.');
  return null;
}

function askGoogleReconnectTap(){
  return new Promise((resolve)=>{
    const modal = document.createElement('div');
    modal.className = 'backups-modal';
    modal.style.display = 'flex';
    modal.innerHTML = `
      <div class="backups-box" style="max-width:340px;">
        <div class="backups-box-header"><h2>Google bağlantısı yenilenmeli</h2></div>
        <div style="padding:0 20px 20px; display:flex; flex-direction:column; gap:8px;">
          <p style="margin:0 0 4px; font-size:13px; color:var(--muted);">Tarayıcı Google izin penceresini engelledi. Devam etmek için dokun.</p>
          <button class="settings-btn" id="gisReconnectBtn" style="width:100%;">Google'a Bağlan</button>
          <button class="reschedule-cancel-btn" id="gisReconnectCancelBtn" style="width:100%;">Vazgeç</button>
        </div>
      </div>`;
    document.body.appendChild(modal);
    document.getElementById('gisReconnectBtn').addEventListener('click', ()=>{
      modal.remove();
      tryInteractiveGisRequest().then(resolve); // runs inside this tap, so the popup is allowed
    });
    document.getElementById('gisReconnectCancelBtn').addEventListener('click', ()=>{ modal.remove(); resolve(null); });
  });
}

async function getTokenSilentOnly(){
  if(googleAccessToken && (Date.now() - googleAccessTokenObtainedAt < 50*60*1000)){
    return googleAccessToken;
  }
  return await trySilentGisRefresh();
}

function tryInteractiveGisRequest(){
  return new Promise((resolve)=>{
    if(!gisTokenClient){ resolve(null); return; }
    lastGisError = null;
    const timeout = setTimeout(()=>{ gisErrorHandler = null; resolve(null); }, 3*60*1000); // safety net
    gisErrorHandler = ()=>{ clearTimeout(timeout); resolve(null); };
    gisTokenClient.callback = (tokenResponse)=>{
      clearTimeout(timeout);
      gisErrorHandler = null;
      if(tokenResponse && tokenResponse.access_token){
        storeGoogleAccessToken(tokenResponse.access_token);
        resolve(googleAccessToken);
      }else{
        resolve(null);
      }
    };
    try{
      const hint = currentUser && currentUser.email ? currentUser.email : undefined;
      gisTokenClient.requestAccessToken({ login_hint: hint });
    }catch(e){ resolve(null); }
  });
}

// Each real person may sign in with either of their email addresses;
// both map to the same canonical data bucket so their data stays unified.
const PERSON_EMAILS = {
  kubilay: ['malik@ikitherapy.ca'],
  duygu: ['duygu@ikitherapy.ca']
};

function canonicalPersonId(email){
  if(!email) return null;
  const lower = email.trim().toLowerCase();
  for(const personId in PERSON_EMAILS){
    if(PERSON_EMAILS[personId].some(e => e.toLowerCase() === lower)) return personId;
  }
  return null;
}

function otherPersonEmail(){
  if(!currentUser || !currentUser.email) return null;
  const personId = canonicalPersonId(currentUser.email);
  if(!personId) return null;
  const emails = PERSON_EMAILS[personId] || [];
  const other = emails.find(e => e.toLowerCase() !== currentUser.email.toLowerCase());
  return other || null;
}

function subscribeToData(){
  const personId = canonicalPersonId(currentUser.email);
  const ref = window.FB.doc(window.FB.db, 'users', personId, 'appdata', 'main');
  unsubscribeSnapshot = window.FB.onSnapshot(ref, async (snap)=>{
    if(!snap.exists() && snap.metadata.fromCache){
      // Offline / not yet confirmed by the server: an empty cache result is NOT "no data".
      // Wait for the server snapshot instead of falling back to empty example data
      // (which would later overwrite the real document on the first save).
      if(!hasLoadedOnce){
        setupBoxContent.innerHTML = '<h2>Bağlantı bekleniyor…</h2><p>Sunucuya ulaşılamadı. İnternet bağlantısı gelince veriler otomatik yüklenecek.</p>';
      }
      return;
    }
    if(snap.exists()){
      state = snap.data();
    }else{
      // No data yet under the new merged (per-person) path — check for legacy data
      // under this specific account's old per-UID path and migrate it automatically.
      let migrated = false;
      try{
        const legacyRef = window.FB.doc(window.FB.db, 'users', currentUser.uid, 'appdata', 'main');
        const legacySnap = await window.FB.getDoc(legacyRef);
        if(legacySnap.exists()){
          state = legacySnap.data();
          migrated = true;
        }
      }catch(e){ console.error('Eski veri kontrolü başarısız', e); }
      if(!migrated){ state = exampleData(); }
      if(!state.clients) state.clients = [];
      if(!state.generalTodos) state.generalTodos = [];
      if(!state.prospects) state.prospects = [];
      if(!state.ifhpInvoiceNumbers) state.ifhpInvoiceNumbers = [];
      if(migrated){
        try{ await window.FB.setDoc(ref, JSON.parse(JSON.stringify(state))); }catch(e){ console.error('Taşıma kaydı başarısız', e); }
      }
    }
    if(!state.clients) state.clients = [];
    if(!state.generalTodos) state.generalTodos = [];
    if(!state.prospects) state.prospects = [];
    if(!state.ifhpInvoiceNumbers) state.ifhpInvoiceNumbers = [];
    state.clients.forEach(c=>{ if(!Array.isArray(c.sessions)) c.sessions = []; });

    if(!hasLoadedOnce){
      hasLoadedOnce = true;
      finishSetup();
    }else{
      render();
    }
  }, (err)=>{
    console.error('Senkron hatası', err);
    setupBoxContent.innerHTML = `<h2>Bağlantı hatası</h2><p>${escapeHtml(err.message)}</p>`;
    document.getElementById('appShell').classList.remove('visible');
    document.getElementById('fileSetup').style.display = 'flex';
  });
}

let lastBackupTime = 0;

let backupTrailingTimer = null;
function maybeSnapshotBackup(){
  const now = Date.now();
  const elapsed = now - lastBackupTime;
  if(elapsed > BACKUP_INTERVAL_MS){
    lastBackupTime = now;
    if(backupTrailingTimer){ clearTimeout(backupTrailingTimer); backupTrailingTimer = null; }
    saveBackupSnapshot(state);
  }else if(!backupTrailingTimer){
    // Throttled: schedule one trailing snapshot so edits made inside the window are also backed up.
    backupTrailingTimer = setTimeout(()=>{
      backupTrailingTimer = null;
      if(!currentUser || !state) return;
      lastBackupTime = Date.now();
      saveBackupSnapshot(state);
    }, BACKUP_INTERVAL_MS - elapsed + 1000);
  }
}

async function findOrCreateDriveBackupFileId(token){
  if(driveBackupFileId) return driveBackupFileId;
  try{
    const q = `name='${GOOGLE_DRIVE_BACKUP_FILENAME}' and trashed=false`;
    const listRes = await fetch(`https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(q)}&spaces=drive&fields=files(id,name)`, {
      headers: { 'Authorization': `Bearer ${token}` }
    });
    if(listRes.ok){
      const data = await listRes.json();
      if(data.files && data.files.length){
        driveBackupFileId = data.files[0].id;
      }
    }
  }catch(e){ console.error('Drive dosyası aranamadı', e); }
  return driveBackupFileId;
}

async function uploadPdfToDriveFolder(doc, filename, folderIdOverride){
  const targetFolderId = folderIdOverride || state.driveInvoiceFolderId;

    alert('Önce Ayarlar > Fatura Kayıt Klasörü bölümünden bir klasör seçmelisin.');

  const pdfBlob = doc.output('blob');
  const metadata = { name: filename, mimeType: 'application/pdf', parents: [targetFolderId] };
  const boundary = 'danisantakipinvoiceboundary';
  const pdfBase64 = btoa(arrayBufferToBinaryString(await pdfBlob.arrayBuffer()));
  const body =
    `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n` +
    `--${boundary}\r\nContent-Type: application/pdf\r\nContent-Transfer-Encoding: base64\r\n\r\n${pdfBase64}\r\n` +
    `--${boundary}--`;

  try{
    const res = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': `multipart/related; boundary=${boundary}` },
      body
    });
    if(!res.ok){
      console.error('Drive\'a fatura yüklenemedi', await res.text());
      alert('Drive\'a kaydedilemedi, tekrar dener misin?');

  }catch(e){

    alert('Drive\'a kaydedilemedi, tekrar dener misin?');
    return false;
  }

let driveBackupConsecutiveFailures = 0;

let driveTrailingTimer = null;
async function maybeDriveBackup(){
  const now = Date.now();
  const elapsed = now - lastDriveBackupAt;
  if(elapsed < DRIVE_BACKUP_MIN_INTERVAL_MS){
    if(!driveTrailingTimer){
      driveTrailingTimer = setTimeout(()=>{
        driveTrailingTimer = null;
        if(currentUser && state) maybeDriveBackup();
      }, DRIVE_BACKUP_MIN_INTERVAL_MS - elapsed + 1000);
    }
    return;
  }
  if(driveTrailingTimer){ clearTimeout(driveTrailingTimer); driveTrailingTimer = null; }
  lastDriveBackupAt = now;
  driveBackupStatus = 'saving';
  const ok = await uploadDriveBackup(false); // silent only — never interrupts with a popup
  driveBackupStatus = ok ? 'success' : 'error';
  if(ok){
    driveBackupConsecutiveFailures = 0;
  }else{
    driveBackupConsecutiveFailures++;
    if(driveBackupConsecutiveFailures === 3){
      const me = currentPersonId();
      if(me) pushInAppNotification(me, '⚠️ Google Drive yedeklemesi arka arkaya birkaç kez başarısız oldu — Ayarlar > Google Drive Yedeği bölümünden elle dene.', 'driveBackupFail');
    }
  }
}

let lastSaveErrorToastAt = 0;
let docSizeWarned = false;
const FIRESTORE_DOC_LIMIT_BYTES = 1048576;

async function saveState(){
  if(!currentUser || !state || !hasLoadedOnce) return; // never write before real data has loaded
  maybeSnapshotBackup();
  maybeDriveBackup();
  try{
    const personId = canonicalPersonId(currentUser.email);
    const ref = window.FB.doc(window.FB.db, 'users', personId, 'appdata', 'main');
    const json = JSON.stringify(state);
    const approxBytes = new Blob([json]).size;
    if(approxBytes > FIRESTORE_DOC_LIMIT_BYTES * 0.8 && !docSizeWarned){
      docSizeWarned = true;
      showToast(`⚠️ Veri boyutu Firestore sınırına yaklaşıyor (%${Math.round(approxBytes/FIRESTORE_DOC_LIMIT_BYTES*100)}). Kaydetme yakında başarısız olabilir.`);
    }
    await window.FB.setDoc(ref, JSON.parse(json));
  }catch(e){
    console.error('Kaydetme hatası', e);
    const now = Date.now();
    if(now - lastSaveErrorToastAt > 30000){
      lastSaveErrorToastAt = now;
      showToast('⚠️ Değişiklik sunucuya kaydedilemedi: ' + (e && e.message ? e.message : 'bilinmeyen hata'));
    }
  }
}

      snap = await window.FB.getDocs(q);

      // Composite index (auditLog: clientId ASC, at DESC) not created yet — fall back to unordered fetch.

      const q = window.FB.query(ref, window.FB.where('clientId', '==', client.id), window.FB.limit(200));

async function handleImportJsonFile(ev){
  const file = ev.target.files[0];
  ev.target.value = '';
  if(!file) return;
  let imported;
  try{
    const text = await file.text();
    imported = JSON.parse(text);
  }catch(e){
    alert('Dosya okunamadı. Geçerli bir JSON dosyası seçtiğinden emin ol.');
    return;
  }
  const importedClients = Array.isArray(imported.clients) ? imported.clients : [];
  const importedTodos = Array.isArray(imported.generalTodos) ? imported.generalTodos : [];
  if(!importedClients.length && !importedTodos.length){
    alert('Bu dosyada içe aktarılacak danışan bulunamadı.');
    return;
  }
  if(!confirm(`${importedClients.length} danışan bu hesaba eklenecek. Mevcut verilerin üzerine yazılmaz, üstüne eklenir. Devam edilsin mi?`)) return;

  const existingClientIds = new Set(state.clients.map(c=>c.id));
  const existingTodoIds = new Set((state.generalTodos||[]).map(t=>t.id));
  const newClients = [];
  let skippedClients = 0;
  importedClients.forEach(c=>{
    if(c.id && existingClientIds.has(c.id)){ skippedClients++; return; } // already in this account (e.g. same backup imported twice)
    if(!c.id) c.id = uid();
    existingClientIds.add(c.id);
    if(!Array.isArray(c.sessions)) c.sessions = [];
    if(!c.todos) c.todos = [];
    if(c.generalAdminNote == null) c.generalAdminNote = '';
    if(!c.profile) c.profile = { info:'', address:'', phone:'', email:'', ifhp:false, rate:null, terminated:false };
    c.sessions.forEach(s=>{ if(!s.id) s.id = uid(); });
    newClients.push(c);
  });
  const newTodos = importedTodos.filter(t=>{
    if(t.id && existingTodoIds.has(t.id)) return false;
    if(!t.id) t.id = uid();
    existingTodoIds.add(t.id);
    return true;
  });
  if(!newClients.length && !newTodos.length){
    alert('Bu dosyadaki danışanların hepsi zaten bu hesapta var — hiçbir şey eklenmedi.');
    return;
  }

  state.clients = [...state.clients, ...newClients];
  state.generalTodos = [...(state.generalTodos||[]), ...newTodos];
  if(!activeClientId && state.clients.length){ activeClientId = state.clients[0].id; }
  saveState();
  logAudit('JSON içe aktarıldı', `${newClients.length} danışan eklendi`);
  render();
  alert(`${newClients.length} danışan içe aktarıldı.` + (skippedClients ? ` ${skippedClients} danışan zaten mevcut olduğu için atlandı.` : ''));
}

function formatBackupTime(ts){
  const d = new Date(ts);
  const pad = n => String(n).padStart(2,'0');
  let hour = d.getHours();
  const minute = pad(d.getMinutes());
  const meridiem = hour >= 12 ? 'PM' : 'AM';
  hour = hour % 12;
  if(hour === 0) hour = 12;
  return `${pad(d.getDate())}.${pad(d.getMonth()+1)}.${d.getFullYear()} ${hour}:${minute} ${meridiem}`;
}

      }catch(e){

  });
}

function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36); }

function isSessionDue(session){
  if(session.calendarEndTime){
    return Date.now() >= new Date(session.calendarEndTime).getTime();
  }
  if(!session.date) return true;
  return session.date <= todayIso();
}

function clientStatus(client){
  if(!client.sessions || !client.sessions.length) return 'neutral';
  const noInvoice = !!(client.profile && client.profile.noInvoice);
  const pastSessions = client.sessions.filter(s => isSessionDue(s));
  if(!pastSessions.length) return 'neutral';
  for(const s of pastSessions){
    const disabled = s.disabledChecks || [];
    const paymentOk = disabled.includes('paymentDone') || s.paymentDone;
    const invoiceOk = noInvoice || disabled.includes('invoiceDone') ? true : s.invoiceDone;
    const notesOk = disabled.includes('notesDone') || s.notesDone;
    const nextOk = disabled.includes('nextDone') || s.nextDone;
    if(!(paymentOk && invoiceOk && notesOk && nextOk)){
      return 'red';
    }
  }
  return 'green';
}

async function syncProspectToGoogleContacts(prospect){
  const email = prospect.email ? prospect.email.trim() : '';
  const phone = prospect.phone ? prospect.phone.trim() : '';
  if(!email && !phone) return;

  const token = await ensureGoogleAccessToken();
  if(!token) return;

  const body = { names: [{ givenName: prospect.name || '' }] };
  if(email) body.emailAddresses = [{ value: email }];
  if(phone) body.phoneNumbers = [{ value: phone }];

  try{
    if(prospect.googleContactResourceName){
      const getRes = await fetch(`https://people.googleapis.com/v1/${prospect.googleContactResourceName}?personFields=names,emailAddresses,phoneNumbers`, {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      if(!getRes.ok){
        console.error('Google Kişi bulunamadı, güncellenemedi', await getRes.text());
        return;
      }
      const existing = await getRes.json();
      body.etag = existing.etag;
      const updateRes = await fetch(`https://people.googleapis.com/v1/${prospect.googleContactResourceName}:updateContact?updatePersonFields=names,emailAddresses,phoneNumbers`, {
        method: 'PATCH',
        headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      if(!updateRes.ok){
        console.error('Google Kişi güncellenemedi', await updateRes.text());
      }
    }else{
      const foundResourceName = await findExistingGoogleContact(token, email);
      if(foundResourceName){
        prospect.googleContactResourceName = foundResourceName;
        saveState();
        return;
      }
      const res = await fetch('https://people.googleapis.com/v1/people:createContact', {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      if(res.ok){
        const data = await res.json();
        prospect.googleContactResourceName = data.resourceName;
        saveState();
      }else{
        console.error('Google Kişiler\'e eklenemedi', await res.text());
      }
    }
  }catch(e){
    console.error('Google Kişiler senkron hatası', e);
  }
}

const UNPAID_NOTIFY_THRESHOLD = 3;
function checkUnpaidThreshold(client){
  let unpaidCount = 0;
  (client.sessions||[]).forEach(s=>{
    if(isSessionDue(s) && !s.paymentDone && !(s.disabledChecks||[]).includes('paymentDone')) unpaidCount++;
  });
  if(unpaidCount >= UNPAID_NOTIFY_THRESHOLD && !client.unpaidThresholdNotified){
    client.unpaidThresholdNotified = true;
    saveState();
    const me = currentPersonId();
    if(me) pushInAppNotification(me, `${client.name} adlı danışanın ${unpaidCount} ödenmemiş seansı var.`, 'unpaidThreshold');
  }else if(unpaidCount < UNPAID_NOTIFY_THRESHOLD && client.unpaidThresholdNotified){
    client.unpaidThresholdNotified = false;
    saveState();
  }
}

function checkDailyReminders(){
  const today = todayIso();
  let lastCheck = null;
  try{ lastCheck = localStorage.getItem('lastDailyReminderCheck'); }catch(e){}
  if(lastCheck === today || (state && state.lastDailyReminderCheck === today)) return;
  try{ localStorage.setItem('lastDailyReminderCheck', today); }catch(e){}

  const me = currentPersonId();
  if(!me) return;
  state.lastDailyReminderCheck = today; // synced via Firestore, so the other device skips today too

  // Doğum günü bugünse
  computeUpcomingBirthdays().filter(b=>b.diffDays===0).forEach(b=>{
    pushInAppNotification(me, `🎂 Bugün ${b.name} adlı danışanın doğum günü!`, 'birthday');
  });

  // 7+ gündür dokunulmamış danışan adayları
  const STALE_DAYS = 7;
  (state.prospects||[]).forEach(p=>{
    const ageDays = (Date.now() - (p.createdAt||0)) / (24*60*60*1000);
    if(ageDays >= STALE_DAYS && !p.staleNotified){
      p.staleNotified = true;
      pushInAppNotification(me, `${p.name || '(isimsiz aday)'} adlı danışan adayı ${Math.floor(ageDays)} gündür bekliyor — kontrol etmeyi unutma.`, 'staleProspect');
    }
  });
  saveState();
}

function pendingChecklistCount(client){
  const noInvoice = !!(client.profile && client.profile.noInvoice);
  let count = 0;
  (client.sessions||[]).forEach(s=>{
    if(!isSessionDue(s)) return; // not due yet (session hasn't ended), don't count as pending
    const disabled = s.disabledChecks || [];
    if(!disabled.includes('paymentDone') && !s.paymentDone) count++;
    if(!noInvoice && !disabled.includes('invoiceDone') && !s.invoiceDone) count++;
    if(!disabled.includes('notesDone') && !s.notesDone) count++;
    if(!disabled.includes('nextDone') && !s.nextDone) count++;
  });
  return count;
}

function pendingTodoCount(client){
  return (client.todos||[]).filter(t=>!t.done).length;
}

function lastSessionDate(client){
  let max = null;
  client.sessions.forEach(s=>{
    if(!isSessionDue(s)) return; // ignore sessions that haven't happened yet
    if(s.date && (!max || s.date > max)) max = s.date;
  });
  return max;
}

function getSortedClients(){
  let arr = [...state.clients];
  if(sortMode === 'name'){
    arr.sort((a,b)=>a.name.localeCompare(b.name,'tr'));
  } else if(sortMode === 'lastSession'){
    arr.sort((a,b)=>{
      const da = lastSessionDate(a);
      const db = lastSessionDate(b);
      if(da === null && db === null) return 0;
      if(da === null) return 1;
      if(db === null) return -1;
      return db.localeCompare(da);
    });
  } else if(sortMode === 'pendingChecks'){
    arr.sort((a,b)=> pendingChecklistCount(b) - pendingChecklistCount(a));
  } else if(sortMode === 'pendingTodos'){
    arr.sort((a,b)=> pendingTodoCount(b) - pendingTodoCount(a));
  } else {
    arr.reverse(); // default: most recently added first
  }
  if(searchQuery.trim()){
    const q = normalizeForSearch(searchQuery.trim());
    arr = arr.filter(c=>{
      const sp = c.profile && c.profile.secondPerson;
      const spName = sp && sp.name ? sp.name : '';
      return normalizeForSearch(c.name).includes(q) || (spName && normalizeForSearch(spName).includes(q));
    });
  }
  return arr;
}

/* ---------- Google Calendar + Gmail (real attachment) integration ---------- */
async function fetchDayEvents(dateStr){
  const token = await ensureGoogleAccessToken();
  if(!token) return null;
  const start = new Date(`${dateStr}T00:00:00`);
  const end = new Date(`${dateStr}T23:59:59`);
  const calendarIds = ['primary'];
  const other = otherPersonEmail();
  if(other) calendarIds.push(other);
  try{
    const results = await Promise.all(calendarIds.map(async (calId)=>{
      const url = `https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(calId)}/events?timeMin=${encodeURIComponent(start.toISOString())}&timeMax=${encodeURIComponent(end.toISOString())}&singleEvents=true&orderBy=startTime`;
      const res = await fetch(url, { headers: { 'Authorization': `Bearer ${token}` } });
      if(!res.ok) return [];
      const data = await res.json();
      return (data.items || []).map(ev => ({ ...ev, _calendarId: calId }));
    }));
    return results.flat().sort((a,b)=>{
      const sa = (a.start && (a.start.dateTime || a.start.date)) || '';
      const sb = (b.start && (b.start.dateTime || b.start.date)) || '';
      return sa.localeCompare(sb);
    });
  }catch(e){
    return null;
  }
}

function formatEventTime(iso){
  if(!iso) return '';
  const d = new Date(iso);
  const hour24 = d.getHours();
  const minute = String(d.getMinutes()).padStart(2,'0');
  if(getCalendarPrefs().use24HourTime){
    return `${String(hour24).padStart(2,'0')}:${minute}`;
  }
  let hour = hour24;
  const meridiem = hour >= 12 ? 'PM' : 'AM';
  hour = hour % 12;
  if(hour === 0) hour = 12;
  return `${hour}:${minute} ${meridiem}`;
}

function parseAmPmTime(input){
  if(!input) return null;
  const trimmed = input.trim();
  // 24-hour format: "H:MM" or "HH:MM", no AM/PM
  const plain = trimmed.match(/^(\d{1,2}):(\d{2})$/);
  if(plain){
    const hour = parseInt(plain[1], 10);
    const minute = plain[2];
    if(hour < 0 || hour > 23 || Number(minute) > 59) return null;
    return `${String(hour).padStart(2,'0')}:${minute}`;
  }
  const match = trimmed.match(/^(\d{1,2}):(\d{2})\s*(AM|PM|am|pm)$/);
  if(!match) return null;
  let hour = parseInt(match[1], 10);
  const minute = match[2];
  const meridiem = match[3].toUpperCase();
  if(hour < 1 || hour > 12 || Number(minute) > 59) return null;
  if(meridiem === 'AM'){
    if(hour === 12) hour = 0;
  }else{
    if(hour !== 12) hour += 12;
  }
  return `${String(hour).padStart(2,'0')}:${minute}`;
}

function promptForTime(defaultText){
  let attempt = prompt('Yeni saat (örn: 2:30 PM):', defaultText || '10:00 AM');
  if(!attempt) return null;
  let parsed = parseAmPmTime(attempt);
  while(attempt && !parsed){
    attempt = prompt('Geçersiz format. Örnek: 2:30 PM ya da 10:00 AM şeklinde gir:', attempt);
    if(!attempt) return null;
    parsed = parseAmPmTime(attempt);
  }
  return parsed;
}

function pad2(n){ return String(n).padStart(2,'0'); }

// Builds the <option> list for a 15-minute-interval time dropdown (12h AM/PM or 24h, per preference).
function timeSelectOptionsHtml(selectedLabel){
  const use24 = getCalendarPrefs().use24HourTime;
  const opts = [];
  for(let h = 0; h < 24; h++){
    for(let m = 0; m < 60; m += 15){
      let label;
      if(use24){
        label = `${pad2(h)}:${pad2(m)}`;
      }else{
        let hour12 = h % 12;
        if(hour12 === 0) hour12 = 12;
        const meridiem = h >= 12 ? 'PM' : 'AM';
        label = `${hour12}:${pad2(m)} ${meridiem}`;
      }
      opts.push(`<option value="${label}" ${label===selectedLabel?'selected':''}>${label}</option>`);
    }
  }
  return opts.join('');
}

// Rounds a time label to the nearest 15-minute mark so it lines up with the dropdown.
function nearestQuarterHourLabel(label){
  const parsed = parseAmPmTime(label);
  if(!parsed) return getCalendarPrefs().use24HourTime ? '10:00' : '10:00 AM';
  let [h, m] = parsed.split(':').map(Number);
  m = Math.round(m / 15) * 15;
  if(m === 60){ m = 0; h = (h + 1) % 24; }
  if(getCalendarPrefs().use24HourTime){
    return `${pad2(h)}:${pad2(m)}`;
  }
  let hour12 = h % 12;
  if(hour12 === 0) hour12 = 12;
  const meridiem = h >= 12 ? 'PM' : 'AM';
  return `${hour12}:${pad2(m)} ${meridiem}`;
}

// Renders a single month grid for the mini date picker, respecting the week-start preference.
function miniCalendarMonthHtml(year, month, selectedIso){
  const monthNames = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
  const mondayFirst = getCalendarPrefs().weekStartsMonday;
  const dayNames = mondayFirst ? ['Pt','Sa','Ça','Pe','Cu','Ct','Pz'] : ['Pz','Pt','Sa','Ça','Pe','Cu','Ct'];
  const firstOfMonth = new Date(year, month, 1);
  let startOffset;
  if(mondayFirst){
    startOffset = firstOfMonth.getDay() - 1;
    if(startOffset < 0) startOffset = 6;
  }else{
    startOffset = firstOfMonth.getDay();
  }
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const todayStr = todayIso();
  let cells = '';
  for(let i=0; i<startOffset; i++){ cells += `<div class="mini-cal-cell empty"></div>`; }
  for(let d=1; d<=daysInMonth; d++){
    const iso = `${year}-${pad2(month+1)}-${pad2(d)}`;
    const cls = ['mini-cal-cell'];
    if(iso === selectedIso) cls.push('selected');
    if(iso === todayStr) cls.push('today');
    cells += `<button type="button" class="${cls.join(' ')}" data-date="${iso}">${d}</button>`;
  }
  return `
    <div class="mini-cal-header">
      <button type="button" class="mini-cal-nav" data-nav="-1" title="Önceki ay">‹</button>
      <span class="mini-cal-title">${monthNames[month]} ${year}</span>
      <button type="button" class="mini-cal-nav" data-nav="1" title="Sonraki ay">›</button>
    </div>
    <div class="mini-cal-weekdays">${dayNames.map(d=>`<span>${d}</span>`).join('')}</div>
    <div class="mini-cal-grid">${cells}</div>
  `;
}

// Opens a small popover with a mini month calendar (date) + 15-minute dropdown (time)
// to replace the old prompt()-based reschedule flow.
// `conflictCheck` ({ durationMinutes, skipEventId }) warns about clashes with the main and extra calendars on Kaydet.
function openReschedulePopover({ initialDate, initialTimeLabel, onConfirm, title, conflictCheck }){
  const overlay = document.createElement('div');
  overlay.className = 'reschedule-overlay';

  let selectedIso = initialDate || todayIso();
  let viewDate = new Date(`${selectedIso}T00:00:00`);
  if(isNaN(viewDate)) viewDate = new Date();
  const initialTime = nearestQuarterHourLabel(initialTimeLabel || '10:00 AM');

  function renderPopover(){
    overlay.innerHTML = `
      <div class="reschedule-popover">
        <h3>${title || 'Randevuyu Yeniden Planla'}</h3>
        <div class="mini-cal">${miniCalendarMonthHtml(viewDate.getFullYear(), viewDate.getMonth(), selectedIso)}</div>
        <div class="field-block" style="margin-top:12px;">
          <label>Saat</label>
          <select class="reschedule-time-select">${timeSelectOptionsHtml(initialTime)}</select>
        </div>
        <div class="form-actions">
          <button type="button" class="reschedule-cancel-btn">Vazgeç</button>
          <button type="button" class="reschedule-confirm-btn">Kaydet</button>
        </div>
      </div>`;
    wirePopover();
  }

  function wirePopover(){
    overlay.querySelectorAll('.mini-cal-nav').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const dir = parseInt(btn.getAttribute('data-nav'), 10);
        viewDate = new Date(viewDate.getFullYear(), viewDate.getMonth()+dir, 1);
        renderPopover();
      });
    });
    overlay.querySelectorAll('.mini-cal-cell[data-date]').forEach(cell=>{
      cell.addEventListener('click', ()=>{
        selectedIso = cell.getAttribute('data-date');
        renderPopover();
      });
    });
    overlay.querySelector('.reschedule-cancel-btn').addEventListener('click', ()=>{
      overlay.remove();
    });
    overlay.querySelector('.reschedule-confirm-btn').addEventListener('click', async (ev)=>{
      const timeLabel = overlay.querySelector('.reschedule-time-select').value;
      if(conflictCheck){
        const btn = ev.currentTarget;
        btn.disabled = true; btn.textContent = 'Kontrol ediliyor…';
        const ok = await confirmNoConflict(selectedIso, parseAmPmTime(timeLabel), conflictCheck.durationMinutes || 50, conflictCheck.skipEventId);
        btn.disabled = false; btn.textContent = 'Kaydet';
        if(!ok) return; // stay open so another time can be picked
      }
      overlay.remove();
      onConfirm(selectedIso, timeLabel);
    });
  }

  overlay.addEventListener('click', (ev)=>{
    if(ev.target === overlay) overlay.remove();
  });

  renderPopover();
  document.body.appendChild(overlay);
}

async function rescheduleCalendarEvent(eventId, dateStr, timeStr, calendarId){
  const token = await ensureGoogleAccessToken();
  if(!token) return false;
  const calId = calendarId || 'primary';
  try{
    const getRes = await fetch(`https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(calId)}/events/${eventId}`, {
      headers: { 'Authorization': `Bearer ${token}` }
    });
    if(!getRes.ok) return false;
    const existing = await getRes.json();
    const oldStart = new Date(existing.start.dateTime || existing.start.date);
    const oldEnd = new Date(existing.end.dateTime || existing.end.date);
    const durationMs = oldEnd - oldStart;
    const newStart = new Date(`${dateStr}T${timeStr}:00`);
    const newEnd = new Date(newStart.getTime() + durationMs);
    const res = await fetch(`https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(calId)}/events/${eventId}?sendUpdates=all`, {
      method: 'PATCH',
      headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({
        start: { dateTime: newStart.toISOString() },
        end: { dateTime: newEnd.toISOString() }
      })
    });
    const ok = res.ok;
    if(ok) calendarViewCache = {};
    return ok;
  }catch(e){
    return false;
  }
}

async function findExistingGoogleContact(token, email){
  if(!email) return null;
  try{
    const url = `https://people.googleapis.com/v1/people:searchContacts?query=${encodeURIComponent(email)}&readMask=names,emailAddresses,phoneNumbers`;
    const res = await fetch(url, { headers: { 'Authorization': `Bearer ${token}` } });
    if(!res.ok) return null;
    const data = await res.json();
    const results = data.results || [];
    const match = results.find(r => (r.person.emailAddresses||[]).some(e => e.value && e.value.toLowerCase() === email.toLowerCase()));
    return match ? match.person.resourceName : null;
  }catch(e){
    return null;
  }
}

async function syncClientToGoogleContacts(client){
  const email = client.profile && client.profile.email ? client.profile.email.trim() : '';
  const phone = client.profile && client.profile.phone ? client.profile.phone.trim() : '';
  if(!email && !phone) return; // nothing to sync yet

  const token = await ensureGoogleAccessToken();
  if(!token) return;

  const body = { names: [{ givenName: client.name }] };
  if(email) body.emailAddresses = [{ value: email }];
  if(phone) body.phoneNumbers = [{ value: phone }];

  try{
    if(client.googleContactResourceName){
      // Already linked — fetch current etag, then update.
      const getRes = await fetch(`https://people.googleapis.com/v1/${client.googleContactResourceName}?personFields=names,emailAddresses,phoneNumbers`, {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      if(!getRes.ok){
        console.error('Google Kişi bulunamadı, güncellenemedi', await getRes.text());
        return;
      }
      const existing = await getRes.json();
      body.etag = existing.etag;
      const updateRes = await fetch(`https://people.googleapis.com/v1/${client.googleContactResourceName}:updateContact?updatePersonFields=names,emailAddresses,phoneNumbers`, {
        method: 'PATCH',
        headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      if(!updateRes.ok){
        console.error('Google Kişi güncellenemedi', await updateRes.text());
      }
    }else{
      const foundResourceName = await findExistingGoogleContact(token, email);
      if(foundResourceName){
        client.googleContactResourceName = foundResourceName;
        saveState();
        return;
      }
      const res = await fetch('https://people.googleapis.com/v1/people:createContact', {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      if(res.ok){
        const data = await res.json();
        client.googleContactResourceName = data.resourceName;
        saveState();
      }else{
        console.error('Google Kişiler\'e eklenemedi', await res.text());
      }
    }
  }catch(e){
    console.error('Google Kişiler senkron hatası', e);
  }
}

async function syncAllClientsToGoogleContacts(onProgress){
  const candidateIds = state.clients.filter(c => c.profile && (c.profile.email || c.profile.phone)).map(c=>c.id);
  let done = 0;
  for(const clientId of candidateIds){
    const liveClient = state.clients.find(c=>c.id===clientId);
    if(liveClient) await syncClientToGoogleContacts(liveClient);
    done++;
    if(onProgress) onProgress(done, candidateIds.length);
    await new Promise(r => setTimeout(r, 250)); // small pause to avoid rate limits
  }
  return { total: candidateIds.length };
}

function encodeMimeSubject(str){
  if(/^[\x00-\x7F]*$/.test(str)) return str;
  const bytes = new TextEncoder().encode(str);
  let binary=''; for(const b of bytes) binary += String.fromCharCode(b);
  return `=?UTF-8?B?${btoa(binary)}?=`;
}

function utf8ToBase64(str){
  const bytes = new TextEncoder().encode(str);
  let binary=''; for(const b of bytes) binary += String.fromCharCode(b);
  return btoa(binary);
}

function base64UrlEncode(str){
  return btoa(str).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}

function arrayBufferToBinaryString(buffer){
  let binary = '';
  const bytes = new Uint8Array(buffer);
  const chunk = 0x8000;
  for(let i=0;i<bytes.length;i+=chunk){
    binary += String.fromCharCode.apply(null, bytes.subarray(i, i+chunk));
  }
  return binary;
}

// Returns { ok, to, error }. The draft goes only to the person named on the invoice.
async function createGmailDraftWithAttachment(client, session, doc, filename, recipient){
  const token = await ensureGoogleAccessToken();
  if(!token) return { ok:false, to:'', error:'Google bağlantısı yok' };

  recipient = recipient || invoiceRecipient(client, 'primary');
  const to = recipient.email;
  const subject = `Your Receipt from ${getProvider().name} - ${formatInvoiceDate(session.date)}`;
  const bodyText = `Hello ${recipient.name || client.name},\n\nPlease find your receipt for the session on ${formatInvoiceDate(session.date)} attached.\n\nBest regards,`;
  const safeName = filename.replace(/[^\x20-\x7E]|"/g, '_');

  const pdfBase64 = btoa(arrayBufferToBinaryString(doc.output('arraybuffer')));
  const boundary = 'boundary_' + Date.now();

  const mime =
    (to ? `To: ${to}\r\n` : '') +
    `Subject: ${encodeMimeSubject(subject)}\r\n` +
    `MIME-Version: 1.0\r\n` +
    `Content-Type: multipart/mixed; boundary="${boundary}"\r\n\r\n` +
    `--${boundary}\r\n` +
    `Content-Type: text/plain; charset="UTF-8"\r\n` +
    `Content-Transfer-Encoding: base64\r\n\r\n` +
    `${utf8ToBase64(bodyText)}\r\n\r\n` +
    `--${boundary}\r\n` +
    `Content-Type: application/pdf; name="${safeName}"\r\n` +
    `Content-Disposition: attachment; filename="${safeName}"; filename*=UTF-8''${encodeURIComponent(filename)}\r\n` +
    `Content-Transfer-Encoding: base64\r\n\r\n` +
    `${pdfBase64}\r\n\r\n` +
    `--${boundary}--`;

  try{
    const res = await fetch('https://www.googleapis.com/gmail/v1/users/me/drafts', {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: { raw: base64UrlEncode(mime) } })
    });
    if(!res.ok){
      const err = await res.json().catch(()=>({}));
      return { ok:false, to, error: 'Taslak oluşturulamadı: ' + (err.error && err.error.message ? err.error.message : res.status) };
    }
    return { ok:true, to, error:'' };
  }catch(e){
    return { ok:false, to, error: 'Taslak oluşturulamadı: ' + e.message };
  }
}

async function savePdfWithPicker(doc, filename){
  if('showSaveFilePicker' in window){
    try{
      const handle = await window.showSaveFilePicker({
        suggestedName: filename,
        types: [{ description:'PDF dosyası', accept:{'application/pdf':['.pdf']} }]
      });
      const writable = await handle.createWritable();
      await writable.write(doc.output('arraybuffer'));
      await writable.close();
      return;
    }catch(e){
      if(e && e.name === 'AbortError') return; // user cancelled the picker
      console.error('Kaydetme penceresi başarısız, otomatik indirmeye geçiliyor', e);
    }
  }
  doc.save(filename);
}

function invoiceFilename(client, session, nameOverride){
  const namePart = toAscii(nameOverride || client.name).replace(/\s+/g,'');
  let dd='00', mm='00', yy='00';
  if(session.date){
    const d = new Date(session.date + 'T00:00:00');
    dd = String(d.getDate()).padStart(2,'0');
    mm = String(d.getMonth()+1).padStart(2,'0');
    yy = String(d.getFullYear()).slice(-2);
  }
  return `Invoice-${namePart}${yy}.${mm}.${dd}.pdf`;
}

function askInvoiceNumber(sessionId){

        </div>

      const used = findInvoiceNumberUse(input.value, sessionId);

async function resolveInvoiceDetails(client, session){
  const ifhp = !!(client.profile && client.profile.ifhp);
  const isAssessment = ifhp && !!session.isAssessment;
  const fullRate = getSessionFullRate(client, session);
  if(!ifhp && (!fullRate || fullRate <= 0)){
    alert('Önce bu danışanın profiline seans ücretini girmelisin.');
    return null;
  }

  let invoiceNumber = session.lastInvoiceNumber || '';
  const wantsInvoiceNumber = ifhp || !!(client.profile && client.profile.useInvoiceNumber);
  if(wantsInvoiceNumber && !invoiceNumber){
    const entered = await askInvoiceNumber(session.id);
    if(!entered || !entered.trim()){
      if(ifhp){
        alert('Fatura numarası girilmeden IFHP faturası oluşturulamaz.');
        return null;
      }
      // non-IFHP: number is desired but not strictly mandatory — proceed without one if cancelled
    }else{
      invoiceNumber = entered.trim();
    }
  }

  // The modal above awaited user input; state may have been replaced by a snapshot meanwhile.
  const liveClientInv = state.clients.find(c => c.id === client.id);
  const liveSessionInv = liveClientInv && (liveClientInv.sessions||[]).find(s => s.id === session.id);
  if(liveClientInv) client = liveClientInv;
  if(liveSessionInv) session = liveSessionInv;

  if(invoiceNumber && session.lastInvoiceNumber !== invoiceNumber){
    session.lastInvoiceNumber = invoiceNumber;
    if(!state.ifhpInvoiceNumbers) state.ifhpInvoiceNumbers = [];
    state.ifhpInvoiceNumbers.push({
      id: uid(), clientId: client.id, clientName: client.name,
      sessionId: session.id, invoiceNumber, date: session.date, createdAt: Date.now()
    });
    saveState();
  }

  // Same rule as the rate: only an explicit "Bireysel Seans" (invitedBoth === false) is a single-person session.
  const shouldSplit = !ifhp && hasNamedSecondPerson(client) && !!client.profile.splitInvoice && session.invitedBoth !== false;

  if(shouldSplit){
    const halfRate = fullRate / 2;
    const numA = invoiceNumber ? `${invoiceNumber}-A` : '';
    const numB = invoiceNumber ? `${invoiceNumber}-B` : '';
    const docA = buildInvoiceDoc(client, session, ifhp, halfRate, numA, client.name, isAssessment);
    const docB = buildInvoiceDoc(client, session, ifhp, halfRate, numB, client.profile.secondPerson.name, isAssessment);
    const recA = invoiceRecipient(client, 'primary');
    const recB = invoiceRecipient(client, 'second');
    return [
      { doc: docA, filename: invoiceFilename(client, session, recA.name), rate: halfRate, invoiceNumber: numA, billToName: recA.name, recipient: recA },
      { doc: docB, filename: invoiceFilename(client, session, recB.name), rate: halfRate, invoiceNumber: numB, billToName: recB.name, recipient: recB }
    ];
  }

  const who = await askBillToName(client);
  if(!who) return null; // cancelled
  const recipient = invoiceRecipient(client, who);
  const billToName = recipient.name;
  const doc = buildInvoiceDoc(client, session, ifhp, fullRate, invoiceNumber, billToName, isAssessment);
  const filename = invoiceFilename(client, session, billToName);
  return [{ doc, filename, rate: fullRate, invoiceNumber, billToName, recipient }];
}

async function generateInvoiceForSession(client, session, action){
  const detailsList = await resolveInvoiceDetails(client, session);
  if(!detailsList) return;
  const labelOf = d => `${d.billToName || client.name} - CA$${d.rate.toFixed(2)}${d.invoiceNumber ? ' - #'+d.invoiceNumber : ''}`;
  if(action === 'share'){
    if(detailsList.length === 1){
      const d = detailsList[0];
      const shared = await shareInvoiceFiles([{ doc: d.doc, filename: d.filename }], d.recipient ? d.recipient.name : client.name);
      if(shared) logAudit('fatura paylaşıldı', labelOf(d), client.id);
    }else{
      await askSharePerPerson(detailsList, client, labelOf);
    }
    return;
  }
  if(action === 'gmail'){
    const results = [];
    for(const d of detailsList){
      const r = await createGmailDraftWithAttachment(client, session, d.doc, d.filename, d.recipient || invoiceRecipient(client, 'primary'));
      results.push({ d, r });
      logAudit(r.ok ? 'fatura Gmail taslağı olarak hazırlandı' : 'fatura Gmail taslağı oluşturulamadı', labelOf(d) + (r.ok && r.to ? ` → ${r.to}` : ''), client.id);
    }
    const lines = results.map(({d, r}) => r.ok
      ? `✅ ${d.billToName}: taslak hazır${r.to ? ' (' + r.to + ')' : ' — ALICI BOŞ, bu kişinin e-postası profilde yok'}`
      : `❌ ${d.billToName}: ${r.error}`);
    alert(lines.join('\n') + (results.some(x=>x.r.ok) ? '\n\nGmail\'i açıp gözden geçirip gönderebilirsin.' : ''));
    return;
  }
  let lastOk = true;
  for(const details of detailsList){
    const { doc, filename, rate, invoiceNumber, billToName } = details;
    const amountLabel = `${billToName || client.name} - CA$${rate.toFixed(2)}${invoiceNumber ? ' - #'+invoiceNumber : ''}`;

    if(action === 'save'){
      await savePdfWithPicker(doc, filename);
      logAudit('fatura bilgisayara indirildi', amountLabel, client.id);
    }else if(action === 'drive'){
      const ok = await uploadPdfToDriveFolder(doc, filename);
      logAudit(ok ? "fatura Drive'a kaydedildi" : "fatura Drive'a kaydedilemedi", amountLabel, client.id);
      lastOk = lastOk && ok;
    }
  }
  if(action === 'drive') return lastOk;
}



// Split invoices: one share button per person, so each PDF goes to its own person
// (each tap is a fresh user gesture, which iOS requires for navigator.share).
function askSharePerPerson(detailsList, client, labelOf){
  return new Promise((resolve)=>{
    const modal = document.createElement('div');
    modal.className = 'backups-modal';
    modal.style.display = 'flex';
    modal.innerHTML = `
      <div class="backups-box" style="max-width:340px;">
        <div class="backups-box-header"><h2>Faturaları gönder</h2></div>
        <div style="padding:0 20px 20px; display:flex; flex-direction:column; gap:8px;">
          <p style="margin:0 0 4px; font-size:13px; color:var(--muted);">Her fatura yalnızca üzerindeki kişiye gönderilmeli.</p>
          ${detailsList.map((d,i)=>`<button class="settings-btn share-person-btn" data-idx="${i}" style="width:100%;">📤 ${escapeHtml(d.billToName)} faturasını gönder</button>`).join('')}
          <button class="reschedule-cancel-btn" id="sharePersonDoneBtn" style="width:100%;">Bitti</button>
        </div>
      </div>`;
    document.body.appendChild(modal);
    const close = ()=>{ modal.remove(); resolve(); };
    modal.querySelectorAll('.share-person-btn').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const d = detailsList[Number(btn.getAttribute('data-idx'))];
        const shared = await shareInvoiceFiles([{ doc: d.doc, filename: d.filename }], d.billToName, true);
        if(shared){
          logAudit('fatura paylaşıldı', labelOf(d), client.id);
          btn.textContent = `✅ ${d.billToName} — gönderildi`;
        }
      });
    });
    document.getElementById('sharePersonDoneBtn').addEventListener('click', close);
    modal.addEventListener('click', (ev)=>{ if(ev.target === modal) close(); });
  });
}

async function shareInvoiceFile(doc, filename, recipientName){

// Returns true if the share sheet completed.
async function shareInvoiceFiles(items, recipientName, fromDirectTap){
  const files = items.map(it => new File([it.doc.output('blob')], it.filename, { type:'application/pdf' }));
  if(!(navigator.canShare && navigator.canShare({ files }))){
    alert('Bu tarayıcı/cihaz dosya paylaşımını desteklemiyor. Bunun yerine "İndir" butonunu kullanabilirsin.');
    return false;
  }
  const payload = { files, title: files.length === 1 ? files[0].name : `${files.length} fatura`, text: recipientName || '' };
  try{
    await navigator.share(payload);
    return true;
  }catch(e){
    if(e && e.name === 'AbortError') return false; // user closed the share sheet
    if(e && e.name === 'NotAllowedError' && !fromDirectTap){
      let shared = false;
      // The tap "expired" while the invoice-number modal was open (iOS). Ask for one more tap.
      await new Promise((resolve)=>{
        const modal = document.createElement('div');
        modal.className = 'backups-modal';
        modal.style.display = 'flex';
        modal.innerHTML = `
          <div class="backups-box" style="max-width:320px;">
            <div class="backups-box-header"><h2>Fatura hazır</h2></div>
            <div style="padding:0 20px 20px; display:flex; flex-direction:column; gap:8px;">
              <button class="settings-btn" id="shareRetryBtn" style="width:100%;">Paylaş</button>
              <button class="reschedule-cancel-btn" id="shareRetryCancelBtn" style="width:100%;">Vazgeç</button>
            </div>
          </div>`;
        document.body.appendChild(modal);
        document.getElementById('shareRetryBtn').addEventListener('click', ()=>{
          modal.remove();
          navigator.share(payload).then(()=>{ shared = true; }).catch(err=>{
            if(!err || err.name !== 'AbortError') alert('Paylaşılamadı: ' + (err && err.message ? err.message : 'bilinmeyen hata'));
          }).finally(resolve);
        });
        document.getElementById('shareRetryCancelBtn').addEventListener('click', ()=>{ modal.remove(); resolve(); });
      });
      return shared;
    }
    alert('Paylaşılamadı: ' + (e && e.message ? e.message : 'bilinmeyen hata'));
    return false;
  }
}

/* ---------- Shared task notes + subtasks (used by client, home, and practice task lists) ---------- */
let expandedTaskExtras = new Set();

  const subtasks = item.subtasks || [];

  if(!hasNote && !subtasks.length){

  if(hasNote) parts.push('📝 Not');

  return `<button class="task-extras-toggle has-content ${allDone ? 'all-done' : ''}" type="button" title="${open ? 'Gizle' : 'Not ve alt görevleri göster'}">${parts.join(' · ')} ${open ? '▴' : '▾'}</button>`;

/* Drafts for the add forms, kept outside the DOM so a re-render doesn't lose them.
   Keys: 'client:<id>', 'home', 'practice'. */
const newTaskDrafts = {};

function getNewTaskDraft(key){
  if(!newTaskDrafts[key]) newTaskDrafts[key] = { open:false, note:'', subtasks:[], pendingSubtask:'' };
  return newTaskDrafts[key];
}

function newTaskExtrasHtml(key){
  const d = getNewTaskDraft(key);
  const parts = [];
  if(d.note.trim()) parts.push('not');
  if(d.subtasks.length) parts.push(`${d.subtasks.length} alt görev`);
  const label = d.open ? '📝 Not ve alt görevleri gizle' : `📝 Not / alt görev ekle${parts.length ? ` (${parts.join(', ')})` : ''}`;
  return `
  <div class="new-task-extras" data-draft-key="${escapeAttr(key)}">
    <button type="button" class="new-task-extras-toggle ${parts.length ? 'has-content' : ''}">${label}</button>
    <div class="new-task-extras-body ${d.open ? '' : 'collapsed'}">
      <textarea class="task-note-input new-task-note" placeholder="Not ekle…">${escapeHtml(d.note)}</textarea>
      <div class="task-subtasks">
        ${d.subtasks.map((text,i)=>`
          <div class="task-subtask-row">
            <span class="task-subtask-text">• ${escapeHtml(text)}</span>
            <button type="button" class="task-subtask-del new-task-subtask-del" data-idx="${i}" title="Sil">✕</button>
          </div>`).join('')}
        <div class="task-subtask-add-row">
          <input type="text" class="new-task-subtask-input" placeholder="+ Alt görev yaz, Enter'a bas…" value="${escapeAttr(d.pendingSubtask)}">
        </div>
      </div>
    </div>
  </div>`;
}

function wireNewTaskExtras(root, key){
  const el = Array.from(root.querySelectorAll('.new-task-extras')).find(x => x.getAttribute('data-draft-key') === key);
  if(!el) return;
  const d = getNewTaskDraft(key);
  const redraw = (focusSubtaskInput)=>{
    el.outerHTML = newTaskExtrasHtml(key);
    wireNewTaskExtras(root, key);
    if(focusSubtaskInput){
      const fresh = Array.from(root.querySelectorAll('.new-task-extras')).find(x => x.getAttribute('data-draft-key') === key);
      const input = fresh && fresh.querySelector('.new-task-subtask-input');
      if(input) input.focus();
    }
  };
  el.querySelector('.new-task-extras-toggle').addEventListener('click', ()=>{ d.open = !d.open; redraw(); });
  el.querySelector('.new-task-note').addEventListener('input', (ev)=>{ d.note = ev.target.value; });
  const subInput = el.querySelector('.new-task-subtask-input');
  subInput.addEventListener('input', (ev)=>{ d.pendingSubtask = ev.target.value; });
  subInput.addEventListener('keydown', (ev)=>{
    if(ev.key !== 'Enter') return;
    ev.preventDefault();
    const text = subInput.value.trim();
    if(!text) return;
    d.subtasks.push(text);
    d.pendingSubtask = '';
    redraw(true);
  });
  el.querySelectorAll('.new-task-subtask-del').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      d.subtasks.splice(Number(btn.getAttribute('data-idx')), 1);
      redraw();
    });
  });
}

// Returns { note?, subtasks? } for the new item and clears the draft.
// A subtask typed but not yet confirmed with Enter is included too.
function takeNewTaskExtras(key){
  const d = getNewTaskDraft(key);
  const texts = [...d.subtasks];
  if(d.pendingSubtask.trim()) texts.push(d.pendingSubtask.trim());
  const out = {};
  if(d.note.trim()) out.note = d.note.trim();
  if(texts.length) out.subtasks = texts.map(text => ({ id: uid(), text, done:false }));
  delete newTaskDrafts[key];
  return out;
}

function wireTaskExtras(row, item, onSave, onRerender){
  const toggleExtras = (ev)=>{
    ev.stopPropagation();
    if(expandedTaskExtras.has(item.id)) expandedTaskExtras.delete(item.id);
    else expandedTaskExtras.add(item.id);
    onRerender();
  };
  const toggle = row.querySelector('.task-extras-toggle');
  if(toggle) toggle.addEventListener('click', toggleExtras);
  const preview = row.querySelector('.task-extras-preview');
  if(preview) preview.addEventListener('click', toggleExtras);
  const noteInput = row.querySelector('.task-note-input');
  if(noteInput){
    noteInput.addEventListener('blur', (ev)=>{
      item.note = ev.target.value;
      onSave();
    });
  }
  row.querySelectorAll('.task-subtask-check').forEach(cb=>{
    cb.addEventListener('change', (ev)=>{
      const id = ev.target.closest('[data-subtask-id]').getAttribute('data-subtask-id');
      const st = (item.subtasks||[]).find(s=>s.id===id);
      if(st){ st.done = ev.target.checked; onSave(); onRerender(); }
    });
  });
  row.querySelectorAll('.task-subtask-del').forEach(btn=>{
    btn.addEventListener('click', (ev)=>{
      const id = ev.target.closest('[data-subtask-id]').getAttribute('data-subtask-id');
      item.subtasks = (item.subtasks||[]).filter(s=>s.id!==id);
      onSave(); onRerender();
    });
  });
  const addInput = row.querySelector('.task-subtask-add-input');
  if(addInput){
    addInput.addEventListener('keydown', (ev)=>{
      if(ev.key === 'Enter'){
        ev.preventDefault();
        const text = addInput.value.trim();
        if(text){
          if(!item.subtasks) item.subtasks = [];
          item.subtasks.push({ id: uid(), text, done:false });
          onSave(); onRerender();
        }
      }
    });
  }
}

let todoSortByClient = {};

function sortedTodos(todos, mode){
  const pending = todos.filter(t=>!t.done);
  const done = todos.filter(t=>t.done);
  if(mode === 'importance'){
    pending.sort((a,b)=> b.importance - a.importance || (a.dueDate||'9999-99-99').localeCompare(b.dueDate||'9999-99-99'));
  }else{
    pending.sort((a,b)=> (a.dueDate||'9999-99-99').localeCompare(b.dueDate||'9999-99-99') || (b.importance-a.importance));
  }
  done.sort((a,b)=> (b.doneAt||'').localeCompare(a.doneAt||''));
  return { pending, done };
}
