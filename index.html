function practiceStatsHtml(){
  const shared = (practiceState && practiceState.stats) || {};
  const me = currentPersonId();
  const nowMonth = todayIso().slice(0,7);
  const nowYear = nowMonth.slice(0,4);
  const monthNames = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];

  // My own numbers are always computed live. For the other person, month/year figures that were
  // published in an earlier month/year are hidden instead of being shown as "this month".
  function view(id){
    if(id === me && state) return { ...computePersonalStats(), updatedAt: Date.now(), monthStale:false };
    const e = shared[id];
    if(!e) return null;
    const mk = e.monthKey || (e.updatedAt ? isoDate(new Date(e.updatedAt)).slice(0,7) : null);
    const monthOk = mk === nowMonth;
    const yearOk = !!mk && mk.slice(0,4) === nowYear;
    return { ...e,
      sessionsThisMonth: monthOk ? e.sessionsThisMonth : null,
      revenueThisMonth: monthOk ? e.revenueThisMonth : null,
      sessionsThisYear: yearOk ? e.sessionsThisYear : null,
      lateChangesThisMonth: (monthOk && e.lateChangesThisMonth != null) ? e.lateChangesThisMonth : null,
      monthStale: !monthOk };
  }
  const kubilay = view('kubilay');
  const duygu = view('duygu');

  const num = v => v == null ? '—' : v;
  const money = v => v == null ? '—' : 'CA$' + Number(v).toFixed(0);
  function staleMonthNote(name, entry){
    if(!entry || !entry.monthStale) return '';
    const last = entry.updatedAt ? formatShortDate(isoDate(new Date(entry.updatedAt))) : '?';
    return `<p class="practice-stats-note">⚠️ ${name} ${monthNames[Number(nowMonth.slice(5,7))-1]} ayında uygulamayı henüz açmadığı için bu ayın verisi yok (son güncelleme: ${last}). Açtığında otomatik güncellenir.</p>`;
  }

  function box(num, label){
    return `<div class="practice-stat-box"><div class="practice-stat-num">${num}</div><div class="practice-stat-label">${label}</div></div>`;
  }
  function staleness(entry){
    if(!entry || !entry.updatedAt) return '';
    const days = Math.floor((Date.now() - entry.updatedAt) / (24*60*60*1000));
    if(days <= 0) return '(bugün güncellendi)';
    return `(${days} gün önce güncellendi)`;
  }

  if(practiceStatsFilter === 'kubilay'){
    if(!kubilay) return `<div class="todo-empty">Kubilay henüz Yönetim sayfasını açıp veri paylaşmadı.</div>`;
    return `<p class="practice-stats-note">Kubilay ${staleness(kubilay)}</p>${staleMonthNote('Kubilay', kubilay)}<div class="practice-stats-grid">
      ${box(kubilay.activeClients,'Aktif danışan')}
      ${box(kubilay.terminatedClients,'Sonlanmış danışan')}
      ${box(num(kubilay.sessionsThisMonth),'Bu ay seans')}
      ${box(num(kubilay.sessionsThisYear),'Bu yıl seans')}
      ${box(money(kubilay.revenueThisMonth),'Bu ay tahsil edilen')}
      ${box(num(kubilay.lateChangesThisMonth),'Bu ay geç değişiklik')}
    </div>`;
  }
  if(practiceStatsFilter === 'duygu'){
    if(!duygu) return `<div class="todo-empty">Duygu henüz Yönetim sayfasını açıp veri paylaşmadı.</div>`;
    return `<p class="practice-stats-note">Duygu ${staleness(duygu)}</p>${staleMonthNote('Duygu', duygu)}<div class="practice-stats-grid">
      ${box(duygu.activeClients,'Aktif danışan')}
      ${box(duygu.terminatedClients,'Sonlanmış danışan')}
      ${box(num(duygu.sessionsThisMonth),'Bu ay seans')}
      ${box(num(duygu.sessionsThisYear),'Bu yıl seans')}
      ${box(money(duygu.revenueThisMonth),'Bu ay tahsil edilen')}
      ${box(num(duygu.lateChangesThisMonth),'Bu ay geç değişiklik')}
    </div>`;
  }
  // toplam
  if(!kubilay && !duygu){
    return `<div class="todo-empty">Henüz hiçbir hesap veri paylaşmadı.</div>`;
  }
  const k = kubilay || { activeClients:0, terminatedClients:0, sessionsThisMonth:0, sessionsThisYear:0, revenueThisMonth:0 };
  const d = duygu || { activeClients:0, terminatedClients:0, sessionsThisMonth:0, sessionsThisYear:0, revenueThisMonth:0 };
  const missingNote = (!kubilay || !duygu) ? `<p class="practice-stats-note">${!kubilay?'Kubilay':'Duygu'} henüz veri paylaşmadı, toplam eksik olabilir.</p>` : '';
  // Sum what is known; mark with * when one side's month/year figure is missing.
  const sum = (a, b) => (a == null && b == null) ? null : (a || 0) + (b || 0);
  const partial = (a, b) => (a == null) !== (b == null);
  const star = (a, b) => partial(a, b) ? '*' : '';
  const anyPartial = partial(k.sessionsThisMonth, d.sessionsThisMonth) || partial(k.sessionsThisYear, d.sessionsThisYear) || partial(k.revenueThisMonth, d.revenueThisMonth);
  const partialNote = anyPartial ? `<p class="practice-stats-note">* ${(k.monthStale ? 'Kubilay' : 'Duygu')} bu ay uygulamayı henüz açmadığı için bu değerler yalnızca ${(k.monthStale ? "Duygu'nun" : "Kubilay'ın")} verisini içeriyor.</p>` : '';
  return `${missingNote}${partialNote}<div class="practice-stats-grid">
    ${box(k.activeClients + d.activeClients,'Aktif danışan')}
    ${box(k.terminatedClients + d.terminatedClients,'Sonlanmış danışan')}
    ${box(num(sum(k.sessionsThisMonth, d.sessionsThisMonth)) + star(k.sessionsThisMonth, d.sessionsThisMonth),'Bu ay seans')}
    ${box(num(sum(k.sessionsThisYear, d.sessionsThisYear)) + star(k.sessionsThisYear, d.sessionsThisYear),'Bu yıl seans')}
    ${box(money(sum(k.revenueThisMonth, d.revenueThisMonth)) + star(k.revenueThisMonth, d.revenueThisMonth),'Bu ay tahsil edilen')}
    ${box(num(sum(k.lateChangesThisMonth, d.lateChangesThisMonth)) + star(k.lateChangesThisMonth, d.lateChangesThisMonth),'Bu ay geç değişiklik')}
  </div>`;
}

function dueDateUrgencyClass(dueDate, done, prefix){
  if(done || !dueDate) return '';
  const today = todayIso();
  if(dueDate < today) return `${prefix}-due-overdue`;
  if(dueDate === today) return `${prefix}-due-today`;
  return `${prefix}-due-future`;
}

function wirePracticePage(){
  document.getElementById('backToListBtn').addEventListener('click', ()=>{
    document.body.classList.remove('mobile-detail');
  });

  document.querySelectorAll('.practice-section-toggle').forEach(header=>{
    header.addEventListener('click', (ev)=>{
      if(ev.target.closest('.practice-activity-clear-btn')) return; // don't toggle when clicking the clear button
      const section = header.getAttribute('data-section');
      practiceSectionCollapsed[section] = !practiceSectionCollapsed[section];
      renderPracticeContent();
    });
  });

  document.querySelectorAll('.practice-stats-filter-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      practiceStatsFilter = btn.getAttribute('data-filter');
      renderPracticeContent();
    });
  });

  document.querySelectorAll('.practice-task-filter-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      practiceTaskAssigneeFilter = btn.getAttribute('data-filter');
      renderPracticeContent();
    });
  });

  document.querySelector('.practice-task-sort-select').addEventListener('change', (ev)=>{
    practiceTaskSortMode = ev.target.value;
    renderPracticeContent();
  });

  const practiceDoneToggle = document.getElementById('practiceDoneToggle');
  if(practiceDoneToggle){
    practiceDoneToggle.addEventListener('click', ()=>{
      practiceDoneCollapsed = !practiceDoneCollapsed;
      renderPracticeContent();
    });
  }

  wireNewTaskExtras(document, 'practice');
  document.querySelector('.practice-task-add-btn').addEventListener('click', async ()=>{
    const textInput = document.querySelector('.practice-task-text');
    const title = textInput.value.trim();
    if(!title) return;
    const assignedTo = document.querySelector('.practice-task-assignee').value;
    const importance = Number(document.querySelector('.practice-task-importance').value);
    const dueDate = document.querySelector('.practice-task-duedate').value;
    const me = currentPersonId();
    const extras = takeNewTaskExtras('practice');
    if(!practiceState.tasks) practiceState.tasks = [];
    practiceState.tasks.push({ id: uid(), title, assignedTo, assignedBy: me, importance, dueDate, done:false, createdAt: Date.now(), ...extras });
    logPracticeActivity(`${personLabel(me)}, ${personLabel(assignedTo)}'a bir iş atadı: "${title}"`);
    notifyTaskEvent('assigned', { title, assignedTo, assignedBy: me });
    if(assignedTo === 'both'){
      const target = me === 'kubilay' ? 'duygu' : 'kubilay';
      pushInAppNotification(target, `${personLabel(me)}, ortak bir iş atadı: "${title}"`, 'taskAssigned');
    }else if(assignedTo !== me){
      pushInAppNotification(assignedTo, `${personLabel(me)}, sana bir iş atadı: "${title}"`, 'taskAssigned');
    }
    await savePracticeShared();
    renderPracticeContent();
  });

  document.querySelectorAll('.practice-task-check').forEach(cb=>{
    cb.addEventListener('change', async (ev)=>{
      const row = ev.target.closest('[data-id]');
      const id = row.getAttribute('data-id');
      const task = (practiceState.tasks||[]).find(t=>t.id===id);
      if(!task) return;
      task.done = ev.target.checked;
      task.doneAt = task.done ? Date.now() : null;
      if(task.done){
        const me = currentPersonId();
        logPracticeActivity(`${personLabel(me)}, "${task.title}" işini tamamladı.`);
        notifyTaskEvent('completed', { ...task, completedBy: me });
        if(task.assignedTo === 'both'){
          const target = me === 'kubilay' ? 'duygu' : 'kubilay';
          pushInAppNotification(target, `${personLabel(me)}, ortak işi tamamladı: "${task.title}"`, 'taskCompleted');
        }else if(task.assignedBy !== me){
          pushInAppNotification(task.assignedBy, `${personLabel(me)}, senin atadığın işi tamamladı: "${task.title}"`, 'taskCompleted');
        }
      }
      await savePracticeShared();
      renderPracticeContent();
    });
  });

  document.querySelectorAll('#practiceTaskList .home-task-del, #practiceDoneTaskList .home-task-del').forEach(btn=>{
    btn.addEventListener('click', async (ev)=>{
      const row = ev.target.closest('[data-id]');
      const id = row.getAttribute('data-id');
      if(!confirm('Bu iş silinsin mi?')) return;
      const task = (practiceState.tasks||[]).find(t=>t.id===id);
      practiceState.tasks = (practiceState.tasks||[]).filter(t=>t.id!==id);
      if(task){
        const me = currentPersonId();
        logPracticeActivity(`${personLabel(me)}, "${task.title}" işini sildi.`);
        if(task.assignedBy === me){
          if(task.assignedTo === 'both'){
            const target = me === 'kubilay' ? 'duygu' : 'kubilay';
            pushInAppNotification(target, `${personLabel(me)}, ortak bir işi sildi: "${task.title}"`, 'taskDeleted');
          }else if(task.assignedTo !== me){
            pushInAppNotification(task.assignedTo, `${personLabel(me)}, sana atadığı bir işi sildi: "${task.title}"`, 'taskDeleted');
          }
        }
      }
      await savePracticeShared();
      renderPracticeContent();
    });
  });

  document.querySelectorAll('#practiceTaskList .home-task-row, #practiceDoneTaskList .home-task-row').forEach(row=>{
    const id = row.getAttribute('data-id');
    const task = (practiceState.tasks||[]).find(t=>t.id===id);
    if(task){
      wireTaskExtras(row, task, savePracticeShared, renderPracticeContent);
    }
    // Inline editing (same as the Home page): no pencil button, changes save as you go.
    // The task is looked up again at event time because practiceState is refreshed in the background.
    const liveTask = ()=> (practiceState.tasks||[]).find(t=>t.id===id);
    const titleEl = row.querySelector('.practice-inline-title');
    if(!titleEl) return;
    const autoResize = ()=>{ titleEl.style.height = 'auto'; titleEl.style.height = titleEl.scrollHeight + 'px'; };
    titleEl.addEventListener('input', autoResize);
    autoResize();
    titleEl.addEventListener('keydown', (ev)=>{ if(ev.key === 'Enter' && !ev.shiftKey){ ev.preventDefault(); titleEl.blur(); } });
    titleEl.addEventListener('blur', async ()=>{
      const t = liveTask();
      if(!t) return;
      const val = titleEl.value.trim();
      if(!val){ titleEl.value = t.title; autoResize(); return; }
      if(val === t.title) return;
      t.title = val;
      logPracticeActivity(`${personLabel(currentPersonId())}, "${t.title}" işini düzenledi.`);
      await savePracticeShared();
    });

/* ---------- Faturalar arşivi (also covers year-end CSV export) ---------- */
let invoicesYearFilter = 'all';
let invoicesMonthFilter = 'all';
let invoicesSearchQuery = '';

function collectInvoicedSessions(){
  const rows = [];
  (state.clients||[]).forEach(c=>{
    if(c.profile && c.profile.noInvoice) return;
    (c.sessions||[]).forEach(s=>{
      if(!s.invoiceDone) return;
      const rate = (c.profile && c.profile.ifhp) ? (getSessionFullRate(c, s) * 0.70) : getSessionFullRate(c, s);
      rows.push({ clientId: c.id, clientName: c.name, session: s, date: s.date, ifhp: !!(c.profile && c.profile.ifhp), rate });
    });
  });
  rows.sort((a,b)=> (b.date||'').localeCompare(a.date||''));
  return rows;
}

function loadJsZipScript(){
  return new Promise((resolve, reject)=>{
    if(window.JSZip){ resolve(); return; }
    const script = document.createElement('script');
    script.src = 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
    script.onload = resolve;
    script.onerror = reject;
    document.head.appendChild(script);
  });
}

async function buildTaxPackageZip(rows, btn){
  if(!rows.length){
    alert('İndirilecek fatura yok.');
    return;
  }
  const originalText = btn.textContent;
  btn.disabled = true;
  try{
    btn.textContent = '⏳ Hazırlanıyor…';
    await loadJsZipScript();
    const zip = new window.JSZip();
    let done = 0;
    for(const r of rows){
      const c = state.clients.find(cl=>cl.id===r.clientId);
      if(!c) continue;
      const ifhp = !!(c.profile && c.profile.ifhp);
      const isAssessment = ifhp && !!r.session.isAssessment;
      const fullRate = getSessionFullRate(c, r.session);
      const invoiceNumber = r.session.lastInvoiceNumber || '';
      const doc = buildInvoiceDoc(c, r.session, ifhp, fullRate, invoiceNumber, c.name, isAssessment);
      const filename = invoiceFilename(c, r.session);
      zip.file(filename, doc.output('blob'));
      done++;
      btn.textContent = `⏳ Hazırlanıyor… (${done}/${rows.length})`;
    }
    const csvHeader = ['Tarih','Danışan','Tutar (CAD)','IFHP'];
    const csvLines = [csvHeader.join(',')];
    rows.forEach(r=>{
      csvLines.push([r.date||'', `"${(r.clientName||'').replace(/"/g,'""')}"`, r.rate.toFixed(2), r.ifhp ? 'Evet' : 'Hayır'].join(','));
    });
    zip.file('faturalar-ozet.csv', csvLines.join('\n'));

    const zipBlob = await zip.generateAsync({ type: 'blob' });
    const url = URL.createObjectURL(zipBlob);
    const a = document.createElement('a');
    const yearLabel = invoicesYearFilter === 'all' ? 'tum-yillar' : invoicesYearFilter;
    a.href = url;
    a.download = `vergi-paketi-${yearLabel}.zip`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }catch(e){
    console.error('Vergi paketi oluşturulamadı', e);
    alert('Vergi paketi oluşturulamadı, tekrar dener misin?');
  }finally{
    btn.disabled = false;
    btn.textContent = originalText;
  }
}

function downloadInvoicesCsv(rows){
  const header = ['Tarih','Danışan','Tutar (CAD)','IFHP'];
  const lines = [header.join(',')];
  rows.forEach(r=>{
    lines.push([r.date||'', `"${(r.clientName||'').replace(/"/g,'""')}"`, r.rate.toFixed(2), r.ifhp ? 'Evet' : 'Hayır'].join(','));
  });
  const csv = lines.join('\n');
  const blob = new Blob([csv], { type:'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const parts = [invoicesYearFilter === 'all' ? 'tum-yillar' : invoicesYearFilter];
  if(invoicesMonthFilter !== 'all') parts.push(invoicesMonthFilter);
  a.href = url;
  a.download = `faturalar-${parts.join('-')}.csv`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function backfillIfhpInvoiceNumbers(){
  if(!state.ifhpInvoiceNumbers) state.ifhpInvoiceNumbers = [];
  const existingSessionIds = new Set(state.ifhpInvoiceNumbers.map(r=>r.sessionId));
  let added = false;
  (state.clients||[]).forEach(c=>{
    if(!c.profile || !c.profile.ifhp) return;
    (c.sessions||[]).forEach(s=>{
      if(s.lastInvoiceNumber && !existingSessionIds.has(s.id)){
        state.ifhpInvoiceNumbers.push({
          id: uid(), clientId: c.id, clientName: c.name,
          sessionId: s.id, invoiceNumber: s.lastInvoiceNumber, date: s.date, createdAt: 0
        });
        existingSessionIds.add(s.id);
        added = true;
      }
    });
  });
  if(added) saveState();
}

function reRenderPreservingFocus(inputId, renderFn){
  const input = document.getElementById(inputId);
  const cursorPos = input ? input.selectionStart : null;
  renderFn();
  const newInput = document.getElementById(inputId);
  if(newInput && cursorPos !== null){
    newInput.focus();
    newInput.setSelectionRange(cursorPos, cursorPos);
  }
}

          bulkInvoiceProgress = `İndiriliyor… (${i+1}/${targets.length})`;
          applyBulkInvoiceBtn();
          const client = state.clients.find(c=>c.id===targets[i].clientId);
          const session = client && (client.sessions||[]).find(s=>s.id===targets[i].sessionId);
          if(client && session){
            await generateInvoiceForSession(client, session, 'save');
            await new Promise(r=>setTimeout(r, 400));
          }
        }
      }finally{
        bulkInvoiceProgress = null;
        applyBulkInvoiceBtn();
      }
    });
  }
  applyBulkInvoiceBtn(); // re-apply progress if the page was re-rendered mid-download
}

// Every invite address of a client: the main person and, for couples/families, the second person.
function clientInviteEmails(client){
  const p = (client && client.profile) || {};
  return [p.email, p.secondPerson && p.secondPerson.email]
    .map(e => (e || '').trim().toLowerCase()).filter(Boolean);
}

function getKnownClientEmails(){
  const map = {};
  state.clients.forEach(c=>{
    clientInviteEmails(c).forEach(email => { if(!map[email]) map[email] = c; });
  });
  return map;
}

async function fetchEventsInRange(startDate, endDate){
  const token = await getTokenSilentOnly();
  if(!token) return null;
  const calendarIds = ['primary'];
  const other = otherPersonEmail();
  if(other) calendarIds.push(other);
  try{
    const results = await Promise.all(calendarIds.map(async (calId)=>{
      const url = `https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(calId)}/events?timeMin=${encodeURIComponent(startDate.toISOString())}&timeMax=${encodeURIComponent(endDate.toISOString())}&singleEvents=true&orderBy=startTime&maxResults=250`;
      const res = await fetch(url, { headers: { 'Authorization': `Bearer ${token}` } });
      if(!res.ok) return [];
      const data = await res.json();
      return (data.items || []).map(ev => ({ ...ev, _calendarId: calId }));
    }));
    return results.flat().sort((a,b)=>{
      const sa = (a.start && (a.start.dateTime || a.start.date)) || '';
      const sb = (b.start && (b.start.dateTime || b.start.date)) || '';
      return sa.localeCompare(sb);
    });
  }catch(e){
    return null;
  }
}

async function fetchUpcomingRangeEvents(days){
  const startOfToday = new Date();
  startOfToday.setHours(0,0,0,0);
  const future = addDaysLocal(startOfToday, days);
  return fetchEventsInRange(startOfToday, future);
}

async function fetchPastRangeEvents(days){
  const startOfToday = new Date();
  startOfToday.setHours(0,0,0,0);
  const past = addDaysLocal(startOfToday, -days);
  return fetchEventsInRange(past, startOfToday);
}

function matchClientEvents(events){
  const emailMap = getKnownClientEmails();
  const matched = [];
  events.forEach(ev=>{
    const attendees = ev.attendees || [];
    const hit = attendees.find(a => emailMap[(a.email||'').trim().toLowerCase()]);
    if(hit) matched.push({ ev, client: emailMap[hit.email.trim().toLowerCase()] });
  });
  return matched;
}

function computeUpcomingBirthdays(){
  const today = new Date();
  const results = [];
  (state.clients||[]).forEach(c=>{
    if(!c.profile || !c.profile.birthDate) return;
    if(c.profile.terminated) return;
    const bd = new Date(c.profile.birthDate + 'T00:00:00');
    const occurrenceThisYear = new Date(today.getFullYear(), bd.getMonth(), bd.getDate());
    const todayMidnight = new Date(today.getFullYear(), today.getMonth(), today.getDate());
    let diffDays = Math.round((occurrenceThisYear - todayMidnight) / (24*60*60*1000));
    if(diffDays < 0){
      const occurrenceNextYear = new Date(today.getFullYear()+1, bd.getMonth(), bd.getDate());
      diffDays = Math.round((occurrenceNextYear - todayMidnight) / (24*60*60*1000));
    }
    if(diffDays <= 7){
      results.push({ id: c.id, name: c.name, diffDays });
    }
  });
  results.sort((a,b)=>a.diffDays-b.diffDays);
  return results;
}

function birthdayBannerHtml(){
  const upcoming = computeUpcomingBirthdays();
  if(!upcoming.length) return '';
  const items = upcoming.map(b=>{
    const label = b.diffDays === 0 ? '🎂 bugün' : b.diffDays === 1 ? 'yarın' : `${b.diffDays} gün sonra`;
    return `<span class="birthday-item cal-client-link" data-client-id="${b.id}">${escapeHtml(b.name)} <span class="birthday-when">(${label})</span></span>`;
  }).join('');
  return `<div class="birthday-banner">🎉 ${items}</div>`;
}

function computeOwedList(){
  const rows = [];
  (state.clients||[]).forEach(c=>{
    if(c.profile && c.profile.terminated) return;
    let unpaidCount = 0;
    let total = 0;
    (c.sessions||[]).forEach(s=>{
      if(!isSessionDue(s)) return;
      if((s.disabledChecks||[]).includes('paymentDone')) return;
      if(!s.paymentDone){
        unpaidCount++;
        const sessionRate = getSessionFullRate(c, s);
        total += sessionRate;
      }
    });
    if(unpaidCount === 0) return;
    rows.push({ id: c.id, name: c.name, unpaidCount, total });
  });
  rows.sort((a,b)=> b.total - a.total);
  return rows;
}

function owedListHtml(){
  const rows = computeOwedList();
  if(!rows.length) return `<div class="todo-empty">Bekleyen ödeme yok. 🎉</div>`;
  const grandTotal = rows.reduce((sum,r)=>sum+r.total, 0);
  return `
    <div class="owed-total">Toplam: <strong>CA$${grandTotal.toFixed(0)}</strong></div>
    <div class="owed-list">
      ${rows.map(r => `
        <div class="owed-row" data-client-id="${r.id}">

function isoDate(d){
  return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
}

// Adds calendar days in local time. Unlike "+ n*24h" this stays on the right date across DST changes.
function addDaysLocal(date, n){
  return new Date(date.getFullYear(), date.getMonth(), date.getDate() + n, date.getHours(), date.getMinutes(), date.getSeconds(), date.getMilliseconds());
}

function getCalendarRangeForView(){
  const d = new Date(calendarAnchorDate + 'T00:00:00');
  if(calendarViewMode === 'month'){
    const start = new Date(d.getFullYear(), d.getMonth(), 1);
    const end = new Date(d.getFullYear(), d.getMonth()+1, 1);
    return { start, end };
  }
  if(calendarViewMode === 'week'){
    const mondayFirst = getCalendarPrefs().weekStartsMonday;
    let offset;
    if(mondayFirst){
      offset = d.getDay() - 1;
      if(offset < 0) offset = 6;
    }else{
      offset = d.getDay();
    }
    const start = new Date(d.getFullYear(), d.getMonth(), d.getDate() - offset);
    const end = addDaysLocal(start, 7);
    return { start, end };
  }
  const start = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const end = addDaysLocal(start, 1);
  return { start, end };
}

function calendarRangeLabel(start, end){
  const monthNames = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
  if(calendarViewMode === 'month'){
    return `${monthNames[start.getMonth()]} ${start.getFullYear()}`;
  }
  if(calendarViewMode === 'week'){
    const endDisplay = addDaysLocal(end, -1);
    return `${formatShortDate(isoDate(start))} – ${formatShortDate(isoDate(endDisplay))}`;
  }
  return `${turkishDayName(isoDate(start))}, ${formatShortDate(isoDate(start))}`;
}

async function refreshCalendarView(){
  const gridBox = document.getElementById('calGridContainer');
  const label = document.getElementById('calNavLabel');
  if(!gridBox) return;

  const { start, end } = getCalendarRangeForView();
  if(label) label.textContent = calendarRangeLabel(start, end);

  const cacheKey = `${calendarViewMode}:${isoDate(start)}`;
  let matched = calendarViewCache[cacheKey];
  if(matched === undefined){
    gridBox.textContent = 'Yükleniyor…';
    const events = await fetchEventsInRange(start, end);
    if(!document.getElementById('calGridContainer')) return;
    if(events === null){
      gridBox.innerHTML = '<div class="cal-day-empty" style="color:var(--muted);">Randevular yüklenemedi.</div>';
      return;
    }
    matched = matchClientEvents(events);
    calendarViewCache[cacheKey] = matched;
  }

  const byDate = {};
  matched.forEach(({ev,client})=>{
    const dt = ev.start && (ev.start.dateTime || ev.start.date);
    if(!dt) return;
    const dateStr = dt.slice(0,10);
    if(!byDate[dateStr]) byDate[dateStr] = [];
    byDate[dateStr].push({ ev, client });
  });

  gridBox.innerHTML = renderCalendarGrid(start, byDate);
  wireCalendarGrid(byDate);
  renderCalendarSelectedList(byDate);
}

function renderCalendarGrid(rangeStart, byDate){
  if(calendarViewMode === 'month') return renderMonthGrid(rangeStart, byDate);
  if(calendarViewMode === 'week') return renderWeekGrid(rangeStart, byDate);
  return renderDayGrid(rangeStart);
}

function renderMonthGrid(monthStart, byDate){
  const mondayFirst = getCalendarPrefs().weekStartsMonday;
  const dayNames = mondayFirst ? ['Pt','Sa','Ça','Pe','Cu','Ct','Pz'] : ['Pz','Pt','Sa','Ça','Pe','Cu','Ct'];
  const year = monthStart.getFullYear(), month = monthStart.getMonth();
  const firstOfMonth = new Date(year, month, 1);
  let startOffset;
  if(mondayFirst){
    startOffset = firstOfMonth.getDay() - 1;
    if(startOffset < 0) startOffset = 6;
  }else{
    startOffset = firstOfMonth.getDay();
  }
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const todayStr = todayIso();
  let cells = '';
  for(let i=0;i<startOffset;i++) cells += `<div class="cal-big-cell empty"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const iso = `${year}-${pad2(month+1)}-${pad2(d)}`;
    const count = (byDate[iso]||[]).length;
    const cls = ['cal-big-cell'];
    if(iso === todayStr) cls.push('today');
    if(iso === calendarSelectedDate) cls.push('selected');
    if(count) cls.push('has-events');
    cells += `<button type="button" class="${cls.join(' ')}" data-date="${iso}"><span class="cal-big-cell-num">${d}</span>${count?`<span class="cal-big-cell-dot"></span>`:''}</button>`;
  }
  return `
    <div class="cal-month-weekdays">${dayNames.map(d=>`<span>${d}</span>`).join('')}</div>
    <div class="cal-month-grid">${cells}</div>
  `;
}

function renderWeekGrid(weekStart, byDate){
  const dayNamesFull = ['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'];
  const todayStr = todayIso();
  let cells = '';
  for(let i=0;i<7;i++){
    const d = addDaysLocal(weekStart, i);
    const iso = isoDate(d);
    const count = (byDate[iso]||[]).length;
    const cls = ['cal-week-cell'];
    if(iso === todayStr) cls.push('today');
    if(iso === calendarSelectedDate) cls.push('selected');
    cells += `<button type="button" class="${cls.join(' ')}" data-date="${iso}">
      <span class="cal-week-cell-day">${dayNamesFull[d.getDay()].slice(0,3)}</span>
      <span class="cal-week-cell-num">${d.getDate()}</span>
      ${count?`<span class="cal-week-cell-count">${count}</span>`:''}
    </button>`;
  }
  return `<div class="cal-week-grid">${cells}</div>`;
}

function renderDayGrid(dayStart){
  const iso = isoDate(dayStart);
  calendarSelectedDate = iso;
  return ''; // the date is already shown in the navigation bar above
}

function wireCalendarGrid(byDate){
  document.querySelectorAll('#calGridContainer [data-date]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      calendarSelectedDate = btn.getAttribute('data-date');
      const { start } = getCalendarRangeForView();
      document.getElementById('calGridContainer').innerHTML = renderCalendarGrid(start, byDate);
      wireCalendarGrid(byDate);
      renderCalendarSelectedList(byDate);
    });
  });
}

/* ---------- Home calendar: create an appointment straight from a chosen day ---------- */
// Step 1 pick the client, step 2 (couples/families) who it is for, step 3 the same appointment panel as on the client page
// (time, duration, invites, weekly repeat, past-date session note), so every existing rule applies unchanged.
function openHomeAppointmentDialog(dateStr){
  if(document.getElementById('calendarPanel')) return; // a client page panel is already in the DOM
  const overlay = document.createElement('div');
  overlay.className = 'home-appt-overlay';
  overlay.innerHTML = `<div class="home-appt-box" role="dialog" aria-modal="true">
    <div class="home-appt-head"><strong class="home-appt-title"></strong><button type="button" class="home-appt-close" title="Kapat">✕</button></div>
    <div class="home-appt-body"></div></div>`;
  document.body.appendChild(overlay);
  const titleEl = overlay.querySelector('.home-appt-title');
  const body = overlay.querySelector('.home-appt-body');
  let observer = null;
  const close = ()=>{ if(observer) observer.disconnect(); overlay.remove(); };
  overlay.querySelector('.home-appt-close').addEventListener('click', close);
  overlay.addEventListener('click', ev => { if(ev.target === overlay) close(); });

  const clients = (state.clients || []).filter(c => !(c.profile && c.profile.terminated))
    .sort((a,b)=> clientDisplayName(a).localeCompare(clientDisplayName(b), 'tr'));

  function stepClient(){
    titleEl.textContent = `${turkishDayName(dateStr)}, ${formatShortDate(dateStr)} — danışan seç`;
    body.innerHTML = `<input type="search" class="home-appt-search" placeholder="Danışan ara…" autocomplete="off">
      <div class="home-appt-list"></div>`;
    const input = body.querySelector('.home-appt-search');
    const list = body.querySelector('.home-appt-list');
    const draw = ()=>{
      const q = normalizeForSearch(input.value.trim()); // "ug" finds "Uğur", "is" finds "İş…"
      const hits = clients.filter(c => !q || normalizeForSearch(clientDisplayName(c)).includes(q)
        || normalizeForSearch(c.name).includes(q)
        || normalizeForSearch((c.profile && c.profile.secondPerson && c.profile.secondPerson.name) || '').includes(q));
      list.innerHTML = hits.length ? hits.map(c => `<button type="button" class="home-appt-client" data-id="${escapeAttr(c.id)}">
          ${hasNamedSecondPerson(c) ? '👥' : '👤'} ${escapeHtml(clientDisplayName(c))}</button>`).join('')
        : '<div class="cal-day-empty">Eşleşen danışan yok.</div>';
      list.querySelectorAll('.home-appt-client').forEach(b => b.addEventListener('click', ()=>{
        const c = state.clients.find(x => x.id === b.dataset.id);
        if(!c) return;
        if(hasNamedSecondPerson(c)) stepWho(c); else stepPanel(c, '');
      }));
    };
    input.addEventListener('input', draw);
    draw();
    setTimeout(()=> input.focus(), 30);
  }

  function stepWho(c){
    const a = c.name, b = c.profile.secondPerson.name.trim();
    titleEl.textContent = `${clientDisplayName(c)} — kim için?`;
    body.innerHTML = `<div class="home-appt-who">
        <button type="button" data-v="both">👥 Birlikte — ${escapeHtml(a)} & ${escapeHtml(b)}</button>
        <button type="button" data-v="primary">👤 Sadece ${escapeHtml(a)}</button>
        <button type="button" data-v="second">👤 Sadece ${escapeHtml(b)}</button>
      </div>
      <button type="button" class="home-appt-back">← Başka danışan seç</button>`;
    body.querySelectorAll('.home-appt-who button').forEach(btn => btn.addEventListener('click', ()=> stepPanel(c, btn.dataset.v)));
    body.querySelector('.home-appt-back').addEventListener('click', stepClient);
  }

  function stepPanel(c, who){
    titleEl.textContent = `${clientDisplayName(c)} — randevu`;
    body.innerHTML = calendarPanelHtml(c) + `<button type="button" class="home-appt-back">← Başka danışan seç</button>`;
    const panel = body.querySelector('#calendarPanel');
    panel.classList.add('open');
    const dtBtn = panel.querySelector('.cal-datetime-btn');
    dtBtn.setAttribute('data-date', dateStr);
    dtBtn.textContent = calDateTimeButtonLabel(dateStr, '');
    wireCalendarPanel(c); // loads that day's existing appointments because the panel is open
    const withSel = panel.querySelector('.cal-with');
    if(withSel && who){ withSel.value = who; withSel.dispatchEvent(new Event('change')); }
    body.querySelector('.home-appt-back').addEventListener('click', ()=>{ if(observer) observer.disconnect(); observer = null; stepClient(); });
    // The panel closes itself after a successful create (and re-renders the home page) — close the dialog with it.
    observer = new MutationObserver(()=>{ if(!panel.classList.contains('open')) close(); });
    observer.observe(panel, { attributes: true, attributeFilter: ['class'] });
    dtBtn.click(); // go straight to picking the time
  }

  stepClient();
}

function renderCalendarSelectedList(byDate){
  const listBox = document.getElementById('calSelectedList');
  if(!listBox) return;
  renderCalendarSelectedListInner(byDate, listBox);
  const addBtn = document.createElement('button');
  addBtn.type = 'button';
  addBtn.className = 'home-new-appt-btn';
  addBtn.innerHTML = `<span class="plus">+</span><span class="txt"><span>Yeni randevu</span><span class="sub">${escapeHtml(turkishDayName(calendarSelectedDate))}, ${escapeHtml(formatShortDate(calendarSelectedDate))}</span></span>`;
  addBtn.addEventListener('click', ()=> openHomeAppointmentDialog(calendarSelectedDate));
  listBox.insertBefore(addBtn, listBox.firstChild);
  if(getExtraCalendars().length && !(calendarViewMode === 'week' && weekShowFullWeek)){
    const day = calendarSelectedDate;
    const holder = document.createElement('div');
    listBox.appendChild(holder);
    fetchExtraEventsForDay(day).then(items => {
      if(day !== calendarSelectedDate || !holder.isConnected) return;
      holder.innerHTML = items === null ? '<div class="extra-cal-block"><div class="extra-cal-head">Diğer takvimler yüklenemedi (Google bağlantısı gerekebilir)</div></div>' : extraEventsHtml(items);
    }).catch(()=>{});
  }
}

function renderCalendarSelectedListInner(byDate, listBox){
  const dayRowHtml = (items)=> items.map(({ev,client})=>{
    const timeLabel = ev.start.dateTime ? formatEventTime(ev.start.dateTime) : 'Tüm gün';
    return `<div class="cal-day-event-row" data-client-id="${client.id}">
      <span class="cal-day-event-time">${timeLabel}</span>
      <span class="cal-day-event-title cal-client-link" data-client-id="${client.id}">${escapeHtml(clientDisplayName(client))}</span>
    </div>`;
  }).join('');

  if(calendarViewMode === 'week'){
    let html;
    if(weekShowFullWeek){
      const { start } = getCalendarRangeForView();
      let inner = '';
      for(let i=0;i<7;i++){
        const d = addDaysLocal(start, i);
        const iso = isoDate(d);
        const items = byDate[iso] || [];
        if(!items.length) continue;
        inner += `<div class="agenda-day-group"><div class="agenda-day-header">${turkishDayName(iso)}, ${formatShortDate(iso)}</div>${dayRowHtml(items)}</div>`;
      }
      html = `<button type="button" class="cal-week-toggle-btn" id="calWeekToggleBtn">📅 Sadece seçili günü göster</button>${inner || '<div class="cal-day-empty">Bu hafta danışan randevusu yok.</div>'}`;
    }else{
      const items = byDate[calendarSelectedDate] || [];
      const inner = items.length
        ? `<div class="agenda-day-group">${dayRowHtml(items)}</div>`
        : `<div class="cal-day-empty">${formatShortDate(calendarSelectedDate)} için randevu yok.</div>`;
      html = `<button type="button" class="cal-week-toggle-btn" id="calWeekToggleBtn">📆 Tüm Haftayı Göster</button>${inner}`;
    }
    listBox.innerHTML = html;
    document.getElementById('calWeekToggleBtn').addEventListener('click', ()=>{
      weekShowFullWeek = !weekShowFullWeek;
      renderCalendarSelectedList(byDate);
    });
  }else{
    const items = byDate[calendarSelectedDate] || [];
    listBox.innerHTML = items.length
      ? `<div class="agenda-day-group">${dayRowHtml(items)}</div>`
      : `<div class="cal-day-empty">${formatShortDate(calendarSelectedDate)} için randevu yok.</div>`;
  }
  wirePastCalendarButtons(listBox);
}

// Desktop: the calendar box reaches at least to the bottom of the window (small margin), and grows past it with its content.
function sizeHomeCalendar(){
  const el = document.getElementById('homeCalendarList');
  if(!el) return;
  if(window.innerWidth <= 768){ el.style.minHeight = ''; return; }
  const top = el.getBoundingClientRect().top + window.scrollY;
  el.style.minHeight = Math.max(320, window.innerHeight - top - 20) + 'px';
}
window.addEventListener('resize', ()=> sizeHomeCalendar());

function renderHome(){
  requestAnimationFrame(sizeHomeCalendar);
  const main = document.getElementById('main');
  if(!state.generalTodos) state.generalTodos = [];
      if(!state.prospects) state.prospects = [];

  const tasks = [];
  const doneTasks = [];
  state.clients.forEach(client=>{
    (client.todos||[]).forEach(t=>{
      if(!t.done) tasks.push({ clientId: client.id, clientName: client.name, todo:t });
      else doneTasks.push({ clientId: client.id, clientName: client.name, todo:t });
    });
  });
  state.generalTodos.forEach(t=>{
    if(!t.done) tasks.push({ clientId: null, clientName: null, todo:t });
    else doneTasks.push({ clientId: null, clientName: null, todo:t });

    tasks.sort((a,b)=> (a.todo.dueDate||'9999-99-99').localeCompare(b.todo.dueDate||'9999-99-99') || (b.todo.importance-a.todo.importance));

    <div id="clientHeader"><h2>Ana Sayfa</h2></div>
    ${formAlertsBannerHtml()}
    <div id="clientSub">${tasks.length} bekleyen iş • sağda danışan randevuları</div>
    ${birthdayBannerHtml()}
    <div class="home-mobile-tabs">
      <button class="home-tab-btn ${homeMobileTab==='tasks'?'active':''}" data-tab="tasks">✅ Görevler</button>
      <button class="home-tab-btn ${homeMobileTab==='calendar'?'active':''}" data-tab="calendar">📅 Takvim</button>
    </div>
    <div class="home-columns home-mobile-tab-${homeMobileTab}">
      <div class="home-tasks-col">
        <div class="todo-add-row">
          <input type="text" class="home-todo-text" placeholder="Yapılacak iş…">
          <select class="home-todo-importance">
            <option value="1">⭐ Düşük</option>
            <option value="2" selected>⭐⭐ Orta</option>
            <option value="3">⭐⭐⭐ Yüksek</option>
          </select>
          <input type="date" class="home-todo-duedate">
          <div class="client-picker">
            <input type="text" class="home-todo-client-search" placeholder="Danışan ara (opsiyonel)…" autocomplete="off">
            <input type="hidden" class="home-todo-client-id" value="">
            <div class="client-picker-list"></div>
          </div>
          ${newTaskExtrasHtml('home')}
          <button class="home-todo-add-btn" type="button">Ekle</button>
        </div>
        <div class="home-sort-row">
          <label>Sırala</label>
          <select id="homeSortSelect">
            <option value="due" ${homeSortMode==='due'?'selected':''}>Son tarihe göre</option>
            <option value="importance" ${homeSortMode==='importance'?'selected':''}>Öneme göre</option>
          </select>
        </div>
        <div id="homeTaskList">
          ${tasks.length ? tasks.map(({clientId,clientName,todo})=>homeTaskRowHtml(clientId,clientName,todo)).join('') : `<div class="todo-empty">Hiç bekleyen iş yok.</div>`}
        </div>
        ${doneTasks.length ? `
        <div class="todo-done-header home-done-toggle" id="homeDoneToggle">
          <span>Tamamlananlar (${doneTasks.length})</span>
          <span class="practice-section-arrow">${homeDoneCollapsed ? '▸' : '▾'}</span>
        </div>
        <div id="homeDoneTaskList" class="${homeDoneCollapsed ? 'collapsed' : ''}">
          ${doneTasks.map(({clientId,clientName,todo})=>homeTaskRowHtml(clientId,clientName,todo)).join('')}
        </div>` : ''}
      </div>
      <div class="home-calendar-col">
        <h3 class="home-col-title">📅 Danışan Randevuları</h3>
        <div id="homeCalendarList" class="home-calendar-list">Yükleniyor…</div>
      </div>
    </div>
  `;

  loadHomeCalendarView();

  document.querySelectorAll('.owed-client-name.cal-client-link').forEach(link=>{
    link.addEventListener('click', ()=>{
      const clientId = link.getAttribute('data-client-id');
      activeClientId = clientId;
      mainView = 'client';
      document.body.classList.add('mobile-detail');
      render();
    });
  });

  document.querySelectorAll('.birthday-item.cal-client-link').forEach(link=>{
    link.addEventListener('click', ()=>{
      const clientId = link.getAttribute('data-client-id');
      activeClientId = clientId;
      mainView = 'client';
      document.body.classList.add('mobile-detail');
      render();
    });
  });

  document.querySelectorAll('.home-tab-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      homeMobileTab = btn.getAttribute('data-tab');
      renderHome();
    });
  });

  document.getElementById('backToListBtn').addEventListener('click', ()=>{
    document.body.classList.remove('mobile-detail');
  });

  const homeDoneToggle = document.getElementById('homeDoneToggle');
  if(homeDoneToggle){
    homeDoneToggle.addEventListener('click', ()=>{
      homeDoneCollapsed = !homeDoneCollapsed;
      renderHome();
    });
  }

  document.getElementById('homeSortSelect').addEventListener('change', (ev)=>{
    homeSortMode = ev.target.value;
    renderHome();
  });

  wireHomeClientPicker();

  wireNewTaskExtras(document, 'home');
  document.querySelector('.home-todo-add-btn').addEventListener('click', ()=>{
    const textInput = document.querySelector('.home-todo-text');

    const clientId = document.querySelector('.home-todo-client-id').value;
    const newTodo = { id: uid(), text, importance, dueDate, done:false, doneAt:null, ...takeNewTaskExtras('home') };
    if(clientId){

      client.todos = client.todos || [];

      renderHome();
    });
    row.querySelector('.home-task-text-input').addEventListener('blur', (ev)=>{
      const list = clientId ? state.clients.find(c=>c.id===clientId).todos : state.generalTodos;
      const todo = list.find(t=>t.id===todoId);
      const val = ev.target.value.trim();
      if(val){ todo.text = val; saveState(); }
      else{ ev.target.value = todo.text; }

    const taskTextEl = row.querySelector('.home-task-text-input');
    const autoResize = ()=>{ taskTextEl.style.height = 'auto'; taskTextEl.style.height = taskTextEl.scrollHeight + 'px'; };
    taskTextEl.addEventListener('input', autoResize);

    row.querySelector('.home-task-importance-select').addEventListener('change', (ev)=>{
      const list = clientId ? state.clients.find(c=>c.id===clientId).todos : state.generalTodos;
      const todo = list.find(t=>t.id===todoId);
      todo.importance = Number(ev.target.value);
      saveState();
      renderHome();
    });
    row.querySelector('.home-task-duedate-input').addEventListener('change', (ev)=>{
      const list = clientId ? state.clients.find(c=>c.id===clientId).todos : state.generalTodos;
      const todo = list.find(t=>t.id===todoId);
      todo.dueDate = ev.target.value;
      saveState();
      renderHome();
    });
    {
      const list = clientId ? state.clients.find(c=>c.id===clientId).todos : state.generalTodos;
      const todo = list.find(t=>t.id===todoId);
      wireTaskExtras(row, todo, saveState, renderHome);
    }

      if(!confirm('Bu iş silinsin mi?')) return;
      if(clientId){
        const client = state.clients.find(c=>c.id===clientId);
        client.todos = client.todos.filter(t=>t.id!==todoId);
      }else{
        state.generalTodos = state.generalTodos.filter(t=>t.id!==todoId);
      }
      saveState();
      renderHome();
    });
    const clientBadge = row.querySelector('.home-task-client');

        activeClientId = clientId;
        mainView = 'client';
        document.body.classList.add('mobile-detail');
        render();
      });
    }
  });
}

function wireHomeClientPicker(){
  const wrap = document.querySelector('.client-picker');
  const searchInput = wrap.querySelector('.home-todo-client-search');
  const hiddenId = wrap.querySelector('.home-todo-client-id');
  const listEl = wrap.querySelector('.client-picker-list');

  function renderOptions(query){
    const q = normalizeForSearch(query.trim());
    const matches = q ? state.clients.filter(c=>normalizeForSearch(c.name).includes(q)) : state.clients;
    listEl.innerHTML = matches.length
      ? matches.map(c=>`<div class="client-picker-item" data-id="${c.id}">${escapeHtml(c.name)}</div>`).join('')
      : `<div class="client-picker-empty">Eşleşme yok</div>`;
    listEl.querySelectorAll('.client-picker-item').forEach(item=>{
      item.addEventListener('click', ()=>{
        hiddenId.value = item.getAttribute('data-id');
        searchInput.value = item.textContent;
        listEl.classList.remove('open');
      });
    });
  }

  searchInput.addEventListener('focus', ()=>{
    renderOptions(searchInput.value);
    listEl.classList.add('open');
  });
  searchInput.addEventListener('input', ()=>{
    hiddenId.value = '';
    renderOptions(searchInput.value);
    listEl.classList.add('open');
  });
  document.addEventListener('click', (ev)=>{
    if(!ev.target.closest('.client-picker')) listEl.classList.remove('open');
  });
}

function homeTaskRowHtml(clientId, clientName, todo){
  const overdue = !todo.done && todo.dueDate && todo.dueDate < todayIso();
  return `
  <div class="home-task-row ${todo.done?'done':''} ${dueDateUrgencyClass(todo.dueDate, todo.done, 'home')}" data-client-id="${clientId||''}" data-todo-id="${todo.id}">
    <input type="checkbox" class="home-task-check" ${todo.done?'checked':''}>
    <div class="home-task-main">
      <textarea class="home-task-text-input" rows="1">${escapeHtml(todo.text)}</textarea>
      <div class="home-task-meta">
        ${clientName ? `<span class="home-task-client">${escapeHtml(clientName)}</span>` : `<span class="home-task-general">Genel</span>`}
        <select class="home-task-importance-select">
          <option value="1" ${todo.importance===1?'selected':''}>⭐ Düşük</option>
          <option value="2" ${todo.importance===2?'selected':''}>⭐⭐ Orta</option>
          <option value="3" ${todo.importance===3?'selected':''}>⭐⭐⭐ Yüksek</option>
        </select>
        <input type="date" class="home-task-duedate-input ${overdue?'overdue':''}" value="${todo.dueDate||''}">
        ${taskExtrasToggleHtml(todo)}
      </div>
      ${taskExtrasBodyHtml(todo)}
    </div>
    <button class="home-task-del" title="Sil">✕</button>
  </div>`;
}
